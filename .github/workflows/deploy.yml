name: Validate & Deploy Locale

# Prod    = push to main → localetrips.app (root)
# Staging = push to dev  → localetrips.app/stg/  (prod root files come from main and stay untouched)
# Deploys are atomic: if any validation or build check fails, the live site is unchanged.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

env:
  # The ONLY files that get published. Update this list when adding a page.
  DEPLOY_FILES: index.html locale.html locale-v2.html og-card.png whats-new.html

jobs:
  validate:
    name: Validate app files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all deployable files exist
        run: |
          for f in $DEPLOY_FILES; do
            if [ ! -f "$f" ]; then
              echo "❌ $f not found!"
              exit 1
            fi
          done
          echo "✅ All deployable files present"

      - name: Check required script tags (both app files)
        run: |
          for app in locale.html locale-v2.html; do
            for tag in react.production.min.js react-dom.production.min.js babel.min.js; do
              if ! grep -q "$tag" "$app"; then
                echo "❌ $app missing required script: $tag"
                exit 1
              fi
            done
          done
          echo "✅ All required CDN scripts present"

      - name: Brace balance check (both app files)
        run: |
          for app in locale.html locale-v2.html; do
            OPEN=$(grep -o '{' "$app" | wc -l)
            CLOSE=$(grep -o '}' "$app" | wc -l)
            DIFF=$((OPEN - CLOSE))
            if [ ${DIFF#-} -gt 50 ]; then
              echo "⚠️ $app brace mismatch: $OPEN open, $CLOSE close (diff: $DIFF)"
              exit 1
            fi
          done
          echo "✅ Brace balance OK"

      - name: Secret scan (all HTML files)
        run: |
          if grep -rlE "sk-ant-[a-zA-Z0-9-]{20,}" --include="*.html" .; then
            echo "🚨 SECURITY: Anthropic API key found! Remove before deploying."
            exit 1
          fi
          if grep -rlE "\bre_[A-Za-z0-9]{20,}" --include="*.html" .; then
            echo "🚨 SECURITY: possible Resend API key found! Remove before deploying."
            exit 1
          fi
          if grep -rl "service_role" --include="*.html" .; then
            echo "🚨 SECURITY: service_role reference found! Remove before deploying."
            exit 1
          fi
          # A leaked Supabase service_role key is a base64 JWT, so the literal
          # grep above can never see it. Decode every JWT payload and check the
          # role claim. The anon key is expected and allowed (RLS protects it).
          FOUND=0
          for tok in $(grep -rhoE "eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}" --include="*.html" . | sort -u); do
            PAYLOAD=$(echo "$tok" | cut -d. -f2)
            PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 )); for i in $(seq 1 $PAD); do PAYLOAD="${PAYLOAD}="; done
            DECODED=$(echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
            if echo "$DECODED" | grep -q "service_role"; then
              echo "🚨 SECURITY: a service_role JWT is embedded in a deployable file! Remove before deploying."
              FOUND=1
            fi
          done
          [ "$FOUND" = "1" ] && exit 1
          echo "✅ No secrets found"

      # A crew member's whole Crew tab died on "Can't find variable: isMe" — a name
      # declared inside a .map() closure and read from the sibling branch below it.
      # Syntactically valid, so the parse gate passed; a hard ReferenceError for
      # every non-owner, and invisible to the owner because owners never render
      # that branch. This step catches the entire class before it reaches anyone.
      - name: Undefined-variable scan (no-undef)
        run: |
          python3 - <<'PY'
          import re
          src = open('locale-v2.html', encoding='utf-8').read()
          blocks = re.findall(r'<script type="text/babel"[^>]*>(.*?)</script>', src, flags=re.S)
          open('app.jsx', 'w').write(blocks[0])
          PY
          cat > .eslintrc.json <<'JSON'
          {
            "root": true,
            "parser": "@babel/eslint-parser",
            "parserOptions": {
              "ecmaVersion": 2022, "sourceType": "script", "requireConfigFile": false,
              "babelOptions": { "presets": ["@babel/preset-react"] },
              "ecmaFeatures": { "jsx": true }
            },
            "env": { "browser": true, "es2022": true },
            "globals": { "React": "readonly", "ReactDOM": "readonly", "supabase": "readonly", "Babel": "readonly", "XLSX": "readonly", "Papa": "readonly" },
            "rules": { "no-undef": "error" }
          }
          JSON
          npm i --no-audit --no-fund --legacy-peer-deps --silent \
            eslint@8.57.0 @babel/eslint-parser @babel/preset-react @babel/core
          UNDEF=$(npx eslint app.jsx -f unix 2>/dev/null | grep "no-undef" || true)
          if [ -n "$UNDEF" ]; then
            echo "$UNDEF"
            echo "🚨 Undefined variable in locale-v2.html — this is a runtime crash for whoever hits that branch."
            exit 1
          fi
          echo "✅ Every identifier resolves"

  # ── Production: main → site root ──────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (allowlist only)
        run: |
          mkdir -p _site
          cp $DEPLOY_FILES _site/

      - name: Verify build before deploy
        run: |
          for f in $DEPLOY_FILES; do
            if [ ! -f "_site/$f" ]; then
              echo "❌ _site/$f missing — aborting, live site unchanged"
              exit 1
            fi
          done
          echo "✅ Build verified — deploying"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Staging: dev → /stg/, with prod (main) kept at root ──────────────
  deploy-staging:
    name: Deploy Staging (/stg/)
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Checkout main (prod root stays live)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main

      - name: Build site (prod at root + dev under /stg/)
        run: |
          mkdir -p _site/stg
          (cd _main && cp $DEPLOY_FILES ../_site/)
          cp $DEPLOY_FILES _site/stg/

      - name: Verify build before deploy
        run: |
          for f in $DEPLOY_FILES; do
            [ -f "_site/$f" ] || { echo "❌ prod file $f missing — aborting"; exit 1; }
            [ -f "_site/stg/$f" ] || { echo "❌ staging file $f missing — aborting"; exit 1; }
          done
          echo "✅ Build verified — deploying"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
