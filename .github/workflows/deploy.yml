name: Validate & Deploy Locale

# Prod    = push to main → localetrips.app (root)
# Staging = push to dev  → localetrips.app/stg/  (prod root files come from main and stay untouched)
# Deploys are atomic: if any validation or build check fails, the live site is unchanged.
#
# FIX 2026-08-11 (Fania + Claude, see reviews/SECURITY-REVIEW-2026-08-09.md follow-up):
# GitHub Pages serves ONE artifact per site. The old workflow had deploy-production and
# deploy-staging each build and upload their OWN artifact independently — whichever job
# ran last silently replaced the other's content. A push to main (prod deploy #197) wiped
# /stg/ off the live site with no error, no warning, and no advisor to catch it, because
# Pages deploys aren't scanned by preflight.sh, CI's own checks, or the Supabase advisors.
# Fix: a single deploy job that ALWAYS checks out both main and dev and rebuilds the full
# site (root + /stg/) on every push to either branch, so neither ref can ever go stale.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  # The ONLY files that get published. Update this list when adding a page.
  DEPLOY_FILES: index.html locale.html locale-v2.html og-card.png whats-new.html

jobs:
  validate:
    name: Validate app files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all deployable files exist
        run: |
          for f in $DEPLOY_FILES; do
            if [ ! -f "$f" ]; then
              echo "❌ $f not found!"
              exit 1
            fi
          done
          echo "✅ All deployable files present"

      # locale.html was retired to a redirect on 2026-09-02 (SECURITY-REVIEW-2026-09-02,
      # H2). It is still deployed so old bookmarks and invite links keep resolving, but it
      # is no longer an app file, so the app-file checks below run against locale-v2.html
      # only. APP_FILES is the list to extend when a real second app appears.
      - name: Check required script tags (app files)
        run: |
          for app in locale-v2.html; do
            for tag in react.production.min.js react-dom.production.min.js babel.min.js; do
              if ! grep -q "$tag" "$app"; then
                echo "❌ $app missing required script: $tag"
                exit 1
              fi
            done
          done
          echo "✅ All required CDN scripts present"

      - name: Check locale.html still forwards to the live app
        run: |
          if ! grep -q "locale-v2.html" locale.html; then
            echo "❌ locale.html no longer points at locale-v2.html — old links would 404 into a dead page"
            exit 1
          fi
          if ! grep -q "window.location.search + window.location.hash" locale.html; then
            echo "❌ locale.html redirect dropped the query/fragment forward — #s= share links would break"
            exit 1
          fi
          echo "✅ locale.html forwards correctly (fragment preserved)"

      - name: Brace balance check (app files)
        run: |
          for app in locale-v2.html; do
            OPEN=$(grep -o '{' "$app" | wc -l)
            CLOSE=$(grep -o '}' "$app" | wc -l)
            DIFF=$((OPEN - CLOSE))
            if [ ${DIFF#-} -gt 50 ]; then
              echo "⚠️ $app brace mismatch: $OPEN open, $CLOSE close (diff: $DIFF)"
              exit 1
            fi
          done
          echo "✅ Brace balance OK"

      - name: Secret scan (all HTML files)
        run: |
          if grep -rlE "sk-ant-[a-zA-Z0-9-]{20,}" --include="*.html" .; then
            echo "🚨 SECURITY: Anthropic API key found! Remove before deploying."
            exit 1
          fi
          if grep -rlE "\bre_[A-Za-z0-9]{20,}" --include="*.html" .; then
            echo "🚨 SECURITY: possible Resend API key found! Remove before deploying."
            exit 1
          fi
          if grep -rl "service_role" --include="*.html" .; then
            echo "🚨 SECURITY: service_role reference found! Remove before deploying."
            exit 1
          fi
          # A leaked Supabase service_role key is a base64 JWT, so the literal
          # grep above can never see it. Decode every JWT payload and check the
          # role claim. The anon key is expected and allowed (RLS protects it).
          FOUND=0
          for tok in $(grep -rhoE "eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}" --include="*.html" . | sort -u); do
            PAYLOAD=$(echo "$tok" | cut -d. -f2)
            PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 )); for i in $(seq 1 $PAD); do PAYLOAD="${PAYLOAD}="; done
            DECODED=$(echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
            if echo "$DECODED" | grep -q "service_role"; then
              echo "🚨 SECURITY: a service_role JWT is embedded in a deployable file! Remove before deploying."
              FOUND=1
            fi
          done
          [ "$FOUND" = "1" ] && exit 1
          echo "✅ No secrets found"

  # ── Deploy: main → site root, dev → /stg/, rebuilt together on every push ──
  # Runs for pushes to EITHER branch so a push to just one never lets the other's
  # published copy go stale or disappear.
  deploy:
    name: Deploy (production + staging)
    needs: validate
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (prod root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main

      - name: Checkout dev (staging, /stg/)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: _dev

      - name: Build site (prod at root + dev under /stg/)
        run: |
          mkdir -p _site/stg
          (cd _main && cp $DEPLOY_FILES ../_site/)
          (cd _dev && cp $DEPLOY_FILES ../_site/stg/)

      - name: Verify build before deploy
        run: |
          for f in $DEPLOY_FILES; do
            [ -f "_site/$f" ] || { echo "❌ prod file $f missing — aborting, live site unchanged"; exit 1; }
            [ -f "_site/stg/$f" ] || { echo "❌ staging file $f missing — aborting, live site unchanged"; exit 1; }
          done
          echo "✅ Build verified — deploying both prod and staging"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
