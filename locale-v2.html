  const isOwner = !trip || trip._myRole==='owner' || !trip._myRole; // members can browse tips, not edit days
  const [open,setOpen]=useState({});
  const [addingPlace,setAddingPlace]=useState(null); // {place} · show day picker
  const [addedId,setAddedId]=useState(null); // recently added, for flash feedback

  const addToDay=(place, dayId)=>{
    if(!trip||!onUpdateTrip||!dayId) return;
    const day=trip.days.find(d=>d.id===dayId);
    if(!day) return;
    const newAct={id:uuid(),name:place.name,emoji:place.emoji||'📍',address:place.address||'',neighborhood:'',bucket:'nice-to-have',category:'sightseeing',bookingRequired:false,notes:place.desc||'',thingsToConsider:[],sortOrder:(day.activities||[]).length};
    const newDays=trip.days.map(d=>d.id===dayId?{...d,activities:[...(d.activities||[]),newAct]}:d);
    onUpdateTrip({...trip,days:newDays});
    setAddedId(place.name);
    setAddingPlace(null);
    setTimeout(()=>setAddedId(null),2500);
  };
  const toggle=k=>setOpen(o=>({...o,[k]:!o[k]}));

  const dests=(destinations||[]).filter(d=>{
    let cityKey=(d.city||'').toLowerCase();
    const resolved=CITY_LOCAL_TIPS[cityKey];
    if(resolved&&resolved['new york']) cityKey='new york';
    const hasLocal=!!CITY_LOCAL_TIPS[cityKey];
    const hasIntl=CITY_DATA[d.countryCode];
    return hasLocal||hasIntl;
  });

  if(!dests.length) return(
    <div style={{padding:'40px 20px',textAlign:'center',color:'var(--color-ink-light)'}}>
      <p style={{fontSize:'1.5rem',marginBottom:8}}>💡</p>
      <p style={{fontFamily:'var(--font-display)',fontSize:'1rem'}}>City tips coming soon</p>
      <p style={{fontSize:'.83rem',marginTop:4}}>Add destinations to your trip to see local tips and nearby ideas.</p>
    </div>
  );

  return(
    <div style={{padding:'0 0 32px'}}>
      {dests.map(dest=>{
        let cityKey=(dest.city||'').toLowerCase();
        // Resolve borough/alias to parent city entry
        const resolved=CITY_LOCAL_TIPS[cityKey];
        if(resolved&&resolved['new york']) cityKey='new york';
        const localData=CITY_LOCAL_TIPS[cityKey];
        const intlData=CITY_DATA[dest.countryCode];
        const sections=[];

        // Nearby · not in your plans
        if(localData?.nearby?.length) sections.push({icon:'🗺️',label:'Nearby · Worth a Detour',type:'places',items:localData.nearby});
        // Local food picks
        if(localData?.food?.length) sections.push({icon:'🍴',label:'Local Food Picks',type:'places',items:localData.food});
        // Insider tips
        if(localData?.tips?.length) sections.push({icon:'💡',label:'Insider Tips',type:'tips',items:localData.tips});
        // International sections
        if(intlData){
          // Use city-specific transport text if available, otherwise fall back to country-level
          const transportText = localData?.transport || intlData.transport;
          sections.push({icon:'🚇',label:'Getting Around',type:'transport',body:transportText,city:dest.city,countryCode:dest.countryCode});
          sections.push({icon:'💳',label:'Tipping & Money',type:'body',body:intlData.tipping});
          if(intlData.customs) sections.push({icon:'🛂',label:'Local Customs',type:'body',body:intlData.customs});
          if(intlData.phrases?.length) sections.push({icon:'💬',label:'Key Phrases',type:'phrases',items:intlData.phrases});
          sections.push({icon:'🆘',label:'Emergency Numbers',type:'body',body:intlData.emergency});
        }

        return(
          <div key={dest.id}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12,paddingTop:4}}>
              <span style={{fontSize:'1.2rem'}}>{dest.countryCode==='US'?'📍':'🌍'}</span>
              <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.2rem',fontWeight:600}}>{dest.city}</h3>
            </div>
            {(trip?.lodging||[]).length===0 && (()=>{
              const q=encodeURIComponent(dest.city||'');
              // Show a pinned idea only under the city it mentions (pins are tagged "(City)").
              // Pins that don't name any trip city are shown everywhere as a fallback.
              const allCities=(trip?.destinations||[]).map(d=>d.city).filter(Boolean);
              const mentions=(text,c)=> !!c && new RegExp('\\b'+c.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+'\\b','i').test(text||'');
              const pinnedStays=(trip?.pinnedIdeas||[]).filter(p=>{
                if(!/^stay in|^day trip|neighborhood/i.test(p.text)) return false;
                const named=allCities.filter(c=>mentions(p.text,c));
                return named.length===0 ? true : named.includes(dest.city);
              });
              return (
                <div className="card" style={{marginBottom:8,padding:'14px 16px',borderLeft:'3px solid var(--color-accent)'}}>
                  <p style={{fontWeight:600,fontSize:'.875rem',marginBottom:4}}>🏨 Where to stay</p>
                  <p style={{fontSize:'.8rem',color:'var(--color-ink-light)',lineHeight:1.5,marginBottom:pinnedStays.length?8:10}}>You haven't added lodging yet. Search stays in {dest.city}, or upload a booking confirmation on the Pre-Trip tab to lock it in.</p>
                  {pinnedStays.length>0 && (
                    <div style={{marginBottom:10}}>
                      <p style={{fontSize:'.7rem',textTransform:'uppercase',letterSpacing:'.05em',color:'var(--color-ink-muted)',fontWeight:600,marginBottom:4}}>📌 Your pinned ideas</p>
                      {pinnedStays.map(p=><p key={p.id} style={{fontSize:'.8rem',color:'var(--color-ink-light)',lineHeight:1.5,marginBottom:3}}>· {p.text}</p>)}
                    </div>
                  )}
                  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                    <a href={`https://www.airbnb.com/s/${q}/homes`} target="_blank" rel="noopener noreferrer" className="btn btn-secondary btn-sm">Airbnb ↗</a>
                    <a href={`https://www.expedia.com/Hotel-Search?destination=${q}`} target="_blank" rel="noopener noreferrer" className="btn btn-secondary btn-sm">Expedia ↗</a>
                    <a href={`https://www.booking.com/searchresults.html?ss=${q}`} target="_blank" rel="noopener noreferrer" className="btn btn-secondary btn-sm">Booking ↗</a>
                  </div>
                </div>
              );
            })()}
            {sections.map((s,i)=>{
              const k=`${dest.id}-${i}`;
              return(
                <div key={i} className="card" style={{marginBottom:8,overflow:'hidden'}}>
                  <button className="tidbit-toggle" onClick={()=>toggle(k)} style={{width:'100%',padding:'13px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',background:'none',border:'none',cursor:'pointer'}}>
                    <span style={{fontWeight:600,fontSize:'.875rem'}}>{s.icon} {s.label}</span>
                    <span style={{color:'var(--color-ink-light)',fontSize:'.7rem'}}>{open[k]?'▲':'▼'}</span>
                  </button>
                  {open[k]&&(
                    <div style={{padding:'0 16px 14px',borderTop:'1px solid var(--color-border)'}}>
                      {s.type==='transport'&&(()=>{
                        const transitApps=CITY_TRANSIT_APPS[(s.city||'').toLowerCase()]||[];
                        return (
                        <div style={{paddingTop:10}}>
                          <p style={{fontSize:'.875rem',color:'var(--color-ink-light)',lineHeight:1.65,marginBottom:12}}>{s.body}</p>
                          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                            {transitApps.map(t=>(
                              <a key={t.url} href={t.url} target="_blank" rel="noopener noreferrer"
                                style={{display:'inline-flex',alignItems:'center',gap:6,background:'var(--color-accent)',color:'#fff',borderRadius:20,padding:'7px 14px',fontSize:'.78rem',fontWeight:500,textDecoration:'none'}}>
                                {t.label}
                              </a>
                            ))}
                            <a href="https://m.uber.com/ul/" target="_blank" rel="noopener noreferrer"
                              style={{display:'inline-flex',alignItems:'center',gap:6,background:'#000',color:'#fff',borderRadius:20,padding:'7px 14px',fontSize:'.78rem',fontWeight:500,textDecoration:'none'}}>
                              🚗 Open Uber
                            </a>
                            <a href="lyft://ridetype?id=lyft" target="_blank" rel="noopener noreferrer"
                              style={{display:'inline-flex',alignItems:'center',gap:6,background:'#FF00BF',color:'#fff',borderRadius:20,padding:'7px 14px',fontSize:'.78rem',fontWeight:500,textDecoration:'none'}}>
                              🩷 Open Lyft
                            </a>
                          </div>
                        </div>
                        );
                      })()}
                      {s.type==='body'&&<p style={{fontSize:'.875rem',color:'var(--color-ink-light)',lineHeight:1.65,paddingTop:10}}>{s.body}</p>}
                      {s.type==='tips'&&s.items.map((t,j)=>(
                        <p key={j} style={{fontSize:'.875rem',color:'var(--color-ink-light)',lineHeight:1.55,marginTop:8,paddingLeft:4,borderLeft:'2px solid var(--color-accent-warm)'}}>  {t}</p>
                      ))}
                      {s.type==='places'&&s.items.map((p,j)=>(
                        <div key={j} style={{marginTop:10,paddingTop:j>0?10:0,borderTop:j>0?'1px solid var(--color-border)':'none'}}>
                          <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:3}}>
                            <span style={{fontSize:'1rem',flexShrink:0}}>{p.emoji}</span>
                            <div style={{flex:1,minWidth:0}}>
                              <span style={{fontWeight:600,fontSize:'.875rem'}}>{p.name}</span>
                              {addedId===p.name&&<span style={{marginLeft:8,fontSize:'.72rem',color:'var(--color-success)',fontWeight:500}}>✅ Added!</span>}
                            </div>
                            {isOwner&&trip&&(trip.days||[]).length>0&&(
                              <button className="btn btn-ghost btn-sm" style={{flexShrink:0,fontSize:'.72rem',padding:'3px 8px'}}
                                onClick={()=>setAddingPlace(addingPlace?.name===p.name?null:{...p})}>
                                {addingPlace?.name===p.name?'Cancel':'+ Day'}
                              </button>
                            )}
                          </div>
                          <p style={{fontSize:'.83rem',color:'var(--color-ink-light)',lineHeight:1.55,marginLeft:24}}>{p.desc}</p>
                          {p.address&&<p style={{fontSize:'.75rem',color:'var(--color-ink-muted)',marginTop:2,marginLeft:24}}>📍 {p.address}</p>}
                          {addingPlace?.name===p.name&&(
                            <div style={{marginLeft:24,marginTop:8,background:'var(--color-accent-soft)',borderRadius:8,padding:'10px 12px',border:'1px solid #C8DFE4'}}>
                              <p style={{fontSize:'.75rem',fontWeight:600,color:'var(--color-accent)',marginBottom:6}}>Add to which day?</p>
                              <div style={{display:'flex',flexDirection:'column',gap:4,maxHeight:180,overflowY:'auto'}}>
                                {(trip.days||[]).map(day=>(
                                  <button key={day.id} className="btn btn-secondary btn-sm" style={{justifyContent:'flex-start',textAlign:'left'}}
                                    onClick={()=>addToDay(p, day.id)}>
                                    {day.label && !/^Day\s*\d+$/i.test(String(day.label).trim()) ? (day.label+' · ') : ''}{formatDateDow(day.date)}
                                  </button>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>
                      ))}
                      {s.type==='phrases'&&s.items.map((p,j)=>(
                        <div key={j} style={{marginTop:8,display:'flex',gap:8,flexWrap:'wrap'}}>
                          <span style={{fontWeight:600,fontSize:'.875rem',minWidth:130}}>{p.phrase}</span>
                          <span style={{fontSize:'.875rem',color:'var(--color-ink-light)',flex:1}}>{p.translation}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

// ── CHECKLIST VIEW ─────────────────────────────────────────────────────────────
function ChecklistView({trip,onUpdate,onUpdateTrip}){
  const isOwner = trip._myRole==='owner' || !trip._myRole; // members view read-only
  const checklist=trip.checklist||[];
  const [collapsed,setCollapsed]=useState({});
  const [newItem,setNewItem]=useState('');
  const [uploadingId,setUploadingId]=useState(null);
  const isBookingTask=(item)=>/lodg|hotel|flight|confirmation|booked|reservation|check.?in/i.test(item.label||'');
  const handleBookingUpload=async(item,file)=>{
    setUploadingId(item.id);
    try{
      const parsed=await parseConfirmationFile(file);
      const {trip:merged,kind}=mergeBookingIntoTrip(trip,parsed);
      if(!kind){ showToast("Couldn't read that as a flight or hotel · try another file.","warn"); return; }
      const newChecklist=(merged.checklist||trip.checklist||[]).map(i=>i.id===item.id?{...i,completed:true}:i);
      if(onUpdateTrip) onUpdateTrip({...merged,checklist:newChecklist}); else onUpdate(newChecklist);
      showToast('Saved '+(kind==='lodging'?'lodging':'flight'+((parsed.flights||[]).length>1?'s':''))+' ✓ and checked off.','info',4000);
    }catch(err){ showToast('Upload failed: '+err.message,'error',5000); }
    finally{ setUploadingId(null); }
  };
  const catLabels={documents:'Documents',bookings:'Bookings',finance:'Finance',tech:'Tech',health:'Health',packing:'Packing',custom:'Custom'};
  const catOrder=['documents','bookings','finance','tech','health','packing','custom'];
  const done=checklist.filter(i=>i.completed).length,total=checklist.length;
  const pct=total>0?Math.round((done/total)*100):0;
  function toggle(id){ if(!isOwner){ showToast('Only the trip owner can check items off.','warn'); return; } onUpdate(checklist.map(i=>i.id===id?{...i,completed:!i.completed}:i)); }
  function addCustom(){
    if(!newItem.trim())return;
    onUpdate([...checklist,{id:uuid(),label:newItem.trim(),emoji:'⭐',category:'custom',completed:false,daysBeforeTrip:null,isAutoGenerated:false,notes:null}]);
    setNewItem('');
  }
  const grouped=catOrder.reduce((acc,cat)=>{const items=checklist.filter(i=>i.category===cat);if(items.length)acc[cat]=items;return acc;},{});
  return(
    <div style={{padding:'0 16px 32px'}}>
      <div className="card" style={{padding:'16px',marginBottom:'16px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <span style={{fontWeight:600,fontSize:'.9rem'}}>Trip Readiness</span>
          <span style={{fontSize:'.85rem',color:'var(--color-ink-light)'}}>{done}/{total} {pct===100?'🎯':'complete'}</span>
        </div>
        <div className="progress-bar-track"><div className="progress-bar-fill" style={{width:`${pct}%`}}/></div>
        {pct===100&&<p style={{color:'var(--color-success)',fontSize:'.85rem',fontWeight:500,marginTop:8}}>✅ All set · have an amazing trip!</p>}
      </div>
      {Object.entries(grouped).map(([cat,items])=>(
        <div key={cat} className="card" style={{marginBottom:10,overflow:'hidden'}}>
          <button onClick={()=>setCollapsed(c=>({...c,[cat]:!c[cat]}))}
            style={{width:'100%',padding:'13px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',background:'none',border:'none',cursor:'pointer',borderBottom:collapsed[cat]?'none':'1px solid var(--color-border)'}}>
            <span style={{fontWeight:600,fontSize:'.875rem'}}>{catLabels[cat]}</span>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span className="pill pill-neutral" style={{padding:'2px 8px',fontSize:'.7rem'}}>{items.filter(i=>i.completed).length}/{items.length}</span>
              <span style={{color:'var(--color-ink-light)',fontSize:'.7rem'}}>{collapsed[cat]?'▼':'▲'}</span>
            </div>
          </button>
          {!collapsed[cat]&&(
            <div style={{padding:'0 16px'}}>
              {items.map(item=>(
                <div key={item.id} className={`checklist-item ${item.completed?'completed':''}`} onClick={()=>toggle(item.id)}>
                  <div className={`checkbox ${item.completed?'checked':''}`}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                      <span style={{fontSize:'.875rem'}}>{item.emoji}</span>
                      <span className="item-label" style={{fontSize:'.875rem'}}>{item.label}</span>
                    </div>
                    {item.notes&&!item.completed&&!item.bookingUrl&&<p style={{fontSize:'.8rem',color:'var(--color-ink-light)',marginTop:2}}>{item.notes}</p>}
                    {(()=>{
                      // Support new bookingUrl field AND legacy "Book at: https://..." in notes
                      const burl=item.bookingUrl||(item.notes&&item.notes.match(/https?:\/\/\S+/)?.[0])||null;
                      return burl&&!item.completed?(
                        <div style={{marginTop:6}} onClick={e=>e.stopPropagation()}>
                          <a href={burl} target="_blank" rel="noopener noreferrer"
                            className="btn btn-primary btn-sm"
                            style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:'.75rem',padding:'4px 10px',borderRadius:20,textDecoration:'none'}}>
                            {item.category==='bookings'&&(item.label||'').toLowerCase().includes('reservation')?'Book reservation →':'Book tickets →'}
                          </a>
                        </div>
                      ):null;
                    })()}
                    {isOwner && isBookingTask(item) && !item.completed && (
                      <div style={{marginTop:6}} onClick={e=>e.stopPropagation()}>
                        <label className="btn btn-secondary btn-sm" style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:'.75rem',padding:'4px 10px',borderRadius:20,cursor:uploadingId===item.id?'default':'pointer'}}>
                          {uploadingId===item.id ? 'Reading…' : '📎 Upload confirmation'}
                          <input type="file" accept="image/*,application/pdf" style={{display:'none'}} disabled={uploadingId===item.id}
                            onChange={e=>{ const f=e.target.files?.[0]; e.target.value=''; if(f) handleBookingUpload(item, f); }}/>
                        </label>
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
      {isOwner && <div className="card" style={{padding:'16px'}}>
        <p className="section-label">Add Custom Item</p>
        <div style={{display:'flex',gap:8}}>
          <input className="input-field" placeholder="e.g. Pick up euros at airport..." value={newItem} onChange={e=>setNewItem(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCustom()} style={{flex:1}}/>
          <button className="btn btn-primary" onClick={addCustom} style={{flexShrink:0}}>Add</button>
        </div>
      </div>}
    </div>
  );
}

// ── PACKING LIST ──────────────────────────────────────────────────────────────

// Inspiration: TREK uses category buckets, per-item checked state, and a
// per-category progress ratio. Locale's version is original vanilla React
// with smart trip-aware defaults, quantity support, and bulk-pack per category.

const PACK_CATS = [
  {id:'clothing',  label:'Clothing',    emoji:'👕'},
  {id:'toiletries',label:'Toiletries',  emoji:'🧴'},
  {id:'tech',      label:'Tech',        emoji:'🔌'},
  {id:'documents', label:'Documents',   emoji:'📄'},
  {id:'health',    label:'Health',      emoji:'💊'},
  {id:'misc',      label:'Misc',        emoji:'🎒'},
];

// Smart starter packs · trip-aware defaults. No code borrowed; these are
// independently written item lists based on common travel planning knowledge.
function buildPackingDefaults(trip){
  const nights = trip.startDate && trip.endDate
    ? Math.max(1, Math.round((new Date(trip.endDate)-new Date(trip.startDate))/(1000*60*60*24)))
    : 5;

  // ── Destination analysis ──────────────────────────────────────────────────
  const dests = trip.destinations || [];
  const isIntl = dests.some(d=>d.isInternational||(d.countryCode&&d.countryCode!=='US'));

  // Beach / tropical destinations
  const BEACH_CITIES = ['Cancun','Cabo','Phuket','Bali','Miami','Honolulu','Tulum','Playa del Carmen','Nassau','Aruba','Barbados','Maldives','Mykonos','Ibiza','Santorini'];
  const isBeach = (trip.title||'').toLowerCase().includes('beach')
    || dests.some(d=>BEACH_CITIES.includes(d.city));

  // Mountain / ski destinations
  const MOUNTAIN_CITIES = ['Aspen','Vail','Breckenridge','Park City','Mammoth','Jackson Hole','Whistler','Zermatt','Chamonix','Banff','Telluride','Steamboat Springs'];
  const isMountain = dests.some(d=>MOUNTAIN_CITIES.includes(d.city));

  const isBiz = (trip.occasion||'') === 'business';

  // ── Climate model: temperature band + wetness, by month & region ──
  const SOUTHERN_HEMISPHERE = ['Australia','New Zealand','Argentina','Chile','South Africa','Brazil','Peru','Bolivia','Uruguay'];
  const isSouthern = dests.some(d=>SOUTHERN_HEMISPHERE.includes(d.country));
  let month = 6; // default June
  if(trip.startDate) month = new Date(trip.startDate).getMonth()+1; // 1-12
  const hemiMonth = isSouthern ? ((month+6-1)%12)+1 : month; // flip for southern hemisphere
  const isWinter = hemiMonth>=12 || hemiMonth<=2;
  const isSummer = hemiMonth>=6 && hemiMonth<=8;
  const isSpringFall = !isWinter && !isSummer;
  const NORTHERN_EU_CITIES = ['London','Paris','Amsterdam','Berlin','Copenhagen','Stockholm','Edinburgh','Dublin','Brussels','Vienna','Prague','Warsaw','Oslo','Helsinki','Reykjavik'];
  const isNorthernEu = dests.some(d=>NORTHERN_EU_CITIES.includes(d.city));

  // tempBand = how warm to pack for: 'hot' | 'warm' | 'mild' | 'cold' | 'frigid'.
  // Fixes over-packing: e.g. London/Paris in Sept is MILD, not thermal-layer cold.
  let tempBand;
  if (isMountain)        tempBand = isWinter ? 'frigid' : 'cold';
  else if (isBeach)      tempBand = 'hot';
  else if (isNorthernEu) tempBand = isWinter ? 'cold' : isSummer ? 'warm' : ((hemiMonth===3 || hemiMonth===11) ? 'cold' : 'mild');
  else                   tempBand = isWinter ? 'cold' : isSummer ? 'warm' : 'mild';

  const isFrigid   = tempBand==='frigid';
  const isColdBand = tempBand==='cold';
  const isMild     = tempBand==='mild';
  const isWarm     = tempBand==='warm';
  const isHot      = tempBand==='hot' || isBeach;
  const isCold     = isFrigid || isColdBand;          // back-compat for toiletries/health
  const isRainy    = isNorthernEu && !isSummer;        // UK/EU shoulder & winter · pack rain protection

  // ── Power adapter logic ───────────────────────────────────────────────────
  const UK_CITIES = ['London','Manchester','Edinburgh','Dublin','Glasgow','Birmingham','Liverpool'];
  const EU_CITIES = ['Paris','Rome','Barcelona','Madrid','Berlin','Amsterdam','Vienna','Prague','Lisbon','Athens','Copenhagen','Stockholm','Brussels','Zurich','Geneva'];
  const AU_CITIES = ['Sydney','Melbourne','Brisbane','Perth','Auckland','Wellington'];
  const JP_CITIES = ['Tokyo','Osaka','Kyoto','Hiroshima','Sapporo'];
  const needsUK = dests.some(d=>UK_CITIES.includes(d.city));
  const needsEU = dests.some(d=>EU_CITIES.includes(d.city));
  const needsAU = dests.some(d=>AU_CITIES.includes(d.city));
  const needsJP = dests.some(d=>JP_CITIES.includes(d.city));
  const multiCountryAdapters = [needsUK,needsEU,needsAU,needsJP].filter(Boolean).length > 1;
  const adapterLabel = multiCountryAdapters
    ? 'Universal power adapter (multi-country)'
    : needsUK  ? 'Power adapter - Type G (UK plug)'
    : needsEU  ? 'Power adapter - Type C/E (EU plug)'
    : needsAU  ? 'Power adapter - Type I (AU/NZ plug)'
    : needsJP  ? 'Power adapter - Type A (JP/US, but 100V)'
    : 'Power adapter';

  const item = (name, cat, qty=1) => ({id: uuid(), name, category: cat, qty, packed: false});

  // ── Clothing · seasonal + occasion aware ──────────────────────────────────
  const topCount = Math.min(nights+1, 7);
  const sockCount = Math.min(nights+1, 7);
  const undCount  = Math.min(nights+2, 8);

  const clothing = [
    ...(isFrigid ? [
      item(`Thermal base layer tops (x${Math.min(topCount,4)})`, 'clothing', Math.min(topCount,4)),

  // ── Toiletries ────────────────────────────────────────────────────────────

function PackingView({trip, onUpdateTrip}){
  const isOwner = trip._myRole==='owner' || !trip._myRole; // members view read-only
  const [newItem, setNewItem] = useState('');
  const [newCat, setNewCat] = useState('clothing');
  const [collapsed, setCollapsed] = useState({});
  const didInit = useRef(false);

  // Auto-generate on first open · treat null OR empty [] as "not yet generated"
  const initialised = Array.isArray(trip.packingList) && trip.packingList.length > 0;
  useEffect(()=>{
    if(isOwner && !initialised && !didInit.current){
      didInit.current = true;
      track('packing_generated', { auto:true });
      onUpdateTrip({...trip, packingList: buildPackingDefaults(trip)});
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[initialised]);

  const items = trip.packingList || [];

  function saveItems(updated){
    onUpdateTrip({...trip, packingList: updated});
  }

  function initDefaults(){
    track('packing_generated', { auto:false });
    saveItems(buildPackingDefaults(trip));
  }

  function toggleItem(id){
    if(!isOwner){ showToast('Only the trip owner can check items off.','warn'); return; }
    saveItems(items.map(i => i.id===id ? {...i, packed: !i.packed} : i));
  }

  function packAll(catId){
    const allPacked = items.filter(i=>i.category===catId).every(i=>i.packed);
    saveItems(items.map(i => i.category===catId ? {...i, packed: !allPacked} : i));
  }

  function removeItem(id){
    saveItems(items.filter(i=>i.id!==id));
  }

  function addItem(){
    const name = newItem.trim();
    if(!name) return;
    saveItems([...items, {id:uuid(), name, category:newCat, qty:1, packed:false}]);
    setNewItem('');
  }

  function resetList(){
    if(window.confirm('Reset packing list and regenerate from your trip? Custom items will be lost.'))
      saveItems(buildPackingDefaults(trip));
  }

  // Progress math · same concept TREK uses: done/total per category + overall
  const total = items.length;
  const packed = items.filter(i=>i.packed).length;
  const pct = total > 0 ? Math.round((packed/total)*100) : 0;

  const byCat = PACK_CATS.reduce((acc,cat)=>{
    acc[cat.id] = items.filter(i=>i.category===cat.id);
    return acc;
  },{});

  if(!initialised && items.length === 0){
    return(
      <div style={{padding:'48px 16px',textAlign:'center'}}>
        <div style={{fontSize:'2rem',marginBottom:8}}>🧳</div>
        <p style={{fontSize:'.9rem',color:'var(--color-ink-light)',marginBottom:16}}>{isOwner?'Building your packing list…':"The trip owner hasn't made a packing list yet."}</p>
        {isOwner && <button className="btn btn-primary" style={{padding:'10px 24px'}} onClick={initDefaults}>Generate packing list</button>}
      </div>
    );
  }

  return(
    <div style={{padding:'0 16px 32px'}}>

      {/* Overall progress */}
      <div className="card" style={{padding:'16px',marginBottom:16}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <span style={{fontWeight:600,fontSize:'.9rem'}}>Pack Progress</span>
          <span style={{fontSize:'.85rem',color:'var(--color-ink-light)'}}>{packed}/{total} packed {pct===100?'🎯':''}</span>
        </div>
        <div className="progress-bar-track">
          <div className="progress-bar-fill" style={{width:`${pct}%`}}/>
        </div>
        {pct===100&&<p style={{color:'var(--color-success)',fontSize:'.85rem',fontWeight:500,marginTop:8}}>✅ All packed · you're ready to go!</p>}
      </div>

      {/* Category sections */}
      {PACK_CATS.map(cat=>{
        const catItems = byCat[cat.id] || [];
        if(catItems.length===0) return null;
        const catPacked = catItems.filter(i=>i.packed).length;
        const catTotal  = catItems.length;
        const allDone   = catPacked === catTotal;
        const isOpen    = !collapsed[cat.id];

        return(
          <div key={cat.id} className="card" style={{marginBottom:10,overflow:'hidden'}}>
            {/* Category header */}
            <div style={{display:'flex',alignItems:'center',padding:'12px 16px',gap:10,borderBottom: isOpen?'1px solid var(--color-border)':'none'}}>
              <button onClick={()=>setCollapsed(c=>({...c,[cat.id]:!c[cat.id]}))}
                style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'none',border:'none',cursor:'pointer',textAlign:'left',padding:0}}>
                <span style={{fontSize:'1rem'}}>{cat.emoji}</span>
                <span style={{fontWeight:600,fontSize:'.875rem'}}>{cat.label}</span>
                <span className="pill pill-neutral" style={{padding:'2px 8px',fontSize:'.7rem',marginLeft:4}}>{catPacked}/{catTotal}</span>
                <span style={{color:'var(--color-ink-light)',fontSize:'.7rem',marginLeft:'auto'}}>{isOpen?'▲':'▼'}</span>
              </button>
              {/* Bulk pack/unpack toggle */}
              {isOwner && <button onClick={()=>packAll(cat.id)}
                style={{flexShrink:0,background:allDone?'var(--color-accent)':'none',border:`1px solid ${allDone?'var(--color-accent)':'var(--color-border)'}`,borderRadius:20,padding:'3px 10px',fontSize:'.7rem',fontWeight:500,color:allDone?'#fff':'var(--color-ink-light)',cursor:'pointer',transition:'all .15s'}}>
                {allDone?'✓ All packed':'Pack all'}
              </button>}
            </div>

            {/* Items */}
            {isOpen && (
              <div>
                {catItems.map(item=>(
                  <div key={item.id}
                    style={{display:'flex',alignItems:'center',gap:12,padding:'11px 16px',borderBottom:'1px solid var(--color-border)',opacity:item.packed?.7:1,transition:'opacity .15s'}}>
                    {/* Checkbox */}
                    <button onClick={()=>toggleItem(item.id)}
                      style={{width:22,height:22,borderRadius:6,border:`2px solid ${item.packed?'var(--color-accent)':'var(--color-border)'}`,background:item.packed?'var(--color-accent)':'transparent',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'all .15s'}}>
                      {item.packed&&<span style={{color:'#fff',fontSize:'.65rem',fontWeight:700}}>✓</span>}
                    </button>
                    {/* Name */}
                    <span style={{flex:1,fontSize:'.875rem',textDecoration:item.packed?'line-through':'none',color:item.packed?'var(--color-ink-muted)':'var(--color-ink)'}}>
                      {item.name}
                    </span>
                    {/* Qty badge if > 1 */}
                    {item.qty>1 && <span style={{fontSize:'.7rem',color:'var(--color-ink-light)',background:'var(--color-cream)',borderRadius:20,padding:'1px 7px',border:'1px solid var(--color-border)',flexShrink:0}}>×{item.qty}</span>}
                    {/* Remove (owner-only) */}
                    {isOwner && <button onClick={()=>removeItem(item.id)}
                      style={{background:'none',border:'none',cursor:'pointer',color:'var(--color-ink-muted)',fontSize:'.9rem',flexShrink:0,padding:'0 4px',lineHeight:1,opacity:.5}}
                      title="Remove">×</button>}
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}

      {/* Add custom item (owner-only) */}
      {isOwner && <div className="card" style={{padding:16,marginBottom:12}}>
        <p className="section-label">Add item</p>
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <select className="input" value={newCat} onChange={e=>setNewCat(e.target.value)} style={{flexShrink:0,width:'auto'}}>
            {PACK_CATS.map(c=><option key={c.id} value={c.id}>{c.emoji} {c.label}</option>)}
          </select>
          <input className="input" placeholder="Item name..." value={newItem}
            onChange={e=>setNewItem(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&addItem()}
            style={{flex:1}}/>
          <button className="btn btn-primary" onClick={addItem} style={{flexShrink:0}}>Add</button>
        </div>
      </div>}

      {/* Reset link (owner-only) */}
      {isOwner && <p style={{textAlign:'center',fontSize:'.75rem',color:'var(--color-ink-muted)',marginTop:8}}>
        <button onClick={resetList} style={{background:'none',border:'none',cursor:'pointer',color:'var(--color-ink-muted)',textDecoration:'underline',fontSize:'.75rem'}}>
          Reset &amp; regenerate from trip
        </button>
      </p>}
    </div>
  );
}

// ── DAY ROUTE MAP · Leaflet (lazy CDN) + OSM Nominatim geocoding, all free ────
const GEO_SK='locale_geo_v1';
function geoCache(){try{return JSON.parse(localStorage.getItem(GEO_SK))||{};}catch(e){return{};}}
function geoCacheSet(k,v){try{const c=geoCache();c[k]=v;localStorage.setItem(GEO_SK,JSON.stringify(c));}catch(e){}}
let _leafletLoading=null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(_leafletLoading) return _leafletLoading;
  _leafletLoading=new Promise((resolve,reject)=>{
    const css=document.createElement('link');css.rel='stylesheet';
    css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(css);
    const js=document.createElement('script');
    js.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    js.onload=resolve; js.onerror=()=>reject(new Error('Map library failed to load.'));
    document.head.appendChild(js);
  });
  return _leafletLoading;
}
async function geocodeStop(query){
  const key=query.toLowerCase().trim();
  const cached=geoCache()[key];
  if(cached!==undefined) return cached; // null = known miss, don't re-ask
  try{
    const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(query));
    if(!res.ok) return null;
    const data=await res.json();
    const hit=data?.[0]?{lat:parseFloat(data[0].lat),lon:parseFloat(data[0].lon)}:null;
    geoCacheSet(key,hit);
    return hit;
  }catch(e){return null;}
}
function dayStopsForRoute(trip,day){
  const lodging=(trip.lodging||[])[0];
  const city=(trip.destinations||[]).find(d=>d.id===day.destinationId)?.city||(trip.destinations||[])[0]?.city||'';
  const addr=(s)=>(s.address&&s.address.trim())?s.address:(s.name?s.name+(city?', '+city:''):'');
  const stops=[...(day.activities||[]),...(day.restaurants||[])]
    .sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0))
    .map(s=>({label:s.name,query:addr(s)})).filter(s=>s.query);
  if(lodging&&(lodging.address||lodging.name)) stops.unshift({label:'🏨 '+(lodging.name||'Hotel'),query:lodging.address||lodging.name+(city?', '+city:'')});
  return stops.slice(0,10);
}
function DayRouteMap({trip,day}){
  const mapRef=React.useRef(null);
  const mapObj=React.useRef(null);
  const [status,setStatus]=React.useState('loading'); // loading | ready | empty | error
  const [progress,setProgress]=React.useState('');
  React.useEffect(()=>{
    let cancelled=false;
    setStatus('loading'); setProgress('');
    (async()=>{
      try{
        await loadLeaflet();
        if(cancelled)return;
        const stops=dayStopsForRoute(trip,day);
        if(!stops.length){setStatus('empty');return;}
        const L=window.L;
        if(mapObj.current){mapObj.current.remove();mapObj.current=null;}
        const m=L.map(mapRef.current,{scrollWheelZoom:false});
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(m);
        mapObj.current=m;
        // Geocode one stop at a time (Nominatim's free tier requires max 1 req/sec ·
        // can't be parallelized without switching to a paid/keyed provider). To avoid
        // a long blank wait, the map appears and gets its first marker the moment the
        // FIRST stop resolves, instead of waiting for every stop to finish.
        const points=[];
        let shown=false;
        for(let i=0;i<stops.length;i++){
          if(cancelled)return;
          setProgress(`Locating ${i+1} of ${stops.length}…`);
          const isCached=geoCache()[stops[i].query.toLowerCase().trim()]!==undefined;
          const pt=await geocodeStop(stops[i].query);
          if(cancelled)return;
          if(pt){
            points.push({...pt,label:stops[i].label});
            L.marker([pt.lat,pt.lon]).addTo(m).bindPopup(`<strong>${points.length}.</strong> ${stops[i].label.replace(/</g,'&lt;')}`);
            if(!shown){
              shown=true; setStatus('ready');
              // container was display:none until 'ready' · Leaflet needs a size
              // recalculation once it's actually visible, or tiles render wrong.
              setTimeout(()=>{ if(!cancelled){ m.invalidateSize(); m.setView([pt.lat,pt.lon],13); } },50);
            } else if(points.length>1){
              m.fitBounds(points.map(p=>[p.lat,p.lon]),{padding:[28,28]});
            }
          }
          if(!isCached&&i<stops.length-1)await new Promise(r=>setTimeout(r,1100)); // Nominatim: max 1 req/sec
        }
        if(cancelled)return;
        if(points.length<1){setStatus('empty');return;}
        if(points.length>1) L.polyline(points.map(p=>[p.lat,p.lon]),{color:'#FF5A4D',weight:3,opacity:.75,dashArray:'6 8'}).addTo(m);
      }catch(e){if(!cancelled)setStatus('error');}
    })();
    return()=>{cancelled=true;if(mapObj.current){mapObj.current.remove();mapObj.current=null;}};
  },[day.id]);
  return(
    <div style={{marginBottom:16}}>
      <div ref={mapRef} style={{height:260,borderRadius:12,border:'1px solid var(--color-border)',background:'var(--color-cream-dark)',display:status==='ready'?'block':'none'}}/>
      {status==='loading'&&<div style={{height:120,borderRadius:12,border:'1px solid var(--color-border)',background:'var(--color-surface)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'.8rem',color:'var(--color-ink-muted)'}}>🗺 {progress||'Loading map…'}</div>}
      {status==='empty'&&<div style={{padding:'12px 14px',borderRadius:12,border:'1px solid var(--color-border)',background:'var(--color-surface)',fontSize:'.8rem',color:'var(--color-ink-muted)'}}>Couldn't place this day's stops on the map · addresses may be missing. The Google Maps link below still works.</div>}
      {status==='error'&&<div style={{padding:'12px 14px',borderRadius:12,border:'1px solid var(--color-border)',background:'var(--color-surface)',fontSize:'.8rem',color:'var(--color-ink-muted)'}}>Map couldn't load. Check your connection, or use the Google Maps link below.</div>}
      <p style={{fontSize:'.7rem',color:'var(--color-ink-muted)',marginTop:6}}>Route is approximate · venue locations come from AI-suggested addresses. Always double-check before heading out.</p>
    </div>
  );
}

// ── Attribution helpers (per-stop "Added by X · Yago") ──────────────────────────
function relativeAgo(ts){
  if(!ts) return '';
  const d = typeof ts==='number'?ts:Date.parse(ts);
  if(!d || isNaN(d)) return '';
  const s = Math.floor((Date.now()-d)/1000);
  if(s<45) return 'just now';
  const m=Math.floor(s/60); if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago';
  const dd=Math.floor(h/24); if(dd<7) return dd+'d ago';
  const w=Math.floor(dd/7); if(w<5) return w+'w ago';
  const mo=Math.floor(dd/30); if(mo<12) return mo+'mo ago';
  return Math.floor(dd/365)+'y ago';
}
function resolveStopAuthor(trip, item){
  const members = trip.collaborators||[];
  const m = item.addedBy ? members.find(x=>x.id===item.addedBy) : null;
  if(m) return {name:m.name, color:m.avatarColor||AVATAR_COLORS[0], initial:(m.name||'?').charAt(0).toUpperCase()};
  if(item.addedByName) return {name:item.addedByName, color:AVATAR_COLORS[0], initial:item.addedByName.charAt(0).toUpperCase()};
  return null;
}
// Converts a "HH:MM" (24h wall-clock) string to a friendly "h:mm am/pm" display.
// These times are already local to the stop (e.g. a Paris arrival is Paris local
// time) · no timezone math needed, just a nicer format than military time.
// 12-hour time for the arrivals board. Hour is space-padded so the mono column
// still lines up, and the meridiem is uppercase to suit the board treatment.
// Flight times are stored as LOCAL time at each airport (the form asks for local
// time on both ends), which is the correct model: a 15:50 departure from Austin is
// Austin time, a 12:05 landing at Heathrow is London time. No conversion applied.
function fmtBoardTime(iso){
  const m=/T(\d{2}):(\d{2})/.exec(iso||''); if(!m) return '—';
  let h=parseInt(m[1],10); const ap=h>=12?'PM':'AM';
  h=h%12; if(h===0) h=12;
  return (h<10?' ':'')+h+':'+m[2]+' '+ap;
}
function fmt12h(t){
  if(!t) return '';
  const m=/^(\d{1,2}):(\d{2})/.exec(String(t)); if(!m) return String(t);
  let h=parseInt(m[1],10); const min=m[2];
  const ap = h>=12 ? 'pm' : 'am';
  h = h % 12; if(h===0) h=12;
  return h+':'+min+' '+ap;
}
function fmtStopTime(t){ return fmt12h(t); }
function Avatar22({initial,color}){
  return <span style={{width:22,height:22,borderRadius:'50%',background:color,color:'#0E1117',display:'inline-flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'.68rem',flexShrink:0}}>{initial}</span>;
}

// ── FLIGHTS STRIP · tappable pills that open an in-app flight detail (PRD 2.5) ────
// ── CREW ARRIVALS (Phase 2c) ───────────────────────────────────────────
// Crew members traveling from different cities each add their own flight; the app
// consolidates them into arrivals/departures boards. travelerIds on a flight = who's
// on it; empty = whole-group flight (legacy behavior, applies to everyone).
function flightTravelers(trip, f){
  const members=(trip.collaborators||[]);
  if(!((f&&f.travelerIds)||[]).length) return members;
  return members.filter(m=>f.travelerIds.includes(m.id));
}
function fmtFlightTimeISO(iso){ if(!iso) return ''; const m=/T(\d{2}):(\d{2})/.exec(iso); return m?fmt12h(m[1]+':'+m[2]):''; }
function minutesOfISO(iso){ const m=/T(\d{2}):(\d{2})/.exec(iso||''); return m?(+m[1])*60+(+m[2]):null; }
function gapLabel(mins){ if(mins==null||mins<=0) return ''; const h=Math.floor(mins/60), mm=mins%60; return (h?h+'h ':'')+(mm?mm+'m':(h?'':'0m')); }

// date = a specific day, or null for "every flight on the trip".
// This used to be pinned to trip.startDate, which meant an overnight international
// flight never showed at all: leave Austin Sep 16, land Heathrow Sep 17, and the
// Day 1 board looked for arrivals ON Sep 16 and found none. Boards now render on
// whichever day the flight actually touches down.
function ArrivalsBoard({trip, date, mode}){
  const arrivalsMode = mode!=='departures';
  const key = arrivalsMode?'arrivalTime':'departureTime';
  const portKey = arrivalsMode?'arrivalAirport':'departureAirport';
  const flights=(trip.flights||[]).filter(f=>{
    if(!f[key]) return false;
    return date ? ((f[key]||'').slice(0,10))===date : true;
  }).sort((a,b)=>(a[key]||'')<(b[key]||'')?-1:1);
  if(!flights.length) return null;
  const rows=flights.map(f=>({f, who:flightTravelers(trip,f)}));
  const times=flights.map(f=>minutesOfISO(f[key])).filter(t=>t!=null);
  const ports=[...new Set(flights.map(f=>String(f[portKey]||'').trim().toUpperCase()).filter(Boolean))];
  const last=flights[flights.length-1];
  // "Everyone in by 8pm" only means something within a single day.
  const dates=[...new Set(flights.map(f=>(f[key]||'').slice(0,10)))];
  const sameDay = dates.length===1;
  let callout=null, warn=false;
  if(flights.length>1 && sameDay){
    if(ports.length>1){ callout='DIFFERENT '+(arrivalsMode?'ARRIVAL':'DEPARTURE')+' POINTS ('+ports.join(' / ')+') · PLAN TRANSFERS SEPARATELY'; warn=true; }
    else if(times.length>1){
      const span=Math.max(...times)-Math.min(...times);
      callout = arrivalsMode
        ? ("EVERYONE IN BY "+fmtBoardTime(last[key]).trim()+(span>=90?(' · SPAN '+gapLabel(span).toUpperCase()+' · EARLY LANDERS DROP BAGS'):' · MEET AT THE HOTEL'))
        : ('LAST ONE OUT AT '+fmtBoardTime(last[key]).trim());
    }
  }
  // Airport-board treatment (design brief): dark surface, 24h tabular times in
  // warm amber, one line per flight. 50 years of airport signage solved this layout.
  // Stephanie's call (2026-07-21): no military time anywhere, even here. The board
  // keeps its tabular alignment because fmtBoardTime pads the hour.
  const t24=(iso)=>fmtBoardTime(iso);
  return (
    <div style={{background:'#16130F',borderRadius:'var(--radius-card)',padding:'18px 20px',marginBottom:16,boxShadow:'var(--shadow-card)'}}>
      <p style={{fontFamily:'var(--font-mono)',fontSize:'.62rem',fontWeight:500,letterSpacing:'.18em',textTransform:'uppercase',color:'#8C857A',marginBottom:12}}>{arrivalsMode?'Arrivals':'Departures'} · {(trip.destinations||[])[0]?.city||''}{date?(' · '+formatDateShort(date)):' · whole trip'}</p>
      {rows.map(({f,who})=>(
        <div key={f.id} style={{display:'grid',gridTemplateColumns:'88px 1fr auto',gap:12,alignItems:'baseline',padding:'8px 0',borderBottom:'1px solid rgba(255,255,255,.07)'}}>
          <span style={{fontFamily:'var(--font-mono)',fontWeight:600,fontSize:'.95rem',color:'#FFD9A8',fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap'}}>{t24(f[key])}</span>
          <div style={{minWidth:0}}>
            <div style={{fontSize:'.85rem',fontWeight:500,color:'#F5F1E9',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{f.flightNumber||f.airline||'Flight'} · {(arrivalsMode?(f.departureAirport||'?'):(f.arrivalAirport||'?'))}{f.via?(' via '+f.via):''}<span style={{color:'#8C857A'}}>{(f.travelerIds||[]).length? ' · '+who.map(m=>m.name).join(', ') : ' · Whole group'}</span></div>
            {!sameDay && <div style={{fontFamily:'var(--font-mono)',fontSize:'.65rem',color:'#8C857A',marginTop:2}}>{formatDateShort((f[key]||'').slice(0,10))}</div>}
          </div>
          <span style={{display:'flex',flexShrink:0}}>{who.slice(0,4).map(m=>(
            <span key={m.id} title={m.name} style={{width:20,height:20,borderRadius:'50%',background:m.avatarColor,color:'#0E1117',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'.58rem',marginLeft:-6,boxShadow:'0 0 0 2px #16130F'}}>{(m.name||'?').charAt(0).toUpperCase()}</span>
          ))}</span>
        </div>
      ))}
      {callout && <p style={{fontFamily:'var(--font-mono)',fontSize:'.68rem',letterSpacing:'.04em',marginTop:12,color:warn?'#FF9D8F':'#5ED0B8'}}>{callout}</p>}
    </div>
  );
}

        </div>

            <input className="input" style={{flex:1,minWidth:0}} placeholder="Airline" value={airline} onChange={e=>setAirline(e.target.value)}/>

            <input className="input" style={{flex:1,minWidth:0}} placeholder="To (LHR)" value={toAp} onChange={e=>setToAp(e.target.value)}/>

// ── STOP MINI MAP · inline OpenStreetMap embed (no API key) + Google fallback ─────
function StopMiniMap({query}){
  const [coords,setCoords]=React.useState(undefined); // undefined=loading, null=miss
  React.useEffect(()=>{ let on=true; geocodeStop(query).then(c=>{ if(on) setCoords(c||null); }).catch(()=>on&&setCoords(null)); return ()=>{on=false;}; },[query]);
  const gmaps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
  const fallback=(msg)=>(<div style={{padding:'10px 12px',border:'1px solid var(--color-border)',borderRadius:10,background:'var(--color-surface)',fontSize:'.8rem',color:'var(--color-ink-muted)'}}>{msg} <a href={gmaps} target="_blank" rel="noopener noreferrer" style={{color:'var(--color-accent)'}}>Open in Google Maps ↗</a></div>);
  if(coords===undefined) return <div style={{marginTop:10}}>{fallback('Locating…')}</div>;
  if(coords===null) return <div style={{marginTop:10}}>{fallback("Couldn't place this address on the map.")}</div>;
  const d=0.006;
  const bbox=`${coords.lon-d},${coords.lat-d},${coords.lon+d},${coords.lat+d}`;
  const src=`https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${coords.lat},${coords.lon}`;
  return (
    <div style={{marginTop:10}}>
      <iframe title={`Map of ${query}`} src={src} loading="lazy" style={{width:'100%',height:200,border:'1px solid var(--color-border)',borderRadius:10,display:'block'}}/>
      <div style={{display:'flex',justifyContent:'flex-end',marginTop:6}}>
        <a href={gmaps} target="_blank" rel="noopener noreferrer" style={{fontSize:'.75rem',color:'var(--color-accent)'}}>Open full map in Google Maps ↗</a>
      </div>
    </div>
  );
}

// UAT #3 · renders text with tappable links. Anchors only; never innerHTML.
function LinkedText({text, style}){
  const parts=linkifyParts(text);
  if(!parts.length) return null;
  return <>{parts.map((p,i)=> p.type==='link'
    ? <a key={i} href={p.href} target="_blank" rel="noopener noreferrer" style={{color:'var(--color-accent)',textDecoration:'underline',wordBreak:'break-word',...(style||{})}}>{p.value}</a>
    : <React.Fragment key={i}>{p.value}</React.Fragment>)}</>;
}
function TimelineStop({trip, item, type, onEdit, onDelete, onAddComment, onDeleteComment, onMoveToDay, currentDayId, draggable}){

        <button onClick={()=>setOpen(o=>!o)} aria-expanded={open} aria-label={`${item.name}, ${comments.length?comments.length+' note'+(comments.length>1?'s':''):'no notes yet'} · tap for details`}
          style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',background:'none',border:'none',padding:0,margin:0,cursor:'pointer',textAlign:'left',width:'100%'}}>
          <span style={{fontWeight:700,fontSize:'1rem',color:'var(--color-ink)'}}>{item.emoji?item.emoji+' ':''}{item.name}</span>
          {item.bucket==='must-do'&&<span className="badge-must">★</span>}

          {comments.length>0 && <span style={{marginLeft:'auto',fontSize:'.72rem',color:'var(--color-accent)',fontWeight:500,flexShrink:0}}>💬 {comments.length}</span>}

          <div style={{display:'flex',alignItems:'center',gap:7,marginTop:6}}>

          </div>
        )}
        {open && (
          <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--color-border)'}}>
            {item.neighborhood&&<p style={{fontSize:'.8rem',color:'var(--color-ink-light)',marginBottom:4}}>📍 {item.neighborhood}</p>}
            {item.address&&<p style={{fontSize:'.8rem',color:'var(--color-ink-light)',marginBottom:4}}>{item.address}</p>}
            {item.notes&&<p style={{fontSize:'.85rem',lineHeight:1.55,margin:'6px 0'}}><LinkedText text={item.notes}/></p>}
            {comments.map(c=>(
              <div key={c.id} style={{display:'flex',gap:8,alignItems:'flex-start',margin:'8px 0'}}>
                <Avatar22 initial={(c.author||'?').charAt(0).toUpperCase()} color={c.color||AVATAR_COLORS[0]}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:'.78rem'}}><strong>{c.author}</strong> <span style={{color:'var(--color-ink-muted)'}}>{c.ts?'· '+relativeAgo(c.ts):''}</span></div>
                  <div style={{fontSize:'.85rem',color:'var(--color-ink-light)'}}><LinkedText text={c.text}/></div>
                </div>
                {onDeleteComment&&<button aria-label="Delete note" onClick={()=>onDeleteComment(item,c.id)} className="btn btn-ghost btn-sm" style={{color:'var(--color-flag)',padding:'0 6px'}}>✕</button>}
              </div>

            <div style={{display:'flex',gap:6,marginTop:8}}>

              {onEdit&&<button className="btn btn-ghost btn-sm" onClick={()=>onEdit(item)}>✏️ Edit</button>}
              {onMoveToDay&&(trip.days||[]).length>1&&<button className="btn btn-ghost btn-sm" aria-expanded={moving} onClick={()=>setMoving(m=>!m)}>📅 Move to day</button>}
              {onDelete&&<button className="btn btn-ghost btn-sm" aria-label="Remove item" style={{color:'var(--color-flag)'}} onClick={()=>{if(window.confirm('Remove this item?'))onDelete(item.id);}}>🗑</button>}
            </div>
            {/* UAT #2 · cross-day move. Same additive write path as reorder: the stop
                is removed from this day's list and appended to the target day's. */}
            {moving&&onMoveToDay&&(
              <div style={{marginTop:10,background:'var(--color-accent-soft)',border:'1px solid var(--color-border)',borderRadius:8,padding:'10px 12px'}}>
                <p style={{fontSize:'.75rem',fontWeight:600,color:'var(--color-accent)',marginBottom:6}}>Move “{item.name}” to…</p>
                <div style={{display:'flex',flexDirection:'column',gap:4,maxHeight:180,overflowY:'auto'}}>
                  {(trip.days||[]).filter(d=>d.id!==currentDayId).map(d=>(
                    <button key={d.id} className="btn btn-secondary btn-sm" style={{justifyContent:'flex-start',textAlign:'left'}}
                      onClick={()=>{ setMoving(false); setOpen(false); onMoveToDay(item, d.id); }}>
                      {d.label && !/^Day\s*\d+$/i.test(String(d.label).trim()) ? (d.label+' · ') : ''}{formatDateDow(d.date)}
                    </button>
                  ))}
                </div>
              </div>
            )}
            {showMap && <StopMiniMap query={item.address?`${item.address}`:`${item.name}${item.neighborhood?', '+item.neighborhood:''}`}/>}
          </div>
        )}
       </div>
      </div>
    </div>
  );
}

function DayView({trip,day,onUpdateTrip}){
  const isOwner = trip._myRole==='owner' || !trip._myRole; // untagged (never-synced) trips are always mine
  const myRole = trip._myRole || 'owner';
  const [notes,setNotes]=useState(day.notes||'');
  const [filter,setFilter]=useState('all');
  const [addingType,setAddingType]=useState(null); // 'activity'|'restaurant'|null
  const [editingItem,setEditingItem]=useState(null); // {item, type}
  const [showMap,setShowMap]=useState(false);
  const [editingTitle,setEditingTitle]=useState(false); // UAT #6 · inline day-title edit
  const [titleDraft,setTitleDraft]=useState('');
  const [dayNoteDraft,setDayNoteDraft]=useState('');
  const dest=trip.destinations.find(d=>d.id===day.destinationId);
  const acts=(day.activities||[]).filter(a=>filter==='all'||a.bucket===filter);
  const rests=(day.restaurants||[]).filter(r=>filter==='all'||r.bucket===filter);
  // "You" identity for attribution = trip owner (or first collaborator)
  const me=(trip.collaborators||[]).find(c=>c.role==='owner')||(trip.collaborators||[])[0];
  const myName=me?.name||'You';
  const myColor=me?.avatarColor||AVATAR_COLORS[0];

  const updateDay=(newDay)=>onUpdateTrip({...trip,days:trip.days.map(d=>d.id===day.id?newDay:d)});

  const handleSaveActivity=(formData,type)=>{
    const listKey=type==='restaurant'?'restaurants':'activities';
    const list=[...(day[listKey]||[])];
    if(editingItem){
      const idx=list.findIndex(x=>x.id===editingItem.item.id);
      if(idx>=0) list[idx]={...list[idx],...formData};
      setEditingItem(null);
    } else {
      // unified sortOrder across both lists so new stops append to the end of the timeline
      const maxOrder=Math.max(-1,...(day.activities||[]).map(s=>s.sortOrder??0),...(day.restaurants||[]).map(s=>s.sortOrder??0));
      list.push({...formData,id:uuid(),sortOrder:maxOrder+1,
        addedBy: me?.id||null, addedByName: me?null:'You', addedAt: Date.now(), comments:[]});
    }
    updateDay({...day,[listKey]:list});
    setAddingType(null);
  };

  const handleDelete=(id,listKey)=>{
    updateDay({...day,[listKey]:(day[listKey]||[]).filter(x=>x.id!==id)});
  };
  // UAT #2 · cross-day move. Writes the whole days array (both days change), so it
  // goes through onUpdateTrip rather than updateDay.
  const handleMoveToDay=(item,toDayId)=>{
    const next=moveStopBetweenDays(trip.days||[], day.id, toDayId, item.id);
    onUpdateTrip({...trip, days:next});
    const d=(trip.days||[]).find(x=>x.id===toDayId);
    const where=d ? (d.label && !/^Day\s*\d+$/i.test(String(d.label).trim()) ? d.label : formatDateDow(d.date)) : 'another day';
    showToast(`Moved “${item.name}” to ${where} ✓`,'info',3000);
  };
  const listKeyOf=(item)=> (day.activities||[]).some(a=>a.id===item.id) ? 'activities' : 'restaurants';
  // Crew/Viewer members don't have write access to the trip document (owner-only
  // RLS) · a linked 'crew' member's note goes through the guarded add_trip_comment
  // function instead, which only lets them append a comment, nothing else. A
  // local echo keeps the UI responsive either way; the next sync reconciles it.
  const addStopComment=(item,text)=>{
    const lk=listKeyOf(item);
    if(!isOwner){
      if(myRole!=='crew'){ showToast("Viewers can't add notes on this trip.",'warn'); return; }
      const c=sb();
      const targetType=(day.activities||[]).some(a=>a.id===item.id)?'activity':'restaurant';
      if(c) (async()=>{ try{ const {error}=await c.rpc('add_trip_comment',{p_trip_id:trip.id,p_target_type:targetType,p_target_id:item.id,p_text:text}); if(error) throw error; }catch(e){ showToast("Couldn't post note · try again.",'error'); } })();
    }
    updateDay({...day,[lk]:(day[lk]||[]).map(s=>s.id===item.id?{...s,comments:[...(s.comments||[]),{id:uuid(),author:myName,color:myColor,text,ts:Date.now()}]}:s)});
  };
  const deleteStopComment=(item,cid)=>{
    if(!isOwner) return; // deleting a note isn't wired to a guarded function yet · owner-only for now
    const lk=listKeyOf(item);
    updateDay({...day,[lk]:(day[lk]||[]).map(s=>s.id===item.id?{...s,comments:(s.comments||[]).filter(c=>c.id!==cid)}:s)});
  };
  const addDayComment=(text)=>{
    if(!isOwner){
      if(myRole!=='crew'){ showToast("Viewers can't add notes on this trip.",'warn'); return; }
      const c=sb();
      if(c) (async()=>{ try{ const {error}=await c.rpc('add_trip_comment',{p_trip_id:trip.id,p_target_type:'day',p_target_id:day.id,p_text:text}); if(error) throw error; }catch(e){ showToast("Couldn't post note · try again.",'error'); } })();
    }
    updateDay({...day,comments:[...(day.comments||[]),{id:uuid(),author:myName,color:myColor,text,ts:Date.now()}]});
  };
  const deleteDayComment=(cid)=>{
    if(!isOwner) return;
    updateDay({...day,comments:(day.comments||[]).filter(c=>c.id!==cid)});
  };

  const hotel=trip.lodging?.find(l=>!l.destinationId||l.destinationId===day.destinationId);
  // Real forecast for this day's city (Open-Meteo). Replaces the placeholder that
  // used to show the same invented numbers per country on every day of every trip.
  const [wxByDate,setWxByDate]=React.useState(null);
  React.useEffect(()=>{
    let alive=true;
    if(!dest || !dest.city || !day.date){ setWxByDate(null); return; }
    const ahead=(new Date(day.date+'T00:00:00') - new Date(new Date().toDateString()))/86400000;
    if(!(ahead>=0 && ahead<WX_WINDOW_DAYS)){ setWxByDate(null); return; } // outside the forecast horizon
    fetchCityForecast(dest.city, dest.countryCode).then(v=>{ if(alive) setWxByDate(v); });
    return ()=>{ alive=false; };
  },[dest&&dest.city, dest&&dest.countryCode, day.date]);
  const wx = wxByDate ? (wxByDate[day.date]||null) : null;
  const wxSwap = React.useMemo(
    ()=> wxByDate ? weatherSwapSuggestion(day, trip.days||[], wxByDate) : null,
    [wxByDate, day, trip.days]
  );
  const wxDismissed = (trip.dismissedWxSwaps||[]).includes(day.id);
  function saveNotes(v){onUpdateTrip({...trip,days:trip.days.map(d=>d.id===day.id?{...d,notes:v}:d)});}

  // Merge activities + restaurants into one timeline.
  // Sort by manual sortOrder first (so up/down reordering sticks), time as tiebreaker.
  const merged=[...acts.map(a=>({item:a,type:'activity'})),...rests.map(r=>({item:r,type:'restaurant'}))]
    .sort((a,b)=>{
      const so=(a.item.sortOrder??0)-(b.item.sortOrder??0);
      if(so!==0) return so;
      const ta=a.item.time||'', tb=b.item.time||'';
      if(ta&&tb&&ta!==tb) return ta<tb?-1:1;
      if(ta&&!tb) return -1;
      if(!ta&&tb) return 1;
      return 0;
    });
  const canReorder = filter==='all'; // reordering a filtered subset is ambiguous
  const totalStops=(day.activities||[]).length+(day.restaurants||[]).length;
  const dayComments=day.comments||[];

  // Drag-to-reorder (SortableJS, CDN-loaded) replaces the old up/down buttons.
  // A ref holds the latest merged/day/updateDay so the drag handler (bound once
  // per canReorder toggle) never closes over stale data.
  const listRef=React.useRef(null);
  const dragStateRef=React.useRef({});
  dragStateRef.current={merged,day,updateDay};
  React.useEffect(()=>{
    if(!isOwner || !canReorder || !listRef.current || !window.Sortable) return;
    const sortable=window.Sortable.create(listRef.current,{
      handle:'.drag-handle', animation:150, ghostClass:'sortable-ghost',
      onEnd:(evt)=>{
        const {oldIndex,newIndex}=evt;
        if(oldIndex==null||newIndex==null||oldIndex===newIndex) return;
        const {merged:m,day:d,updateDay:upd}=dragStateRef.current;
        const arr=m.map(x=>x.item);
        const [moved]=arr.splice(oldIndex,1);
        arr.splice(newIndex,0,moved);
        const orderMap=new Map(arr.map((s,k)=>[s.id,k]));
        const reindex=(list)=>(list||[]).map(s=>orderMap.has(s.id)?{...s,sortOrder:orderMap.get(s.id)}:s);
        upd({...d,activities:reindex(d.activities),restaurants:reindex(d.restaurants)});
      }
    });
    return ()=>sortable.destroy();
  },[canReorder,isOwner]);

  // UAT #8 · a day's identity is its weekday+date; UAT #6 · a custom label overrides it.
  // "Day N" is the auto-generated default and is treated as "no custom label".
  const hasCustomLabel = !!(day.label && !/^Day\s*\d+$/i.test(String(day.label).trim()));
  // Never render a blank heading: fall back to the date, then any stored label, then a generic word.
  const dayTitle = hasCustomLabel ? day.label : (formatDateDowLong(day.date) || day.label || 'Day');
  return(
    <div style={{padding:'0 16px 32px'}}>
      {/* Header · editable day title (#6) + weekday/date identity (#8) */}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,marginBottom:16}}>
        <div style={{minWidth:0,flex:1}}>
          {editingTitle ? (
            <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:4}}>
              <input className="input" autoFocus value={titleDraft} maxLength={60}
                placeholder={formatDateDowLong(day.date)}
                onChange={e=>setTitleDraft(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter'){ updateDay({...day,label:titleDraft.trim()}); setEditingTitle(false); } if(e.key==='Escape'){ setEditingTitle(false); } }}
                style={{flex:1,fontSize:'1.1rem'}}/>
              <button className="btn btn-primary btn-sm" onClick={()=>{ updateDay({...day,label:titleDraft.trim()}); setEditingTitle(false); }}>Save</button>
            </div>
          ) : (
            <h2 className="font-display" style={{fontSize:'1.5rem',fontWeight:600,lineHeight:1.2,marginBottom:4,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
              <span style={{minWidth:0}}>{dayTitle}{dest?<span style={{color:'var(--color-ink-light)',fontWeight:400}}> · {dest.city}</span>:''}</span>
              {isOwner&&<button className="btn btn-ghost btn-sm" aria-label="Edit day title" title="Rename this day" style={{fontSize:'.8rem',padding:'2px 6px',lineHeight:1}} onClick={()=>{ setTitleDraft(hasCustomLabel?day.label:''); setEditingTitle(true); }}>✎</button>}
            </h2>
          )}
          <p style={{fontSize:'.85rem',color:'var(--color-ink-light)'}}>{hasCustomLabel?(formatDateDow(day.date)+' · '):''}{totalStops} {totalStops===1?'stop':'stops'}</p>
        </div>
      </div>
      {/* Renders on whatever day the flight lands or leaves · returns null when the
          day has none, so no gating is needed here. */}
      <ArrivalsBoard trip={trip} date={day.date} mode="arrivals"/>
      <ArrivalsBoard trip={trip} date={day.date} mode="departures"/>
      {(() => {
        const dayItems = (trip.budget?.items||[]).filter(i=>i.day===day.id);
        if(!dayItems.length) return null;
        const sum = dayItems.reduce((s,i)=>s+(Number(i.amount)||0),0);
        return (
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'var(--color-accent-soft)',border:'1px solid var(--color-border)',borderRadius:10,padding:'8px 12px',marginBottom:16}}>
            <span style={{fontFamily:'var(--font-mono)',fontSize:'.68rem',letterSpacing:'.06em',textTransform:'uppercase',color:'var(--color-ink-muted)'}}>Day spend · {dayItems.length} {dayItems.length===1?'item':'items'}</span>
            <span style={{fontFamily:'var(--font-mono)',fontWeight:600,color:'var(--color-ink)'}}>${(Math.round(sum*100)/100).toLocaleString()}</span>
          </div>
        );
      })()}
      {wx&&(
        <div style={{display:'flex',alignItems:'baseline',gap:10,flexWrap:'wrap',
          padding:'10px 0 11px',borderTop:'1px solid var(--color-border)',borderBottom:'1px solid var(--color-border)',marginBottom:16}}>
          <span className="section-label" style={{margin:0}}>Forecast</span>
          <span style={{fontSize:'.85rem',fontWeight:500,color:'var(--color-ink)'}}>{wmoLabel(wx.code)}</span>
          <span style={{fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums',fontSize:'.8rem',color:'var(--color-ink-light)'}}>
            {wx.hi}° / {wx.lo}°{(wx.pop||0)>=20?(' · '+wx.pop+'% rain'):''}
          </span>
        </div>
      )}
      {/* Weather-aware suggestion. Suggests only · the swap is always an explicit tap (DECISIONS.md). */}
      {wxSwap && !wxDismissed && (
        <div className="card" style={{marginBottom:16,borderColor:'var(--color-accent)',borderStyle:'dashed'}}>
          <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <p style={{fontWeight:600,fontSize:'.88rem',marginBottom:3}}>{wmoLabel(wxSwap.wx.code)} on {formatDateDow ? formatDateDow(day.date) : day.date}, with {wxSwap.outdoorCount} outdoor stops</p>
              <p style={{fontSize:'.78rem',color:'var(--color-ink-light)',lineHeight:1.55}}>
                Consider trading <strong style={{color:'var(--color-ink)'}}>{wxSwap.outdoorStop.name}</strong> for <strong style={{color:'var(--color-ink)'}}>{wxSwap.swapStop.name}</strong> on {formatDateShort(wxSwap.swapDay.date)}, which looks drier.
              </p>
            </div>
            <button className="btn btn-ghost btn-sm" aria-label="Dismiss weather suggestion" style={{flexShrink:0,color:'var(--color-ink-muted)'}}
              onClick={()=>onUpdateTrip({...trip, dismissedWxSwaps:[...(trip.dismissedWxSwaps||[]), day.id]})}>✕</button>
          </div>
          {isOwner && (
            <button className="btn btn-secondary btn-sm" style={{marginTop:10}}
              onClick={()=>{
                const days=(trip.days||[]).map(d=>{
                  if(d.id===day.id) return {...d, activities:swapStopIn(d.activities, wxSwap.outdoorStop, wxSwap.swapStop)};
                  if(d.id===wxSwap.swapDay.id) return {...d, activities:swapStopIn(d.activities, wxSwap.swapStop, wxSwap.outdoorStop)};
                  return d;
                });

// Display shape for a pin: structured pins pass through; legacy text pins split
// at the first separator so old data still gets a title + detail.
function pinDisplay(p, city){
  let tag=p.tag, title=p.title, detail=p.detail;
  if(!title){
    let t=p.text||'';
    if(/^stay in /i.test(t)){ tag=tag||'Stay'; t=t.replace(/^stay in /i,''); }
    else if(/^day trip:?\s*/i.test(t)){ tag=tag||'Day trip'; t=t.replace(/^day trip:?\s*/i,''); }
    else if(/^go /i.test(t)){ tag=tag||'Timing'; t=t.replace(/^go /i,''); }
    const m=t.split(/ · |: |; /);
    title=(m[0]||t).trim(); detail=m.slice(1).join(' · ').trim();
    if(title.length>64){ detail=(title+(detail?' · '+detail:'')); title=title.slice(0,61).trim()+'…'; }
  }
  // Maps is right for somewhere you need to GET to, wrong for a named venue you want
  // to read about or book. Restaurants, museums, hotels and the like get a search
  // scoped to the venue that lands on its own site; neighbourhoods, regions and
  // timing notes still get Maps.
  const q=encodeURIComponent(title+(city?(' '+city):''));
  const t=(tag||'').toLowerCase();
  const areaTags=['stay','timing','day trip','neighborhood','neighbourhood','area','region'];
  const isVenue = !areaTags.includes(t) &&
    /\b(restaurant|cafe|café|bar|museum|gallery|theatre|theater|hotel|club|venue|shop|store|spa|bakery|brewery|winery|palace|castle)\b/i.test(title+' '+(detail||''));
  return {
    tag: tag||'Idea', title, detail: detail||'',
    link: isVenue
      ? 'https://www.google.com/search?q='+encodeURIComponent(title+(city?(' '+city):'')+' official site')
      : 'https://www.google.com/maps/search/?api=1&query='+q,
    linkLabel: isVenue ? 'Look it up' : 'Explore on Maps',
  };
}

// ── PIN REACTIONS (P1 Dreamer) ────────────────────────────────────────────────
// Who am I on this trip? A synced member carries _myCollaboratorId; the owner is
// the collaborator row flagged role 'owner' (falling back to the first row, which
// is always the creator). No identity = read-only counts.
function myMemberIdFor(trip){
  if(!trip) return null;
  if(trip._myCollaboratorId) return trip._myCollaboratorId;
  const isOwner = trip._myRole==='owner' || !trip._myRole;
  if(!isOwner) return null;
  const cols = trip.collaborators||[];
  const owner = cols.find(c=>c.role==='owner') || cols[0];
  return owner ? owner.id : null;
}
function pinReactionCounts(pin){
  const out={}; PIN_REACTION_KEYS.forEach(k=>out[k]=0);
  (pin.reactions||[]).forEach(r=>{ if(out[r.reaction]!==undefined) out[r.reaction]++; });
  return out;
}
// Toggle my reaction on a pin. Owner writes land in the trip directly; a member's
// write goes through the guarded react_to_pin RPC (trips are owner-write-only),
// with a local echo so the chip responds instantly · next sync reconciles.
function makePinReactor(trip, onUpdateTrip){
  const me = myMemberIdFor(trip);
  const isOwner = trip._myRole==='owner' || !trip._myRole;
  if(!me || !onUpdateTrip) return { myMemberId: me, react: null };
  const react = (pinId, key)=>{
    let cleared=false;
    const pins=(trip.pinnedIdeas||[]).map(p=>{
      if(p.id!==pinId) return p;
      const mine=(p.reactions||[]).find(r=>r.memberId===me);
      const rest=(p.reactions||[]).filter(r=>r.memberId!==me);
      if(mine && mine.reaction===key){ cleared=true; return {...p, reactions:rest}; }
      return {...p, reactions:[...rest, {memberId:me, reaction:key, ts:Date.now()}]};
    });
    onUpdateTrip({...trip, pinnedIdeas:pins});
    track('pin_reaction',{reaction:cleared?'clear':key, self:!isOwner});
    if(!isOwner){
      const c=sb();
      if(c) (async()=>{ try{ const {error}=await c.rpc('react_to_pin',{p_trip_id:trip.id,p_pin_id:String(pinId),p_reaction:cleared?null:key}); if(error) throw error; }catch(e){ showToast(seatRemoved(e)?'Your spot on this trip was removed by the organiser.':"Couldn't save your reaction · try again.",'error',6000); } })();
    }
  };
  return { myMemberId: me, react };
}
// Reactions carry over to RSVP when an idea trip becomes real. Anyone who loved a
// pin and is still Pending gets SUGGESTED as Going · never forced. The suggestion
// shows as a one-tap confirm on their Crew row and clears the moment they answer.
function applyPinReactionCarryover(trip){
  const loved=new Set();
  (trip.pinnedIdeas||[]).forEach(p=>(p.reactions||[]).forEach(r=>{ if(r.reaction==='love') loved.add(r.memberId); }));
  if(!loved.size) return { collaborators: trip.collaborators||[], suggested: 0 };
  let suggested=0;
  const collaborators=(trip.collaborators||[]).map(c=>{
    if(!loved.has(c.id) || (c.rsvp||'pending')!=='pending' || c.rsvpSuggested) return c;
    suggested++; return {...c, rsvpSuggested:'going'};
  });
  return { collaborators, suggested };
}
function PinReactions({pin, myMemberId, onReact}){
  const counts=pinReactionCounts(pin);
  const mine=(pin.reactions||[]).find(r=>r.memberId===myMemberId);
  const total=(pin.reactions||[]).length;
  const canReact=!!onReact;
  return (
    <div style={{display:'flex',alignItems:'center',gap:6,marginTop:12,flexWrap:'wrap'}} onClick={e=>e.stopPropagation()}>
      {PIN_REACTIONS.map(r=>{
        const on = mine && mine.reaction===r.key;
        const n = counts[r.key];
        return (
          <button key={r.key} type="button" disabled={!canReact}
            onClick={()=>canReact&&onReact(pin.id, r.key)}
            aria-pressed={on} aria-label={`${r.label}${n?` · ${n}`:''}`}
            title={canReact?(on?'Tap to undo':r.label):'Join the trip to react'}
            style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,
              padding:'0 14px',minHeight:44,minWidth:44,
              borderRadius:'var(--radius-ctl)',fontSize:'.74rem',fontWeight:600,lineHeight:1.4,
              cursor:canReact?'pointer':'default',
              border:'1px solid '+(on?'var(--color-accent)':'var(--color-border)'),
              background:on?'var(--color-accent-soft)':'transparent',
              color:on?'var(--color-accent-deep)':'var(--color-ink-light)',
              opacity:canReact?1:.75,transition:'background .12s, border-color .12s'}}>
            <span>{r.label}</span>
            {n>0 && <span style={{fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums',fontSize:'.7rem',opacity:.85}}>{n}</span>}
          </button>
        );
      })}
      {!canReact && total>0 && <span style={{fontSize:'.7rem',color:'var(--color-ink-muted)'}}>Join the trip to react</span>}
    </div>
  );
}

  const items=[];
  const daysToGo=Math.max(0, Math.ceil((new Date(trip.startDate+'T12:00:00')-new Date())/86400000));

  // Once the trip is underway, "next 3 things" means what is actually happening,
  // pulled live from the confirmed itinerary rather than pre-trip prep.
  const todayISO=new Date(new Date().getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  const underway = trip.startDate && trip.endDate && todayISO>=trip.startDate && todayISO<=trip.endDate;
  if(underway){
    const today=(trip.days||[]).find(d=>d.date===todayISO);
    const todayStops=today?[...(today.activities||[]),...(today.restaurants||[])]
      .sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0)):[];
    if(todayStops.length){
      return (
        <div style={{margin:'0 0 24px',display:'flex',flexDirection:'column',gap:12}}>
          <K>Today · {formatDateDow?formatDateDow(todayISO):todayISO}</K>
          {todayStops.slice(0,3).map(s=>(
            <Row key={s.id} emoji="" title={s.name}
              sub={[s.time?fmt12h(s.time):null, s.neighborhood||s.address||null].filter(Boolean).join(' · ')||'Tap to open the day'}
              onClick={()=>onGoTab('days')}/>
          ))}
        </div>
      );
    }
  }

  const due=(trip.checklist||[]).filter(i=>!i.completed && typeof i.daysBeforeTrip==='number' && daysToGo<=i.daysBeforeTrip)
    .sort((a,b)=>b.daysBeforeTrip-a.daysBeforeTrip);
  // These are real checklist rows, so they get a real Done control. Previously
  // tapping only jumped to the Get Ready tab and nothing could ever be ticked off
  // from here, so the same three reminders sat there forever.
  due.slice(0,2).forEach(i=>items.push({emoji:'',title:i.label,sub:`Due ~${i.daysBeforeTrip} days out · ${daysToGo} to go`,tab:'getready',checklistId:i.id}));
  const pending=(trip.collaborators||[]).filter(m=>(m.rsvp||'pending')==='pending');
  if(pending.length) items.push({emoji:'',title:`${pending.length} crew still pending RSVP`,sub:pending.map(m=>m.name).slice(0,3).join(', ')+' · tap to invite',tab:'crew'});
  if(!(trip.flights||[]).length) items.push({emoji:'',title:'Add your flights',sub:'Upload a confirmation and Locale reads it for you',tab:'days'});
  else {
    const covered=(m)=>(trip.flights||[]).some(f=>(f.travelerIds||[]).length ? f.travelerIds.includes(m.id) : true);
    const noTravel=(trip.collaborators||[]).filter(m=>(m.rsvp||'pending')!=='no' && !covered(m));
    if(noTravel.length) items.push({emoji:'',title:noTravel.length===1?(noTravel[0].name+" hasn't added travel yet"):(noTravel.length+" crew haven't added travel yet"),sub:'Everyone adds their own flight; arrivals line up on Day 1',tab:'crew'});
  }
  if(!(trip.lodging||[]).length) items.push({emoji:'',title:"Add where you're staying",sub:'Upload the booking confirmation',tab:'days'});
  // UAT #7 · packing is the other half of "am I prepared?" — surface it here as the
  // trip closes in, so Next-3 reflects checklist AND packing, not checklist alone.
  // Derived on every render, so ticking items off in Get Ready updates this reactively.
  const packItems=Array.isArray(trip.packingList)?trip.packingList:[];
  const unpacked=packItems.filter(i=>i&&!(i.packed||i.completed));
  if(packItems.length && unpacked.length && daysToGo<=10){
    items.push({emoji:'',title:`${unpacked.length} thing${unpacked.length===1?'':'s'} left to pack`,
      sub:unpacked.slice(0,3).map(i=>i.label||i.name).filter(Boolean).join(', ')+(unpacked.length>3?' …':'')+' · tap to open Get Ready',tab:'getready'});
  } else if(!packItems.length && daysToGo<=14){
    items.push({emoji:'',title:'Build your packing list',sub:'Locale drafts one from your destinations and forecast',tab:'getready'});
  }
  if(items.length===0) items.push({emoji:'',title:"You're in great shape",sub:'Nothing urgent. Browse your days or fine-tune the plan',tab:'days'});
  return (
    <div style={{margin:'0 0 24px',display:'flex',flexDirection:'column',gap:12}}>
      <K>Next {Math.min(3,items.length)===1?'thing':Math.min(3,items.length)+' things'} · {daysToGo>0?daysToGo+' days to go':'trip time'}</K>
      {items.slice(0,3).map((it,i)=>(
        <Row key={i} emoji={it.emoji} title={it.title} sub={it.sub} onClick={()=>onGoTab(it.tab)}
          onDone={it.checklistId && onCompleteChecklistItem ? ()=>onCompleteChecklistItem(it.checklistId) : null}/>
      ))}
    </div>
  );
}

  React.useEffect(()=>{ let on=true; makeTripShareUrl(trip).then(u=>{ if(on&&u) setShareUrl(u); }); return ()=>{on=false}; },[trip.id]);
