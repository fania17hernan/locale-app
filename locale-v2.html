// ── CITY AUTOCOMPLETE ─────────────────────────────────────────────────────────
function CityAutocomplete({value, country, onChange, onCountryChange}) {
  const {useState: uS, useRef: uR, useEffect: uE} = React;
  const [suggestions, setSuggestions] = uS([]);
  const [focused, setFocused] = uS(false);
  const wrapRef = uR(null);

  // Close dropdown when clicking outside
  uE(()=>{
    const handler = e => { if(wrapRef.current && !wrapRef.current.contains(e.target)) setFocused(false); };
    document.addEventListener('mousedown', handler);
    return ()=>document.removeEventListener('mousedown', handler);
  },[]);
  const lastQueryRef = React.useRef('');

  // Normalize on blur so "ZUrich" → "Zurich" without fighting the user mid-keystroke.
  // Known cities get canonical casing; unknown ones get per-word title case (hyphen/space aware).
  const normalizeCity = v => {
    const t = (v||'').trim();
    if(!t) return t;
    const key = t.toLowerCase();
    if(CITY_TO_COUNTRY[key]) return key.replace(/(^|[\s\-'])(\p{L})/gu, (m,sep,ch)=>sep+ch.toUpperCase());
    return t.replace(/\p{L}[\p{L}']*/gu, w => w === w.toUpperCase() && w.length <= 3 ? w : w.charAt(0).toUpperCase()+w.slice(1).toLowerCase());
  };

  const handleInput = v => {
    const matches = searchCities(v);
    setSuggestions(matches);
    setFocused(true);
    // Widen to the global geocoder in the background · results append when they land,
    // and a stale response for an older keystroke is discarded.
    const q=(v||'').trim();
    lastQueryRef.current=q;
    if(q.length>=2){
      searchCitiesRemote(q).then(remote=>{
        if(lastQueryRef.current!==q || !remote.length) return;
        setSuggestions(prev=>mergeCityResults(searchCities(q), remote));
      });
    }
    // Also try CITY_TO_COUNTRY exact match for auto-fill without selecting from list
    const key = v.toLowerCase().trim();
    const cityMatch = CITY_TO_COUNTRY[key];
    if(cityMatch) {
      onChange(v.length ? v.charAt(0).toUpperCase()+v.slice(1) : v, cityMatch);
    } else {
      onChange(v.length ? v.charAt(0).toUpperCase()+v.slice(1) : v, null);
    }
  };

  const select = c => {
    onChange(c.city, {countryCode: c.countryCode, country: c.country, isInternational: c.isInternational, region: c.region});
    setSuggestions([]);
    setFocused(false);
  };

  const showDrop = focused && suggestions.length > 0;

  return (
    <div ref={wrapRef} style={{position:'relative', marginBottom:8}}>
      <div style={{display:'grid', gridTemplateColumns:'2fr 1fr', gap:8}}>
        <div style={{position:'relative'}}>
          <input className="input" placeholder="City (e.g. Portland, OR)"
            autoComplete="off" autoCorrect="off" autoCapitalize="words" spellCheck="false"
            value={value}
            onFocus={()=>{ if(value.length>=2) setSuggestions(searchCities(value)); setFocused(true); }}
            onChange={e=>handleInput(e.target.value)}
            onBlur={()=>{ const n=normalizeCity(value); if(n!==value){ const key=n.toLowerCase().trim(); onChange(n, CITY_TO_COUNTRY[key]||null); } }}
          />
          {showDrop && (
            <div style={{
              position:'absolute', top:'calc(100% + 4px)', left:0, right:0, zIndex:100,
              background:'var(--color-surface)', border:'1px solid var(--color-border)',
              borderRadius:10, boxShadow:'0 4px 16px rgba(0,0,0,.12)', overflow:'hidden'
            }}>
              {suggestions.map((c,idx)=>(
                <button key={idx} onMouseDown={()=>select(c)} style={{
                  width:'100%', textAlign:'left', padding:'10px 14px', background:'none', border:'none',
                  borderBottom: idx<suggestions.length-1 ? '1px solid var(--color-border)' : 'none',
                  cursor:'pointer', display:'flex', alignItems:'center', gap:8
                }}
                onMouseEnter={e=>e.currentTarget.style.background='var(--color-cream)'}
                onMouseLeave={e=>e.currentTarget.style.background='none'}>
                  <span style={{fontSize:'.875rem', fontWeight:500, color:'var(--color-ink)'}}>{c.city}</span>
                  {c.region && <span style={{fontSize:'.78rem', color:'var(--color-ink-muted)'}}>{c.region}</span>}
                  <span style={{fontSize:'.75rem', color:'var(--color-ink-light)', marginLeft:'auto'}}>{c.country}</span>
                </button>
              ))}
            </div>
          )}
        </div>
        <input className="input" placeholder="Country"
          autoComplete="off" autoCorrect="off" autoCapitalize="words" spellCheck="false"
          value={country}
          onChange={e=>{ const v=e.target.value; onCountryChange(v.length?v.charAt(0).toUpperCase()+v.slice(1):v); }}
        />
      </div>
    </div>
  );
}

            <div>

              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
              <div>
                <label className="section-label">Travelers</label>

              </div>
              <div>
                <label className="section-label">Your Passport / Citizenship</label>
                <select className="input" value={form.travelerPassportCountry} onChange={e=>set('travelerPassportCountry',e.target.value)}>

                </select>
              </div>
            </div>
            <button className="btn btn-primary" style={{marginTop:8}} onClick={()=>{if(validate1())setStep(2);}}>Next: When & Where →</button>
          </div>
        )}

        {step===2 && (
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
              <div>
                <label className="section-label" style={{whiteSpace:'nowrap'}}>{form.planningStage==='idea'?'Start Date (optional)':'Start Date *'}</label>
                <input className={`input ${errors.startDate?'input-error':''}`} type="date" value={form.startDate} onChange={e=>{
                  const v=e.target.value;
                  set('startDate',v);
                  // Auto-suggest end date as +1 day if end is not yet set or is before new start
                  if(v&&(!form.endDate||form.endDate<=v)){
                    const d=new Date(v+'T12:00:00');d.setDate(d.getDate()+1);
                    set('endDate',d.toISOString().slice(0,10));
                  }
                }}/>
                {errors.startDate&&<p style={{color:'var(--color-flag)',fontSize:'.75rem',marginTop:4}}>{errors.startDate}</p>}
              </div>
              <div>
                <label className="section-label" style={{whiteSpace:'nowrap'}}>{form.planningStage==='idea'?'End Date (optional)':'End Date *'}</label>
                <input className={`input ${errors.endDate?'input-error':''}`} type="date" value={form.endDate} onChange={e=>set('endDate',e.target.value)} min={form.startDate||undefined}/>
                {errors.endDate&&<p style={{color:'var(--color-flag)',fontSize:'.75rem',marginTop:4}}>{errors.endDate}</p>}
              </div>
            </div>
            <div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>

                <button className="btn btn-ghost" style={{fontSize:'.8rem',padding:'4px 10px'}} onClick={addDest}>+ Add Stop</button>
              </div>
              {errors.destinations&&<p style={{color:'var(--color-flag)',fontSize:'.75rem',marginBottom:8}}>{errors.destinations}</p>}
              {form.destinations.map((d,i)=>(
                <div key={d.id} style={{border:'1px solid var(--color-border)',borderRadius:12,padding:12,marginBottom:8,background:'var(--color-cream)'}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                    <span style={{fontSize:'.8rem',fontWeight:600,color:'var(--color-ink-light)'}}>Stop {i+1}</span>
                    {form.destinations.length>1&&<button className="btn btn-ghost" style={{fontSize:'.75rem',padding:'2px 8px',color:'var(--color-flag)'}} onClick={()=>removeDest(i)}>Remove</button>}
                  </div>
                  <CityAutocomplete
                    value={d.city}
                    country={d.country||''}
                    onChange={(cityVal, meta)=>{
                      setForm(f=>{
                        const ds=[...f.destinations];
                        ds[i]={...ds[i], city:cityVal, ...(meta||{})};
                        return{...f,destinations:ds};
                      });
                    }}
                    onCountryChange={v=>{
                      setForm(f=>{const ds=[...f.destinations];ds[i]={...ds[i],country:v};return{...f,destinations:ds};});
                    }}
                  />
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                    <div>
                      <label className="section-label" style={{fontSize:'.7rem'}}>Arrival</label>
                      <input className="input" type="date" value={d.arrivalDate}
                        min={form.startDate||undefined} max={form.endDate||undefined}
                        onChange={e=>{
                          const v=e.target.value;
                          setDest(i,'arrivalDate',v);
                          // Auto-advance departure to next day if unset or before arrival
                          if(v&&(!d.departureDate||d.departureDate<=v)){
                            const next=new Date(v+'T12:00:00');next.setDate(next.getDate()+1);
                            const nextStr=next.toISOString().slice(0,10);
                            setForm(f=>{const ds=[...f.destinations];ds[i]={...ds[i],arrivalDate:v,departureDate:nextStr<=form.endDate?nextStr:form.endDate||nextStr};return{...f,destinations:ds};});
                          }
                        }}/>
                    </div>
                    <div>
                      <label className="section-label" style={{fontSize:'.7rem'}}>Departure</label>
                      <input className="input" type="date" value={d.departureDate}
                        min={d.arrivalDate||form.startDate||undefined} max={form.endDate||undefined}
                        onChange={e=>setDest(i,'departureDate',e.target.value)}/>
                    </div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setStep(1)}>← Back</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={()=>{if(validate2())setStep(3);}}>Preview →</button>
            </div>
          </div>
        )}

        {step===3 && (
          <div>
            <div style={{border:'1px solid var(--color-border)',borderRadius:16,overflow:'hidden',marginBottom:20}}>
              <div className={`trip-card-header gradient-${form.destinations[0]?.countryCode==='GB'?'london':form.destinations[0]?.countryCode==='FR'?'paris':form.destinations[0]?.city?.toLowerCase().includes('miami')?'miami':'generic'}`} style={{padding:'20px 16px'}}>
                <div style={{fontSize:'2rem'}}>{form.emoji}</div>
                <div style={{flex:1}}>
                  <div style={{fontFamily:'var(--font-display)',fontSize:'1.2rem',fontWeight:700,color:'#fff'}}>{form.title||'Your Trip'}</div>
                  <div style={{fontSize:'.8rem',color:'rgba(255,255,255,.8)'}}>{formatDateShort(form.startDate)} – {formatDateShort(form.endDate)}</div>
                </div>
              </div>
              <div style={{padding:16}}>
                <p style={{fontSize:'.85rem',color:'var(--color-ink-light)',marginBottom:12}}>Destinations: {form.destinations.filter(d=>d.city).map(d=>d.city).join(' → ')}</p>
                <p style={{fontSize:'.85rem',color:'var(--color-ink-light)'}}>Auto-checklist will be generated ({form.destinations.some(d=>d.countryCode!=='US')?'international':'domestic'} trip · {getOccasionLabel(form.occasion)})</p>
                {getIntlFlags(form).length>0&&(
                  <div style={{marginTop:12,display:'flex',gap:8,flexWrap:'wrap'}}>
                    {getIntlFlags(form).map((f,i)=><span key={i} className="pill badge-must" style={{fontSize:'.75rem'}}>{f.emoji} {f.label}</span>)}
                  </div>
                )}
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setStep(2)}>← Back</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={handleCreate}>✨ Create trip</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function generateTripPDF(trip) {
  track('pdf_export');
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const gradMap = {
    'gradient-generic':  'linear-gradient(135deg,#1C4A56,#2B5F6E,#3D5A7A)',
    'gradient-london':   'linear-gradient(135deg,#1C4A56,#2B5F6E,#1E3D4A)',
    'gradient-paris':    'linear-gradient(135deg,#2A3F5F,#3D5A7A,#253352)',
    'gradient-miami':    'linear-gradient(135deg,#2E5C4A,#4A7268,#1F4035)',
    'gradient-sunset':   'linear-gradient(135deg,#5C3020,#7A5240,#9A6B50)',
    'gradient-forest':   'linear-gradient(135deg,#243D2E,#3A5C48,#2E4A3A)',
    'gradient-desert':   'linear-gradient(135deg,#5C4A20,#7A6840,#6B5530)',
    'gradient-lavender': 'linear-gradient(135deg,#3D2E5C,#5A4A78,#4A3868)',
    'gradient-rose':     'linear-gradient(135deg,#5C2E3A,#7A4A58,#6B3848)',
    'gradient-slate':    'linear-gradient(135deg,#2E3A4A,#3D4D5C,#2A3848)',
  };
  const firstDest = trip.destinations?.[0];
  const autoGrad = firstDest?.countryCode==='GB'?'gradient-london':firstDest?.countryCode==='FR'?'gradient-paris':'gradient-generic';
  const grad = gradMap[trip.coverGradient||autoGrad] || gradMap['gradient-generic'];

  const checklist = trip.checklist || [];
  const cats = [...new Set(checklist.map(i=>i.category))];

  const checklistHTML = checklist.length === 0 ? '' : `
    <section class="section">
      <h2 class="section-title">Checklist</h2>
      <p class="meta">${checklist.filter(i=>i.completed).length} of ${checklist.length} items complete</p>
      ${cats.map(cat=>`
        <div class="cat-label">${esc(cat)}</div>
        ${checklist.filter(i=>i.category===cat).map(item=>`
          <div class="checklist-row ${item.completed?'done':''}">
            <span class="cb">${item.completed?'✓':''}</span>
            <span>${esc(item.label)}</span>
          </div>
        `).join('')}
      `).join('')}
    </section>`;

  const daysHTML = (trip.days||[]).map(day=>`
    <div class="day-block">
      <div class="day-header">${esc(day.label||formatDate(day.date))}</div>
      ${(day.activities||[]).map(a=>`
        <div class="card">
          <div class="card-title">${a.emoji||'📍'} ${esc(a.name)}</div>
          ${a.address?`<div class="card-meta">${esc(a.address)}</div>`:''}
          ${a.notes?`<div class="card-notes">${esc(a.notes)}</div>`:''}
          ${a.bookingRequired&&a.bookingUrl?`<div class="book-badge">Book in advance</div>`:''}
        </div>
      `).join('')}
      ${(day.restaurants||[]).map(r=>`
        <div class="card">
          <div class="card-title">${r.emoji||'🍽️'} ${esc(r.name)}</div>
          ${r.cuisine?`<div class="card-meta">${esc(r.cuisine)}${r.neighborhood?' · '+esc(r.neighborhood):''}</div>`:''}
          ${r.notes?`<div class="card-notes">${esc(r.notes)}</div>`:''}
          ${r.reservationRequired?`<div class="book-badge">Reservation recommended</div>`:''}
        </div>
      `).join('')}
      ${day.notes?`<div class="day-notes">📝 ${esc(day.notes)}</div>`:''}
    </div>
  `).join('');

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#F5F2EC;color:#1A1714;font-size:13px;line-height:1.5}
    .cover{background:${grad};color:#fff;padding:36px 32px 28px;border-radius:0 0 20px 20px;margin-bottom:24px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .cover-wordmark{font-family:'Cormorant Garamond',serif;font-size:13px;opacity:.7;margin-bottom:12px;letter-spacing:.1em}
    .cover-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;margin-bottom:6px}
    .cover-meta{opacity:.8;font-size:12px;margin-bottom:4px}
    .cover-dest{opacity:.7;font-size:11px}
    .section{padding:0 24px;margin-bottom:20px}
    .section-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:#2B5F6E;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #DDD9D1}
    .meta{font-size:11px;color:#8A8784;margin-bottom:10px}
    .cat-label{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8A8784;margin:10px 0 4px}

// Dot meter for remaining free AI generations. Server enforces the real cap; this is
// an informational "meter before the wall." Defaults to the full cap when usage hasn't
// loaded yet (a brand-new user has used 0), so every user sees their allotment up front.
function FreeTriesMeter({freeLeft, cap, singular='generation', plural='generations'}) {
  const left = freeLeft == null ? cap : Math.max(0, Math.min(cap, freeLeft));
  const label = left > 0 ? `${left} of ${cap} free ${left === 1 ? singular : plural} left` : `Free ${plural} used`;
  const pct = cap > 0 ? (left / cap) * 100 : 0;
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:8}} role="img" aria-label={label}>
      <span aria-hidden="true" style={{display:'inline-block',width:48,height:5,borderRadius:99,background:'rgba(255,255,255,.25)',overflow:'hidden',flexShrink:0}}>
        <span style={{display:'block',height:'100%',width:pct+'%',background:left>0?'#FFB27A':'transparent',borderRadius:99,transition:'width .3s'}}/>
      </span>
      <span style={{fontSize:'.75rem',color:'#fff',whiteSpace:'nowrap'}}>{label}</span>
    </span>
  );
}

// Tap a crew member's name to edit them · contact + role (owner) and attendance (owner or self). UAT 2026-07-15.
function MemberEditSheet({member, isOwner, onClose, onSave, onRemove}){
  const [name,setName]=React.useState(member.name||'');
  const [email,setEmail]=React.useState(member.email||'');
  const [phone,setPhone]=React.useState(member.phone||'');

  return (
    <div className="overlay" role="dialog" aria-modal="true" aria-label="Edit traveler" onClick={e=>e.target===e.currentTarget&&onClose()}>

          <label className="section-label" style={{marginTop:8}}>Email</label>
          <input className="input" type="email" value={email} disabled={!isOwner} onChange={e=>setEmail(e.target.value)}/>
          <label className="section-label" style={{marginTop:8}}>Mobile number</label>
          <input className="input" type="tel" value={phone} disabled={!isOwner} onChange={e=>setPhone(e.target.value)}/>
          {isOwner && (<>

            <select className="input" value={role} onChange={e=>setRole(e.target.value)}>

        </div>
      </div>
    </div>
  );

function CrewSection({trip, onUpdateTrip}){
  const members = trip.collaborators || [];
  const counts = members.reduce((a,m)=>{const r=m.rsvp||'pending';a[r]=(a[r]||0)+1;return a;},{});
  const isOwner = trip._myRole==='owner' || !trip._myRole; // untagged (locally-created, never synced) trips are always mine
  const save = (next)=> onUpdateTrip({...trip, collaborators: next});
  const setRsvp = (id, rsvp)=>{
    if(!isOwner){
      // Not the owner · the only write I'm allowed is MY OWN rsvp, and even that
      // has to go through the guarded function since trips are owner-write-only.
      if(id!==trip._myCollaboratorId) return;
      const c=sb();
      if(c) (async()=>{ try{ const {error}=await c.rpc('set_my_rsvp',{p_trip_id:trip.id,p_rsvp:rsvp}); if(error) throw error; }catch(e){ showToast(seatRemoved(e)?'Your spot on this trip was removed by the organiser.':"Couldn't update RSVP · try again.",'error',6000); } })();
      return;
    }
    // An explicit answer retires the carryover suggestion for good.
    save(members.map(m=>m.id===id?{...m, rsvp, rsvpSuggested:null}:m));
  };
  const setPay = (id, field, val)=> save(members.map(m=>m.id===id?{...m, [field]:val}:m));
  const updateMember = (id, patch)=> save(members.map(m=>m.id===id?{...m, ...patch}:m));
  // Removing a traveler must also retire their server-side seat. Without this the
  // trip_members row outlives the collaborator it points at, and that person keeps
  // read access while every write they make silently updates nothing.
  const remove = (id)=> {
    if(!window.confirm('Remove this person from the trip?')) return;
    save(members.filter(m=>m.id!==id));
    const c=sb();
    if(c) (async()=>{ try{ await c.rpc('remove_trip_member',{p_trip_id:trip.id,p_collaborator_id:id}); }catch(e){} })();
  };
  const [editingMemberId,setEditingMemberId]=React.useState(null);
  const [name,setName]=React.useState('');
  const [email,setEmail]=React.useState('');
  const [phone,setPhone]=React.useState('');
  const [rsvp,setR]=React.useState('pending');
  const [role,setRole]=React.useState('crew'); // 'crew' can add notes/suggestions; 'viewer' is read-only + rsvp
  const add = ()=>{
    if(!name.trim()){ showToast('Add a name.','warn'); return; }
    if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.trim())){ showToast('That email looks off.','warn'); return; }
    const color = AVATAR_COLORS[members.length % AVATAR_COLORS.length];
    save([...members, {id:uuid(), name:name.trim(), email:email.trim(), phone:phone.trim(), rsvp, role, avatarColor:color}]);
    track('crew_add', { role, hasEmail: !!email.trim() });
    setName(''); setEmail(''); setPhone(''); setR('pending'); setRole('crew');
  };
  const shareInvite = async ()=>{
    const url = await makeTripShareUrl(trip);
    if(!url){ showToast('Could not create an invite link.','error'); return; }
    if(navigator.share){ navigator.share({title:trip.title, text:'Join my trip on Locale', url}).then(()=>showToast('Invite link shared ✓','info',3000)).catch(()=>{ navigator.clipboard?.writeText(url).then(()=>showToast('Invite link copied · recipients can view this trip.','info',4000)).catch(()=>{}); }); }
    else { navigator.clipboard.writeText(url).then(()=>showToast('Invite link copied · recipients can view this trip.','info',4000)).catch(()=>prompt('Copy invite link:', url)); }
  };
  // Phase 2: if this person has an email, try to actually send them an invite
  // via the send-invite Edge Function (Resend). Falls back to the Phase 1
  // manual share/copy-link flow if that fails for any reason (no Resend key
  // configured yet, offline, trip not synced, etc.) · never a dead end.
  // Invite = explicit channel choice (Stephanie's UAT 2026-07-15: no silent share-sheet fallback).
  // Tapping Invite opens a chooser showing the member's actual email/mobile; each send confirms with a toast.
  const [invitingMember,setInvitingMember]=React.useState(null);
  const inviteMember = (m)=> setInvitingMember(m);
  // Phase 2c: crew self-serve flights. Owner writes directly; a member's write goes
  // through the guarded set_my_flight/delete_my_flight RPCs (owner-write-only trips),
  // with a local echo so the UI responds immediately · next sync reconciles.
  const [flightSheet,setFlightSheet]=React.useState(null); // {member, flight}
  const saveFlight=(entry)=>{
    const flights=[...(trip.flights||[])];
    const i=flights.findIndex(f=>f.id===entry.id);
    if(i>=0) flights[i]=entry; else flights.push(entry);
    onUpdateTrip({...trip, flights});
    track('crew_flight_save',{self:!isOwner});
    if(!isOwner){
      const c=sb();
      if(c) (async()=>{ try{ const {error}=await c.rpc('set_my_flight',{p_trip_id:trip.id,p_flight:entry}); if(error) throw error; }catch(e){ showToast(seatRemoved(e)?'Your spot on this trip was removed by the organiser.':"Couldn't sync your flight · try again.",'error',6000); } })();
    }
    setFlightSheet(null); showToast('Flight saved ✓','info',2500);
  };
  const deleteFlight=(f)=>{
    onUpdateTrip({...trip, flights:(trip.flights||[]).filter(x=>x.id!==f.id)});
    if(!isOwner){
      const c=sb();
      if(c) (async()=>{ try{ const {error}=await c.rpc('delete_my_flight',{p_trip_id:trip.id,p_flight_id:String(f.id)}); if(error) throw error; }catch(e){ showToast("Couldn't remove the flight · try again.",'error'); } })();
    }
    setFlightSheet(null);
  };
  const buildInviteUrl = async ()=>{ return await makeTripShareUrl(trip); };
  const markInviteSent = (m)=> save(members.map(x=>x.id===m.id?{...x, invitedAt:Date.now(), inviteSentCount:(x.inviteSentCount||0)+1}:x));
  const shareLinkInvite = async (m)=>{
    const url=await buildInviteUrl();
    if(!url){ showToast('Could not create an invite link.','error'); return; }
    track('crew_invite',{via:'link'});
    if(navigator.share){ navigator.share({title:trip.title, text:`Join "${trip.title||'my trip'}" on Locale`, url}).then(()=>{ markInviteSent(m); showToast(`Invite shared for ${m.name} ✓`,'info',3500); }).catch(()=>{}); }
    else {
      navigator.clipboard.writeText(url)
        .then(()=>{ markInviteSent(m); showToast(`Invite link copied for ${m.name}. Paste it into a text or email.`,'info',4500); })
        .catch(()=>{ markInviteSent(m); prompt(`Copy invite link for ${m.name}:`, url); });
    }
  };
  const sendTextInvite = async (m)=>{
    const url=await buildInviteUrl();
    if(!url || !m.phone){ shareLinkInvite(m); return; }
    const smsUrl = 'sms:' + m.phone.replace(/[^+\d]/g,'') + '?&body=' + encodeURIComponent(`Join "${trip.title||'my trip'}" on Locale: ${url}`);
    track('crew_invite',{via:'sms'});
    markInviteSent(m);
    showToast(`Opening Messages to text ${m.name}…`,'info',3500);
    window.location.href = smsUrl;
  };
  const sendEmailInvite = async (m)=>{
    const url=await buildInviteUrl();
    if(!url){ showToast('Could not create an invite link.','error'); return; }
    // Tracked invite needs a synced trip + session. Anything else (demo trips,
    // signed-out, Resend hiccup) opens the mail app with the link instead of a dead end.
    const mailFallback=()=>{
      track('crew_invite',{via:'email_compose'});
      markInviteSent(m);
      showToast('Opening your email app to send the invite.','info',3500);
      window.location.href='mailto:'+encodeURIComponent(m.email.trim())
        +'?subject='+encodeURIComponent(`Join "${trip.title||'my trip'}" on Locale`)
        +'&body='+encodeURIComponent(`Join "${trip.title||'my trip'}" on Locale: ${url}`);
    };

function computeSettlements(balMap){
  const creditors=[],debtors=[];
  Object.entries(balMap).forEach(([id,v])=>{ const c=Math.round(v*100); if(c>0)creditors.push({id,c}); else if(c<0)debtors.push({id,c:-c}); });
  creditors.sort((a,b)=>b.c-a.c); debtors.sort((a,b)=>b.c-a.c);
  const res=[]; let ci=0,di=0; let guard=0;
  while(ci<creditors.length&&di<debtors.length&&guard++<999){
    const give=Math.min(creditors[ci].c,debtors[di].c);
    if(give>0) res.push({from:debtors[di].id,to:creditors[ci].id,amount:give/100});
    creditors[ci].c-=give; debtors[di].c-=give;
    if(creditors[ci].c===0)ci++; if(debtors[di].c===0)di++;
  }
  return res;
}

function BudgetSection({trip, onUpdateTrip}){
  const isOwner = trip._myRole==='owner' || !trip._myRole; // members see the budget read-only, owner edits
  const budget = (trip.budget && Array.isArray(trip.budget.items)) ? trip.budget : {currency:'USD', items:[], payments:[]};
  const items = budget.items;
  const payments = budget.payments || [];
  const members = trip.collaborators || [];
  const days = trip.days || [];
  const fmt = n => '$' + (Math.round((Number(n)||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const total = items.reduce((s,i)=>s+(Number(i.amount)||0),0);
  const nameOf = id => (members.find(m=>m.id===id)?.name)||'—';
  const colorOf = id => (members.find(m=>m.id===id)?.avatarColor)||AVATAR_COLORS[0];
  const dayLabel = (id)=>{ const idx=days.findIndex(x=>x.id===id); return idx>=0 ? (days[idx].label||('Day '+(idx+1))) : null; };

  const [label,setLabel]=React.useState('');
  const [amount,setAmount]=React.useState('');
  const [dayId,setDayId]=React.useState('');
  const [paidBy,setPaidBy]=React.useState(''); // no default payer · assign after the fact (see DECISIONS.md)
  const [excluded,setExcluded]=React.useState([]); // member ids excluded from this expense's split
  const [showSplit,setShowSplit]=React.useState(false);

  const saveItems = (next)=> onUpdateTrip({...trip, budget:{currency:budget.currency||'USD', items:next, payments}});
  const savePayments = (next)=> onUpdateTrip({...trip, budget:{currency:budget.currency||'USD', items, payments:next}});
  const add = ()=>{
    const a=parseFloat(amount);
    if(!label.trim() || !(a>=0)){ showToast('Add a label and an amount.','warn'); return; }
    saveItems([...items, {id:uuid(), label:label.trim(), amount:a, day:dayId||null, paidBy:paidBy||null, excluded:[...excluded]}]);
    track('budget_add', { split: excluded.length>0 });
    setLabel(''); setAmount(''); setDayId(''); setPaidBy(''); setExcluded([]); setShowSplit(false);
  };
  const remove = (id)=> saveItems(items.filter(i=>i.id!==id));
  const update = (id,patch)=> saveItems(items.map(i=>i.id===id?{...i,...patch}:i));
  const recordPayment=(from,to,amt)=> savePayments([...payments,{id:uuid(),from,to,amount:amt,ts:Date.now()}]);
  const undoPayment=(id)=> savePayments(payments.filter(p=>p.id!==id));

  // Per-person balances (positive = owed to them; negative = they owe)
  const bal={}; members.forEach(m=>bal[m.id]=0);
  items.forEach(it=>{
    if(!it.paidBy || bal[it.paidBy]===undefined) return; // unassigned expenses stay out of balances until a payer is set
    const amt=Number(it.amount)||0;
    const included = members.filter(m=>!(it.excluded||[]).includes(m.id));
    const n = included.length || 1;
    const share = amt/n;
    included.forEach(m=>{
      if(m.id===it.paidBy) return;                       // payer covers their own share
      if((it.settledIds||[]).includes(m.id)) return;     // already paid the payer back · settled
      bal[m.id]-=share; bal[it.paidBy]+=share;
    });
  });
  payments.forEach(p=>{ if(bal[p.from]!==undefined)bal[p.from]+=Number(p.amount)||0; if(bal[p.to]!==undefined)bal[p.to]-=Number(p.amount)||0; });
  const settlements = members.length>=2 ? computeSettlements(bal) : [];
  const splitInfo=(it)=>{
    const inc=members.filter(m=>!(it.excluded||[]).includes(m.id));
    const n=inc.length||1;
    const owers=inc.filter(m=>m.id!==it.paidBy);
    const paidCount=(it.settledIds||[]).filter(id=>owers.some(m=>m.id===id)).length;
    const paidPart=it.paidBy&&owers.length?` · ${paidCount}/${owers.length} paid back`:'';
    return members.length ? `${it.paidBy?nameOf(it.paidBy)+' paid':'Payer not set · tap ✎ to assign'} · split ${n} way${n>1?'s':''}${paidPart}${(it.excluded||[]).length?` · ${(it.excluded).map(nameOf).join(', ')} excluded`:''}` : null;
  };

  return (
    <div style={{background:'var(--color-surface)',borderRadius:12,padding:'16px 18px',border:'1px solid var(--color-border)',marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:12}}>
        <p style={{fontSize:'.75rem',color:'var(--color-ink-muted)',letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600}}>💰 Budget</p>

              <span style={{width:'100%',fontSize:'.7rem',color:'var(--color-ink-muted)'}}>Tap to exclude someone from this expense's split (e.g. a child). Default splits evenly among everyone checked.</span>
            </div>

      {/* Balances + settle up */}
      {members.length>=2 && items.length>0 && (
        <div style={{marginTop:16,paddingTop:14,borderTop:'1px solid var(--color-border)'}}>
          <p style={{fontSize:'.72rem',color:'var(--color-ink-muted)',letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,marginBottom:10}}>Who owes what</p>
          {members.map(m=>{
            const v=bal[m.id]||0; const owed=v>0.004, owes=v<-0.004;
            return (
              <div key={m.id} style={{display:'flex',alignItems:'center',gap:8,padding:'4px 0'}}>
                <span style={{width:22,height:22,borderRadius:'50%',background:m.avatarColor,color:'#0E1117',display:'inline-flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'.68rem',flexShrink:0}}>{(m.name||'?').charAt(0).toUpperCase()}</span>
                <span style={{flex:1,minWidth:0,fontSize:'.85rem',color:'var(--color-ink)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.name}</span>
                <span style={{fontFamily:'var(--font-mono)',fontSize:'.82rem',fontWeight:600,color: owed?'var(--color-success)':owes?'var(--color-flag)':'var(--color-ink-muted)'}}>

          {settlements.length>0 ? (
            <div style={{marginTop:12}}>
              <p style={{fontSize:'.72rem',color:'var(--color-ink-muted)',letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,marginBottom:8}}>Settle up</p>
              {settlements.map((s,idx)=>{
                return (
                  <div key={idx} style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',padding:'7px 0',borderTop:idx?'1px solid var(--color-border)':'none'}}>
                    <span style={{flex:'1 1 auto',fontSize:'.85rem',color:'var(--color-ink)'}}>
                      <strong>{nameOf(s.from)}</strong> → <strong>{nameOf(s.to)}</strong> <span style={{fontFamily:'var(--font-mono)',color:'var(--color-flag)'}}>{fmt(s.amount)}</span>
                    </span>
                    {isOwner && <button className="btn btn-ghost btn-sm" onClick={()=>recordPayment(s.from,s.to,s.amount)}>Mark paid</button>}
                  </div>
                );
              })}
            </div>
          ) : (
            <p style={{marginTop:10,fontSize:'.82rem',color:'var(--color-success)'}}>✓ All settled up.</p>
          )}
          {payments.length>0 && (
            <details style={{marginTop:12}}>
              <summary style={{cursor:'pointer',fontSize:'.75rem',color:'var(--color-ink-muted)'}}>Recorded payments ({payments.length})</summary>
              <div style={{marginTop:6}}>
                {payments.map(p=>(
                  <div key={p.id} style={{display:'flex',alignItems:'center',gap:8,fontSize:'.8rem',padding:'4px 0'}}>
                    <span style={{flex:1}}>{nameOf(p.from)} paid {nameOf(p.to)} <span style={{fontFamily:'var(--font-mono)'}}>{fmt(p.amount)}</span></span>
                    {isOwner && <button className="btn btn-ghost btn-sm" style={{color:'var(--color-flag)'}} onClick={()=>undoPayment(p.id)}>Undo</button>}
                  </div>
                ))}
              </div>
            </details>
          )}
        </div>
      )}
      {members.length<2 && items.length>0 && (
        <p style={{marginTop:12,fontSize:'.8rem',color:'var(--color-ink-light)'}}>Add 2+ people on the <strong>Crew</strong> tab to split costs and settle up.</p>
      )}
    </div>
  );
}

function TripDateEditor({trip, onUpdateTrip}) {
  const [editing, setEditing] = React.useState(false);
  const [startDate, setStartDate] = React.useState(trip.startDate || '');
  const [endDate, setEndDate] = React.useState(trip.endDate || '');
  const [error, setError] = React.useState('');

  const [stops, setStops] = React.useState((trip.destinations||[]).map(d=>({id:d.id, city:d.city, arrivalDate:d.arrivalDate||'', departureDate:d.departureDate||''})));

  // Reset local state if trip prop changes
  React.useEffect(() => {
    setStartDate(trip.startDate || '');
    setEndDate(trip.endDate || '');
    setStops((trip.destinations||[]).map(d=>({id:d.id, city:d.city, arrivalDate:d.arrivalDate||'', departureDate:d.departureDate||''})));
  }, [trip.startDate, trip.endDate, trip.destinations]);

  const nightCount = trip.startDate && trip.endDate
    ? Math.round((new Date(trip.endDate) - new Date(trip.startDate)) / 86400000)
    : null;

  const save = () => {
    setError('');
    if (!startDate) { setError('Start date is required.'); return; }
    if (!endDate)   { setError('End date is required.'); return; }
    if (endDate < startDate) { setError('End date must be after start date.'); return; }

    // Reconcile days array with new date range
    const allDates = [];
    const cur = new Date(startDate + 'T12:00:00');
    const end = new Date(endDate + 'T12:00:00');
    while (cur <= end) {
      allDates.push(cur.toISOString().slice(0, 10));
      cur.setDate(cur.getDate() + 1);
    }

    // Moving a trip used to be blocked outright: the stops still held the OLD dates,
    // which now sat outside the new range, so you had to hand-edit every stop before
    // the trip itself would budge. Shift the stops by the same delta instead, then
    // clamp anything that still falls outside (e.g. the trip got shorter).
    const shiftDays = (trip.startDate && startDate) ? Math.round((new Date(startDate+'T12:00:00') - new Date(trip.startDate+'T12:00:00'))/86400000) : 0;
    const shift=(d)=>{ if(!d) return d; const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()+shiftDays); return x.toISOString().slice(0,10); };
    const clamp=(d)=> !d ? d : (d<startDate ? startDate : (d>endDate ? endDate : d));
    const adjusted = stops.map(s=>{
      let a=clamp(shiftDays?shift(s.arrivalDate):s.arrivalDate);
      let dep=clamp(shiftDays?shift(s.departureDate):s.departureDate);
      if(a && dep && dep<a) dep=a; // a shortened trip can invert a stop; keep it coherent
      return {...s, arrivalDate:a, departureDate:dep};
    });
    // Only a genuinely contradictory stop the user typed by hand should block a save.
    for(const s of adjusted){
      if(s.arrivalDate && s.departureDate && s.departureDate < s.arrivalDate){ setError(`${s.city||'A stop'}: departure can't be before arrival.`); return; }
    }
    const nextDestinations = (trip.destinations||[]).map(d=>{ const s=adjusted.find(x=>x.id===d.id); return s?{...d, arrivalDate:s.arrivalDate, departureDate:s.departureDate}:d; });

    // Shift the itinerary with the trip. Without this, moving a trip even one day
    // meant no existing day matched the new range and every activity, restaurant and
    // note was silently dropped.
    const existingDays = (trip.days || []).map(d => shiftDays && d.date ? {...d, date: shift(d.date)} : d);
    // Keep existing days that fall within new range (preserving their content)
    const kept = existingDays.filter(d => allDates.includes(d.date));
    // Only reconcile stubs if the itinerary has real content; otherwise leave days
    // empty so the AI generator stays available (UAT 2026-07-15: blank days locked out the planner)
    const hasContent = existingDays.some(d=>(d.activities||[]).length||(d.restaurants||[]).length||(d.notes||'').trim());
    const newDays = hasContent ? allDates.map(date => {
      const existing = kept.find(d => d.date === date);
      if (existing) return existing;
      return { id: uuid(), date, label: `Day ${allDates.indexOf(date) + 1}`, activities: [], restaurants: [], notes: '', destinationId: trip.destinations?.[0]?.id || '' };
    }) : [];

    // A dated trip is no longer "just an idea" · unlock the itinerary planner (UAT 2026-07-15)
    // P1: crew who loved a pin get suggested as Going on their row (never forced).
    const wasIdea = trip.planningStage==='idea';
    const carry = wasIdea ? applyPinReactionCarryover(trip) : null;
    onUpdateTrip({ ...trip, startDate, endDate, destinations: nextDestinations, days: newDays, planningStage: 'booked',
      ...(carry ? { collaborators: carry.collaborators } : {}) });
    if(carry && carry.suggested>0) showToast(`${carry.suggested} ${carry.suggested===1?'person':'people'} loved your pins · suggested as Going in Crew.`,'info',5000);
    setEditing(false);
  };

  const cancel = () => {
    setStartDate(trip.startDate || '');
    setEndDate(trip.endDate || '');
    setError('');
    setEditing(false);
  };

  return (
    <div style={{background:'var(--color-surface)',borderRadius:12,padding:16,border:'1px solid var(--color-border)',marginBottom:20}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:editing?14:0}}>
        <div>
          <p style={{fontSize:'.75rem',color:'var(--color-ink-muted)',letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,marginBottom:2}}>Trip Dates</p>
          {!editing && (
            <p style={{fontSize:'.95rem',fontWeight:500,color:'var(--color-ink)'}}>
              {formatDate(trip.startDate)} – {formatDate(trip.endDate)}
              {nightCount !== null && <span style={{color:'var(--color-ink-light)',fontWeight:400,fontSize:'.85rem'}}> · {nightCount} night{nightCount!==1?'s':''}</span>}
            </p>
          )}
        </div>
        {!editing && (
          <button onClick={()=>setEditing(true)} style={{background:'var(--color-cream-dark)',border:'none',borderRadius:20,padding:'5px 14px',fontSize:'.78rem',fontWeight:500,color:'var(--color-ink-light)',cursor:'pointer'}}>
            Edit dates
          </button>
        )}
      </div>

      {editing && (
        <>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:10}}>
            <div>
              <label className="section-label" style={{display:'block',marginBottom:4}}>Start Date</label>
              <input className="input" type="date" value={startDate}
                onChange={e => {
                  const v = e.target.value;
                  setStartDate(v);
                  if (v && endDate && endDate < v) setEndDate('');
                }}/>
            </div>
            <div>
              <label className="section-label" style={{display:'block',marginBottom:4}}>End Date</label>
              <input className="input" type="date" value={endDate}
                min={startDate || undefined}
                onChange={e => setEndDate(e.target.value)}/>
            </div>
          </div>

          {startDate && endDate && endDate >= startDate && (
            <div style={{background:'var(--color-cream-dark)',borderRadius:8,padding:'8px 12px',marginBottom:10,fontSize:'.8rem',color:'var(--color-ink-light)'}}>
              {(() => {
                const n = Math.round((new Date(endDate) - new Date(startDate)) / 86400000);
                const existing = (trip.days||[]).length;
                const msg = existing > 0
                  ? n > existing
                    ? `${n - existing} new day${n-existing!==1?'s':''} will be added to your itinerary.`
                    : n < existing
                    ? `${existing - n} day${existing-n!==1?'s':''} will be removed from your itinerary.`
                    : 'Same number of days · no itinerary changes needed.'
                  : `${n + 1} days total.`;
                return `📅 ${n} night${n!==1?'s':''} · ${msg}`;
              })()}
            </div>
          )}

          {stops.length>1 && (
            <div style={{marginBottom:10}}>
              <p className="section-label" style={{marginBottom:6}}>Dates per stop</p>
              {stops.map((s,i)=>(
                <div key={s.id} style={{display:'grid',gridTemplateColumns:'minmax(70px,1fr) 1fr 1fr',gap:8,alignItems:'center',marginBottom:6}}>
                  <span style={{fontSize:'.82rem',fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.city||('Stop '+(i+1))}</span>
                  <input className="input" type="date" aria-label={`${s.city} arrival`} value={s.arrivalDate} min={startDate||undefined} max={endDate||undefined}
                    onChange={e=>{const v=e.target.value; setStops(prev=>prev.map(x=>x.id===s.id?{...x,arrivalDate:v}:x));}}/>
                  <input className="input" type="date" aria-label={`${s.city} departure`} value={s.departureDate} min={s.arrivalDate||startDate||undefined} max={endDate||undefined}
                    onChange={e=>{const v=e.target.value; setStops(prev=>prev.map(x=>x.id===s.id?{...x,departureDate:v}:x));}}/>
                </div>
              ))}
              <p style={{fontSize:'.7rem',color:'var(--color-ink-muted)'}}>Arrival → departure for each city. The AI planner uses these to put each day in the right place.</p>
            </div>
          )}

          {error && <p style={{color:'var(--color-flag)',fontSize:'.78rem',marginBottom:8}}>{error}</p>}

          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-secondary" style={{flex:1,padding:'9px'}} onClick={cancel}>Cancel</button>
            <button className="btn btn-primary" style={{flex:2,padding:'9px'}} onClick={save}>Save dates</button>
          </div>
        </>
      )}
    </div>
  );
}

function TripDetail({trip, onBack, onUpdateTrip, onDelete, onOpenDrawer}) {
  const [activeTab, setActiveTab] = React.useState('overview');
  // Shared trips: everything below that writes the trip document is owner-only
  // (RLS enforces it server-side; this gates the UI so members don't see
  // controls that would silently fail). Crew can still RSVP + add day notes.
  const isOwner = trip._myRole==='owner' || !trip._myRole;
  const [activeDay, setActiveDay] = React.useState(trip.days?.[0]?.id || null);
  const [showShare, setShowShare] = React.useState(false);
  const [regenPrompt, setRegenPrompt] = React.useState('');
  const [showRegenModal, setShowRegenModal] = React.useState(false);
  const [regenUploading, setRegenUploading] = React.useState(false);
  const [regenUploadMsg, setRegenUploadMsg] = React.useState('');
  // Dismissible entry banners: cleared per trip, owner only; auto-collapse (checklist) still applies
  const dismissedReqs = trip.dismissedEntryReqs || [];
  const dismissReq = (key)=> onUpdateTrip({...trip, dismissedEntryReqs:[...dismissedReqs, key]});
  // Live visa/entry data (Travel Buddy) · supersedes the rules-based flags below
  const [liveReqs,setLiveReqs] = React.useState([]);
  const flags = visibleEntryFlags(trip, liveReqs, dismissedReqs);
  React.useEffect(()=>{
    let on=true;
    const passport = trip.travelerPassportCountry || 'US';
    const codes = [...new Set((trip.destinations||[])
      .filter(d=>d.isInternational||(d.countryCode&&d.countryCode!=='US'))
      .map(d=>d.countryCode).filter(Boolean))].filter(cc=>cc!==passport).slice(0,6);
    if(!codes.length){ setLiveReqs([]); return; }
    Promise.all(codes.map(cc=>fetchEntryReq(passport,cc).then(req=>({cc,req})))).then(rs=>{ if(on) setLiveReqs(rs.filter(r=>r.req&&(r.req.visa_rules||r.req.mandatory_registration))); });
    return ()=>{ on=false; };
  },[trip.id]);
  const {label:countdown} = getCountdownInfo(trip.startDate);
  const firstDest = trip.destinations?.[0];
  const gradKey = firstDest?.countryCode==='GB'?'london':firstDest?.countryCode==='FR'?'paris':firstDest?.city?.toLowerCase().includes('miami')?'miami':'generic';
  const headerGrad = trip.coverGradient || `gradient-${gradKey}`;

  const TABS = [
    // IA Phase 1 (2026-07-15, per PRODUCT-ARCHITECTURE + DECISIONS): 7 tabs → 5.
    // Pre-Trip + Packing merged into "Get Ready" (one question: am I prepared?);
    // City Tips live inside each day's view (day-level info, not a destination).
    {id:'overview',label:'Overview',icon:''},
    {id:'days',label:'Days',icon:''},
    {id:'crew',label:'Crew',icon:''},
    {id:'getready',label:'Get Ready',icon:''},
    {id:'budget',label:'Budget',icon:''},
  ];
  if(isOwner && ['bachelorette','birthday','anniversary','honeymoon','celebration'].includes(trip.occasion)) TABS.push({id:'celebrate',label:'Celebrate',icon:''}); // surprise logistics stay owner-only

  const handleChecklistUpdate = (updatedChecklist) => {
    const updatedTrip = {...trip, checklist: updatedChecklist};
    onUpdateTrip(updatedTrip);
  };

  return (
    <div style={{minHeight:'100dvh',background:'var(--color-cream)'}}>
      {/* Header */}
      <div className={`trip-header ${headerGrad}`} style={{position:'relative',overflow:'hidden'}}>
        {['bachelorette','birthday','celebration'].includes(trip.occasion) && (
          <div className="celebration-band">
            {Array(20).fill(null).map((_,i)=><span key={i} style={{animationDelay:`${i*.15}s`}}>{['✨','🎉','🥂','💫','🎊'][i%5]}</span>)}
          </div>
        )}
        <div style={{position:'relative',zIndex:1,padding:'52px 16px 20px',maxWidth:720,margin:'0 auto'}}>
          {/* Top bar: Back + action buttons */}
          {(()=>{
            const iconBtn=(danger)=>({width:44,height:44,display:'flex',alignItems:'center',justifyContent:'center',background:danger?'rgba(255,80,80,.28)':'rgba(255,255,255,.18)',border:'none',borderRadius:12,color:'#fff',fontSize:'1.15rem',cursor:'pointer',backdropFilter:'blur(4px)',flexShrink:0});
            const doShare=async ()=>{
              track('share_link');
              const url = await makeTripShareUrl(trip);
              if(!url){alert('Could not encode trip.');return;}
              if(navigator.share){
                navigator.share({title: trip.title, text: `${trip.title} · planned with Locale`, url}).then(()=>showToast('Trip link shared ✓','info',3000)).catch(()=>{});
              } else {
                navigator.clipboard.writeText(url).then(()=>showToast('Link copied. Recipients can view but not edit.','info',4000)).catch(()=>{ prompt('Copy this read-only snapshot link:', url); });
              }
            };
            return (
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:14}}>
            <div style={{display:'flex',gap:8}}>
              {onOpenDrawer && <button onClick={onOpenDrawer} aria-label="Your trips" title="Your trips" style={{display:'flex',alignItems:'center',justifyContent:'center',height:44,width:44,background:'rgba(255,255,255,.18)',border:'none',borderRadius:12,color:'#fff',fontSize:'1.05rem',cursor:'pointer',backdropFilter:'blur(4px)'}}>☰</button>}
              <button onClick={onBack} aria-label="Back to all trips" style={{display:'flex',alignItems:'center',gap:6,height:44,background:'rgba(255,255,255,.18)',border:'none',borderRadius:12,padding:'0 16px',color:'#fff',fontSize:'.9rem',fontWeight:500,cursor:'pointer',backdropFilter:'blur(4px)'}}>← Back</button>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <button onClick={doShare} aria-label="Share trip" title="Share trip" style={iconBtn(false)}>🔗</button>
              <button onClick={()=>generateTripPDF(trip)} aria-label="Download trip as PDF" title="Download PDF" style={iconBtn(false)}>⬇️</button>
              {isOwner && <button aria-label="Delete trip" title="Delete trip" onClick={()=>{ if(window.confirm(`Delete "${trip.title}"? This can't be undone.`)) onDelete(trip.id); }} style={iconBtn(true)}>🗑️</button>}
            </div>
          </div>
            );
          })()}
          {/* Title + meta */}
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
            <span style={{fontSize:'2rem',lineHeight:1}}>{(()=>{const m=(trip.title||'').match(/^\p{Emoji}/u);return m?m[0]:(trip.emoji||'✈️');})()}</span>
            <div style={{flex:1,minWidth:0}}>
              <h1 style={{fontFamily:'var(--font-display)',fontSize:'clamp(1.4rem,5vw,2rem)',fontWeight:700,color:'#fff',lineHeight:1.15,marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{(trip.title||'').replace(/^\p{Emoji}\s*/u,'')}</h1>
              {/* Wraps instead of truncating · on a phone this used to cut off mid-word
                  ("TOMORROW! FIN…"), hiding the countdown exactly when it matters most. */}
              <p style={{color:'rgba(255,255,255,.85)',fontFamily:'var(--font-mono)',fontSize:'.7rem',letterSpacing:'.05em',textTransform:'uppercase',lineHeight:1.45}}>{formatDate(trip.startDate)} – {formatDate(trip.endDate)}{countdown?(' · '+countdown):''}</p>

                      </div>

                    {reg && !dupReg && !dismissedReqs.includes(cc+':reg') && (
                      <div style={{background:'rgba(0,0,0,.35)',borderRadius:10,padding:'6px 12px',backdropFilter:'blur(4px)',display:'flex',alignItems:'flex-start',gap:8}}>
                        <span style={{color:'#fff',fontSize:'.8rem'}}>🚨 <strong>{dn}: {reg.name} required</strong>{reg.link&&<> · <a href={reg.link} target="_blank" rel="noopener noreferrer" style={{color:'#fff',textDecoration:'underline'}}>register</a></>}</span>
                        {isOwner && <button onClick={()=>dismissReq(cc+':reg')} aria-label={`Dismiss ${dn} registration`} title="Dismiss" style={{background:'none',border:'none',color:'rgba(255,255,255,.55)',cursor:'pointer',fontSize:'.8rem',padding:'0 2px',flexShrink:0,lineHeight:1.4}}>✕</button>}
                      </div>
                    )}

                  {key:'forest',label:'Forest',color:'#3A5C48'},
                  {key:'sunset',label:'Rust',color:'#7A5240'},
                  {key:'desert',label:'Desert',color:'#7A6840'},
                  {key:'lavender',label:'Violet',color:'#5A4A78'},
                  {key:'rose',label:'Rose',color:'#7A4A58'},
                  {key:'slate',label:'Slate',color:'#3D4D5C'},

                })}

            </details>}
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:10,marginBottom:12}}>
              {trip.destinations.map(d=>(
                <div key={d.id} style={{background:'var(--color-surface)',borderRadius:12,padding:'14px 12px',border:'1px solid var(--color-border)',textAlign:'center'}}>
                  <div style={{fontSize:'1.5rem',marginBottom:4}}>{getCountryFlag(d.countryCode)}</div>
                  <div style={{fontFamily:'var(--font-display)',fontSize:'1rem',fontWeight:600}}>{d.city}</div>

                </div>
              ))}
            </div>
            {(trip.days||[]).some(d=>(d.activities||[]).length||(d.restaurants||[]).length) && <AtAGlance trip={trip} onStartPlanning={()=>setActiveTab('days')} onOpenDays={()=>{setActiveTab('days');track('tab_view',{tab:'days',via:'glance'});window.scrollTo({top:0});}}/>}
            <CurrencyConverter destinations={trip.destinations}/>
          </div>
        )}
        {activeTab==='days' && (
          <div>
            {showRegenModal && (
              <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.5)',zIndex:9000,display:'flex',alignItems:'flex-end',justifyContent:'center',backdropFilter:'blur(4px)'}}>
                <div style={{background:'var(--color-surface)',borderRadius:'20px 20px 0 0',padding:'28px 24px 40px',width:'100%',maxWidth:480}}>
                  <div style={{width:40,height:4,background:'var(--color-border)',borderRadius:2,margin:'0 auto 20px'}}/>

                    className="input"
                    rows={5}
                    placeholder={`e.g. "On Saturday the guys do the ASU vs Kansas State game at Wembley while the women + toddler do a park + museum. Monday we check out of London and take the Eurostar to Paris · add a reminder to book the train tickets. Swap Knott's for a beach day in Laguna."`}
                    value={regenPrompt}
                    onChange={e=>setRegenPrompt(e.target.value)}
                    style={{marginBottom:12,resize:'vertical',minHeight:120,lineHeight:1.55}}
                  />
                  <label style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'10px',border:'1px dashed var(--color-border)',borderRadius:10,cursor:regenUploading?'default':'pointer',marginBottom:10,color:'var(--color-ink-light)',fontSize:'.85rem',textAlign:'center'}}>
                    {regenUploading ? 'Reading your confirmations…' : '📎 Attach flight/hotel confirmations (optional · multiple OK)'}
                    <input type="file" accept="image/*,application/pdf" multiple style={{display:'none'}} disabled={regenUploading}
                      onChange={async e=>{ const files=Array.from(e.target.files||[]); e.target.value=''; if(!files.length) return;
                        setRegenUploading(true); setRegenUploadMsg('');
                        let cur = trip; const saved=[]; let failed=0;
                        for(const f of files){
                          try{
                            const parsed = await parseConfirmationFile(f);
                            const {trip:updated, kind, label} = mergeBookingIntoTrip(cur, parsed);
                            if(kind){ cur = updated; saved.push((kind==='lodging'?'lodging':'flight')+(label?(' · '+label):'')); }
                            else failed++;
                          }catch(err){ failed++; }
                        }
                        if(saved.length) onUpdateTrip(cur);
                        setRegenUploadMsg(saved.length ? ('Saved '+saved.length+': '+saved.join('; ')+' ✓ · regenerate to plan around them.'+(failed?(' ('+failed+" couldn't be read)"):'')) : "Couldn't read those · try clearer flight/hotel confirmations.");
                        setRegenUploading(false);
                      }}/>
                  </label>
                  {regenUploadMsg && <p style={{fontSize:'.78rem',color:regenUploadMsg.startsWith('Saved')?'var(--color-success)':'var(--color-flag)',marginBottom:12,lineHeight:1.4}}>{regenUploadMsg}</p>}
                  <div style={{display:'flex',gap:8}}>
                    <button className="btn btn-secondary" style={{flex:1}} onClick={()=>{ setShowRegenModal(false); setRegenUploadMsg(''); }}>Cancel</button>
                    <button className="btn btn-primary" style={{flex:2}} onClick={()=>{ setShowRegenModal(false); onUpdateTrip({...trip,days:[],_regenPrompt:regenPrompt}); setRegenPrompt(''); }}>Regenerate</button>
                  </div>
                </div>
              </div>
            )}
            {(trip.days||[]).length > 0 ? (
              <>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:20,alignItems:'center'}}>
                  {(trip.days||[]).map(day=>(
                    <button key={day.id} onClick={()=>setActiveDay(day.id)} className={`pill ${activeDay===day.id?'pill-accent':'pill-muted'}`} style={{cursor:'pointer'}}>{formatDateShort(day.date)}</button>
                  ))}
                  {isOwner && <button
                    onClick={()=>setShowRegenModal(true)}
                    style={{marginLeft:'auto',background:'none',border:'1px solid var(--color-border)',borderRadius:20,padding:'4px 12px',fontSize:'.75rem',color:'var(--color-ink-muted)',cursor:'pointer'}}
                  >Update itinerary</button>}
                </div>
                {isOwner && (trip.days||[]).every(d=>!(d.activities||[]).length&&!(d.restaurants||[]).length) && (
                  <div className="card" style={{padding:18,marginBottom:16,textAlign:'center',borderStyle:'dashed',borderColor:'var(--color-accent-warm)'}}>
                    <p style={{fontSize:'.88rem',color:'var(--color-ink-light)',marginBottom:10}}>These days are empty so far.</p>
                    <button className="btn btn-primary" onClick={()=>{ setActiveDay(null); onUpdateTrip({...trip, days:[]}); }}>✨ Plan these days with AI</button>
                  </div>
                )}
                {activeDay && <DayView key={activeDay} trip={trip} day={(trip.days||[]).find(d=>d.id===activeDay)} onUpdateTrip={onUpdateTrip}/>}
              </>
            ) : isOwner ? (
              <ItineraryAIPlanner trip={trip} onUpdateTrip={(updated)=>{ onUpdateTrip({...updated,_regenPrompt:undefined}); setActiveDay(updated.days?.[0]?.id||null); }}/>
            ) : (
              <div className="card" style={{padding:'28px 20px',textAlign:'center',color:'var(--color-ink-light)',fontSize:'.9rem'}}>🗓 The trip owner hasn't built the day-by-day plan yet · check back soon.</div>
            )}
          </div>
        )}
        {activeTab==='getready' && <GetReadyView trip={trip} onUpdate={handleChecklistUpdate} onUpdateTrip={onUpdateTrip}/>}
        {activeTab==='crew' && <CrewSection trip={trip} onUpdateTrip={onUpdateTrip}/>}
        {activeTab==='budget' && <div style={{padding:'0 0 8px'}}><BudgetSection trip={trip} onUpdateTrip={onUpdateTrip}/></div>}
        {activeTab==='celebrate' && <CelebrationSection trip={trip} onUpdateTrip={onUpdateTrip}/>}
      </div>

      {/* IA Phase 2a: Instagram-style bottom tab bar on phones */}
      <div className="bottomnav-spacer" aria-hidden="true"></div>
      <nav className="bottom-nav" aria-label="Trip sections">
        {TABS.map(t=>{
          const short={overview:'Overview',days:'Days',crew:'Crew',getready:'Ready',budget:'Budget',celebrate:'Party'}[t.id]||t.label;
          return (
            <button key={t.id} className={`bn-item${activeTab===t.id?' active':''}`} onClick={()=>{setActiveTab(t.id);track('tab_view',{tab:t.id});window.scrollTo({top:0});}} aria-label={t.label}>
              <span className="bn-ico" aria-hidden="true"><BnIcon id={t.id}/></span>{short}
            </button>
          );
        })}
      </nav>
      {showShare && <ShareSheet trip={trip} onClose={()=>setShowShare(false)}/>}
    </div>
  );
}

// Luxe pass: clean line icons for the bottom tab bar (emoji read as clutter on iOS)
function BnIcon({id}){
  const P={
    overview:<path d="M3 10.5 12 3l9 7.5M5.5 8.8V21h4.8v-5.6h3.4V21h4.8V8.8"/>,
    days:<><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></>,
    crew:<><circle cx="8.5" cy="8.5" r="3.2"/><path d="M2.5 20c.6-3.4 3-5.3 6-5.3s5.4 1.9 6 5.3"/><circle cx="16.8" cy="9.8" r="2.6"/><path d="M15.6 14.9c2.9.2 5.1 1.9 5.9 5.1"/></>,
    getready:<><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.2"/></>,
    budget:<><rect x="3" y="6.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15.5h4"/></>,
    celebrate:<path d="M12 3.5l1.8 4.9 4.9 1.8-4.9 1.8L12 16.9l-1.8-4.9-4.9-1.8 4.9-1.8L12 3.5zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/>,
  }[id]||<circle cx="12" cy="12" r="8.5"/>;
  return <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" style={{display:'block',margin:'0 auto'}}>{P}</svg>;
}

// ── IA Phase 2a: trips drawer · Planned → Ideas → Past (global level) ─────────
function TripsDrawer({trips, activeId, onClose, onSelect, onNew, onAll}){
  const today=new Date().toISOString().slice(0,10);
  const ideas=(trips||[]).filter(t=>t.planningStage==='idea');
  const past=(trips||[]).filter(t=>t.planningStage!=='idea' && t.endDate && t.endDate<today);
  const planned=(trips||[]).filter(t=>!ideas.includes(t)&&!past.includes(t));
  const meta=(t)=> t.planningStage==='idea' ? 'idea' : (t.endDate&&t.endDate<today ? formatDateShort(t.endDate) : (t.startDate?formatDateShort(t.startDate):'new'));
  const Item=({t})=>(
    <button className={`drawer-item${t.id===activeId?' active':''}`} onClick={()=>onSelect(t.id)}>
      <span aria-hidden="true">{t.emoji||'✈️'}</span>
      <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{(t.title||'Untitled trip').replace(/^\p{Extended_Pictographic}\s*/u,'')}</span>
      <span className="di-meta">{meta(t)}</span>
    </button>
  );
  return (
    <div className="drawer-overlay" role="dialog" aria-modal="true" aria-label="Your trips" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="trips-drawer">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'2px 8px 12px'}}>
          <span className="font-display" style={{fontWeight:700,fontSize:'1.15rem'}}>Loc<span style={{color:'var(--color-accent)'}}>a</span>le</span>
          <button className="btn btn-ghost btn-sm" onClick={onClose} aria-label="Close">✕</button>
        </div>
        {planned.length>0 && <p className="section-label" style={{margin:'8px 8px 4px'}}>Planned</p>}
        {planned.map(t=><Item key={t.id} t={t}/>)}
        {ideas.length>0 && <p className="section-label" style={{margin:'14px 8px 4px'}}>Ideas</p>}
        {ideas.map(t=><Item key={t.id} t={t}/>)}
        {past.length>0 && <p className="section-label" style={{margin:'14px 8px 4px'}}>Past</p>}
        {past.map(t=><Item key={t.id} t={t}/>)}
        <button className="drawer-item" onClick={onNew} style={{marginTop:6}}><span aria-hidden="true">＋</span><span>New trip</span></button>
        <div style={{flex:1}}></div>
        <div style={{borderTop:'1px solid var(--color-border)',margin:'10px 4px'}}></div>
        <button className="drawer-item" onClick={onAll}><span aria-hidden="true">🏠</span><span>All trips</span></button>
      </div>
    </div>
  );
}

function SyncButton({user, onChange}){
  const [open,setOpen]=React.useState(false);
  const [email,setEmail]=React.useState('');
  const [sent,setSent]=React.useState(false);
  const [busy,setBusy]=React.useState(false);
  const [code,setCode]=React.useState(''); // P0b · 6-digit sign-in code
  const dlgRef=React.useRef(null);
  useModalA11y(dlgRef, ()=>setOpen(false), open);
  // Verify the typed code. onAuthStateChange drives the actual sync, so on success
  // we just close and let syncIn() take over.
  const verify=async()=>{
    setBusy(true);
    try{
      await cloudVerifyCode(email.trim(), code);
      track('sync_signin_verified');
      setOpen(false); setSent(false); setCode('');
      showToast('Signed in · syncing your trips ✓','info',4000);
    }catch(err){
      showToast((err&&err.message)||'That code did not work · try again.','error',5000);
    }finally{ setBusy(false); }
  };
  if(user){
    return (
      <button className="btn btn-ghost btn-sm" title={user.email}
        onClick={async()=>{ if(window.confirm('Sign out of sync on this device? Your trips stay saved here.')){ await cloudSignOut(); onChange && onChange(null); showToast('Signed out of sync.','info'); } }}>
        ☁ Synced
      </button>
    );
  }
  return (
    <span style={{display:'contents'}}>
      <button className="btn btn-ghost btn-sm" onClick={()=>{ setOpen(true); setSent(false); }}>☁ Sync</button>
      {open && (
        <div className="overlay" ref={dlgRef} role="dialog" aria-modal="true" aria-label="Sync across devices" onClick={e=>{ if(e.target===e.currentTarget) setOpen(false); }}>
          <div className="sheet" style={{maxWidth:420}}>
            <div className="sheet-handle"></div>
            {!sent ? (
              <span style={{display:'contents'}}>
                <h2 style={{fontFamily:'var(--font-display)',fontSize:'1.5rem',marginBottom:6}}>Sync across devices</h2>
                <p style={{color:'var(--color-ink-light)',fontSize:'.9rem',marginBottom:16,lineHeight:1.5}}>Enter your email and we'll send a 6-digit sign-in code · no password. Works on any device, and can't be broken by email security scanners.</p>

const SHARE_LINK_URL = SUPABASE_URL + '/functions/v1/share-link';
// Short branded share links: store the encoded snapshot server-side, share #s=<id>.
// Any failure falls back to the long-but-working #trip= URL.
async function makeTripShareUrl(trip){
  const enc=encodeTrip(trip);
  if(!enc) return null;
  const longUrl=window.location.origin+window.location.pathname+'#trip='+enc;
  try{
    const res=await fetch(SHARE_LINK_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},body:JSON.stringify({payload:enc})});
    if(!res.ok) return longUrl;
    const {id}=await res.json();
    return (id && /^[a-z0-9]{6,12}$/.test(id)) ? window.location.origin+window.location.pathname+'#s='+id : longUrl;
  }catch(e){ return longUrl; }
}
async function resolveShortShareLink(){
  const m=window.location.hash.match(/[#&]s=([a-z0-9]{6,12})/);
  if(!m) return null;
  try{
    const res=await fetch(SHARE_LINK_URL+'?id='+m[1],{headers:{'apikey':SUPABASE_ANON_KEY}});
    if(!res.ok) return null;
    const {payload}=await res.json();
    return payload?decodeTrip(payload):null;
  }catch(e){ return null; }
}
function encodeTrip(trip) {
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(trip)))); } catch(e) { return null; }
}
function decodeTrip(str) {
  try { return JSON.parse(decodeURIComponent(escape(atob(str)))); } catch(e) { return null; }
}
function getSharedTripFromHash() {
  const hash = window.location.hash;
  const m = hash.match(/[#&]trip=([A-Za-z0-9+/=]+)/);
  return m ? decodeTrip(m[1]) : null;
}
