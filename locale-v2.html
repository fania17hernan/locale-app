        </button>
        {open && (
          <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--color-border)'}}>
            {item.neighborhood&&<p style={{fontSize:'.8rem',color:'var(--color-ink-light)',marginBottom:4}}>📍 {item.neighborhood}</p>}
            {item.address&&<p style={{fontSize:'.8rem',color:'var(--color-ink-light)',marginBottom:4}}>{item.address}</p>}
            {item.notes&&<p style={{fontSize:'.85rem',lineHeight:1.55,margin:'6px 0'}}>{item.notes}</p>}
            {comments.map(c=>(
              <div key={c.id} style={{display:'flex',gap:8,alignItems:'flex-start',margin:'8px 0'}}>
                <Avatar22 initial={(c.author||'?').charAt(0).toUpperCase()} color={c.color||AVATAR_COLORS[0]}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:'.78rem'}}><strong>{c.author}</strong> <span style={{color:'var(--color-ink-muted)'}}>{c.ts?'· '+relativeAgo(c.ts):''}</span></div>
                  <div style={{fontSize:'.85rem',color:'var(--color-ink-light)'}}>{c.text}</div>
                </div>
                {onDeleteComment&&<button aria-label="Delete note" onClick={()=>onDeleteComment(item,c.id)} className="btn btn-ghost btn-sm" style={{color:'var(--color-flag)',padding:'0 6px'}}>✕</button>}
              </div>
            ))}
            <div style={{display:'flex',gap:6,marginTop:8}}>
              <input className="input" style={{flex:1}} placeholder="Add a note…" value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')post();}}/>
              <button className="btn btn-secondary btn-sm" disabled={!draft.trim()} onClick={post}>Post</button>
            </div>
            <div style={{display:'flex',gap:8,marginTop:12,flexWrap:'wrap'}}>
              <a href={mapsUrl} target="_blank" rel="noopener noreferrer" className="btn btn-secondary btn-sm">🗺️ Maps</a>
              {(item.bookingUrl||item.reservationUrl)&&<a href={item.bookingUrl||item.reservationUrl} target="_blank" rel="noopener noreferrer" className="btn btn-primary btn-sm">Book →</a>}
              {onEdit&&<button className="btn btn-ghost btn-sm" onClick={()=>onEdit(item)}>✏️ Edit</button>}
              {onDelete&&<button className="btn btn-ghost btn-sm" aria-label="Remove item" style={{color:'var(--color-flag)'}} onClick={()=>{if(window.confirm('Remove this item?'))onDelete(item.id);}}>🗑</button>}
            </div>
          </div>
        )}
       </div>
       {showReorder && (
         <div style={{display:'flex',flexDirection:'column',gap:4,flexShrink:0}} role="group" aria-label="Reorder stop">
           <button type="button" aria-label={`Move ${item.name} earlier`} disabled={!canMoveUp} onClick={onMoveUp} style={reorderBtn(canMoveUp)}>▲</button>
           <button type="button" aria-label={`Move ${item.name} later`} disabled={!canMoveDown} onClick={onMoveDown} style={reorderBtn(canMoveDown)}>▼</button>
         </div>
       )}
      </div>
    </div>
  );
}

function DayView({trip,day,onUpdateTrip}){
  const [notes,setNotes]=useState(day.notes||'');
  const [filter,setFilter]=useState('all');
  const [addingType,setAddingType]=useState(null); // 'activity'|'restaurant'|null
  const [editingItem,setEditingItem]=useState(null); // {item, type}
  const [showMap,setShowMap]=useState(false);
  const [dayNoteDraft,setDayNoteDraft]=useState('');
  const dest=trip.destinations.find(d=>d.id===day.destinationId);
  const acts=(day.activities||[]).filter(a=>filter==='all'||a.bucket===filter);
  const rests=(day.restaurants||[]).filter(r=>filter==='all'||r.bucket===filter);
  // "You" identity for attribution = trip owner (or first collaborator)
  const me=(trip.collaborators||[]).find(c=>c.role==='owner')||(trip.collaborators||[])[0];
  const myName=me?.name||'You';
  const myColor=me?.avatarColor||AVATAR_COLORS[0];

  const updateDay=(newDay)=>onUpdateTrip({...trip,days:trip.days.map(d=>d.id===day.id?newDay:d)});

  const handleSaveActivity=(formData,type)=>{
    const listKey=type==='restaurant'?'restaurants':'activities';
    const list=[...(day[listKey]||[])];
    if(editingItem){
      const idx=list.findIndex(x=>x.id===editingItem.item.id);
      if(idx>=0) list[idx]={...list[idx],...formData};
      setEditingItem(null);
    } else {
      // unified sortOrder across both lists so new stops append to the end of the timeline
      const maxOrder=Math.max(-1,...(day.activities||[]).map(s=>s.sortOrder??0),...(day.restaurants||[]).map(s=>s.sortOrder??0));
      list.push({...formData,id:uuid(),sortOrder:maxOrder+1,
        addedBy: me?.id||null, addedByName: me?null:'You', addedAt: Date.now(), comments:[]});
    }
    updateDay({...day,[listKey]:list});
    setAddingType(null);
  };

  const handleDelete=(id,listKey)=>{
    updateDay({...day,[listKey]:(day[listKey]||[]).filter(x=>x.id!==id)});
  };
  const listKeyOf=(item)=> (day.activities||[]).some(a=>a.id===item.id) ? 'activities' : 'restaurants';
  const addStopComment=(item,text)=>{
    const lk=listKeyOf(item);
    updateDay({...day,[lk]:(day[lk]||[]).map(s=>s.id===item.id?{...s,comments:[...(s.comments||[]),{id:uuid(),author:myName,color:myColor,text,ts:Date.now()}]}:s)});
  };
  const deleteStopComment=(item,cid)=>{
    const lk=listKeyOf(item);
    updateDay({...day,[lk]:(day[lk]||[]).map(s=>s.id===item.id?{...s,comments:(s.comments||[]).filter(c=>c.id!==cid)}:s)});
  };
  const addDayComment=(text)=> updateDay({...day,comments:[...(day.comments||[]),{id:uuid(),author:myName,color:myColor,text,ts:Date.now()}]});
  const deleteDayComment=(cid)=> updateDay({...day,comments:(day.comments||[]).filter(c=>c.id!==cid)});

  const hotel=trip.lodging?.find(l=>!l.destinationId||l.destinationId===day.destinationId);
  const wxMap={GB:{icon:'🌤',cond:'Partly Cloudy',hi:17,lo:12,unit:'C',rain:30},FR:{icon:'☀️',cond:'Mild & Sunny',hi:20,lo:14,unit:'C',rain:10},US:{icon:'☀️',cond:'Sunny',hi:30,lo:24,unit:'F',rain:5}};
  const wx=dest?wxMap[dest.countryCode]||null:null;
  function saveNotes(v){onUpdateTrip({...trip,days:trip.days.map(d=>d.id===day.id?{...d,notes:v}:d)});}

  // Merge activities + restaurants into one timeline.
  // Sort by manual sortOrder first (so up/down reordering sticks), time as tiebreaker.
  const merged=[...acts.map(a=>({item:a,type:'activity'})),...rests.map(r=>({item:r,type:'restaurant'}))]
    .sort((a,b)=>{
      const so=(a.item.sortOrder??0)-(b.item.sortOrder??0);
      if(so!==0) return so;
      const ta=a.item.time||'', tb=b.item.time||'';
      if(ta&&tb&&ta!==tb) return ta<tb?-1:1;
      if(ta&&!tb) return -1;
      if(!ta&&tb) return 1;
      return 0;
    });
  // Move a stop up/down in the merged timeline; persists a unified sortOrder across both lists.
  const moveStop=(i,dir)=>{
    const j=i+dir;
    if(j<0||j>=merged.length) return;
    const arr=merged.map(m=>m.item);
    [arr[i],arr[j]]=[arr[j],arr[i]];
    const orderMap=new Map(arr.map((s,k)=>[s.id,k]));
    const reindex=(list)=>(list||[]).map(s=>orderMap.has(s.id)?{...s,sortOrder:orderMap.get(s.id)}:s);
    updateDay({...day,activities:reindex(day.activities),restaurants:reindex(day.restaurants)});
  };
  const canReorder = filter==='all'; // reordering a filtered subset is ambiguous
  const totalStops=(day.activities||[]).length+(day.restaurants||[]).length;
  const dayComments=day.comments||[];

  return(
    <div style={{padding:'0 16px 32px'}}>
      {/* Header — day label + derived status pill */}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,marginBottom:16}}>
        <div style={{minWidth:0}}>
          <h2 className="font-display" style={{fontSize:'1.5rem',fontWeight:600,lineHeight:1.2,marginBottom:4}}>{day.label}{dest?<span style={{color:'var(--color-ink-light)',fontWeight:400}}> · {dest.city}</span>:''}</h2>
          <p style={{fontSize:'.85rem',color:'var(--color-ink-light)'}}>{formatDate(day.date)} · {totalStops} {totalStops===1?'stop':'stops'}</p>
        </div>
        <span className="pill" style={{flexShrink:0,background:'var(--color-success-soft, rgba(43,182,163,.14))',color:'var(--color-success)',fontWeight:600,fontSize:'.72rem',whiteSpace:'nowrap'}}>● On track</span>
      </div>
      {(() => {
        const dayItems = (trip.budget?.items||[]).filter(i=>i.day===day.id);
        if(!dayItems.length) return null;
        const sum = dayItems.reduce((s,i)=>s+(Number(i.amount)||0),0);
        return (
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'var(--color-accent-soft)',border:'1px solid var(--color-border)',borderRadius:10,padding:'8px 12px',marginBottom:16}}>
            <span style={{fontFamily:'var(--font-mono)',fontSize:'.68rem',letterSpacing:'.06em',textTransform:'uppercase',color:'var(--color-ink-muted)'}}>Day spend · {dayItems.length} {dayItems.length===1?'item':'items'}</span>
            <span style={{fontFamily:'var(--font-mono)',fontWeight:600,color:'var(--color-ink)'}}>${(Math.round(sum*100)/100).toLocaleString()}</span>
          </div>
        );
      })()}
      {wx&&(
        <div className="weather-strip" style={{marginBottom:16}}>
          <span style={{fontSize:'1.5rem'}}>{wx.icon}</span>
          <div style={{flex:1}}>
            <p style={{fontWeight:500,fontSize:'.9rem'}}>{wx.cond}</p>
            <p style={{fontSize:'.8rem',color:'var(--color-ink-light)'}}>High {wx.hi}°{wx.unit} · Low {wx.lo}°{wx.unit} · 🌧 {wx.rain}% rain</p>
          </div>
        </div>
      )}
      {hotel&&(
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'rgba(184,92,56,.05)',borderRadius:10,border:'1px solid rgba(184,92,56,.12)',marginBottom:16}}>
          <span style={{fontSize:'1.1rem',flexShrink:0}}>🏨</span>
          <div style={{minWidth:0,flex:1}}>
            <p style={{fontWeight:600,fontSize:'.875rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{hotel.name}</p>
            <p style={{fontSize:'.8rem',color:'var(--color-ink-light)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{hotel.address}</p>
          </div>
        </div>
      )}
      {/* Day route — inline map + Google Maps handoff */}
      {(()=>{
        const routeUrl=buildDayRouteUrl(trip,day);
        if(!routeUrl)return null;
        return(
          <div style={{marginBottom:16}}>
            <div style={{display:'flex',gap:8,marginBottom:showMap?10:0}}>
              <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={()=>setShowMap(s=>!s)}>{showMap?'▲ Hide map':'🗺 Map this day'}</button>
              <a className="btn btn-ghost btn-sm" style={{flex:1,textAlign:'center'}} href={routeUrl} target="_blank" rel="noopener">Open route in Google Maps ↗</a>
            </div>
            {showMap&&<DayRouteMap trip={trip} day={day}/>}
          </div>
        );
      })()}
      {/* Filters + add */}
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        {['all','must-do','nice-to-have'].map(f=>(
          <button key={f} className={`pill ${filter===f?'pill-accent':'pill-neutral'}`} style={{cursor:'pointer',border:'none'}} onClick={()=>setFilter(f)}>
            {f==='all'?'All':f==='must-do'?'★ Must Do':'✨ Nice'}
          </button>
        ))}
        <span style={{flex:1}}/>
        {!addingType&&!editingItem&&(
          <>
            <button className="btn btn-ghost btn-sm" onClick={()=>setAddingType('activity')}>+ Activity</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setAddingType('restaurant')}>+ Food</button>
          </>
        )}
      </div>
      {/* Add / edit forms */}
      {editingItem&&(
        <ActivityForm initial={editingItem.item} type={editingItem.type}
          onSave={f=>handleSaveActivity(f,editingItem.type)} onCancel={()=>setEditingItem(null)}/>
      )}
      {addingType&&(
        <ActivityForm type={addingType}
          onSave={f=>handleSaveActivity(f,addingType)} onCancel={()=>setAddingType(null)}/>
      )}
      {/* Timeline card */}
      <div className="card" style={{padding:'18px 16px 4px',marginBottom:16}}>
        {merged.length===0 ? (
          <p style={{fontSize:'.85rem',color:'var(--color-ink-muted)',padding:'4px 0 16px'}}>
            {totalStops===0 ? 'No stops yet — tap + Activity or + Food to start this day.' : 'Nothing matches this filter.'}
          </p>
        ) : merged.map(({item,type},i)=>(
          <TimelineStop key={item.id} trip={trip} item={item} type={type}
            onEdit={it=>{setAddingType(null);setEditingItem({item:it,type});}}
            onDelete={id=>handleDelete(id,type==='restaurant'?'restaurants':'activities')}
            onAddComment={addStopComment} onDeleteComment={deleteStopComment}
            onMoveUp={canReorder?()=>moveStop(i,-1):null} onMoveDown={canReorder?()=>moveStop(i,1):null}
            canMoveUp={canReorder&&i>0} canMoveDown={canReorder&&i<merged.length-1}/>
        ))}
      </div>
      {/* Notes on this day — attributed */}
      <div className="card" style={{padding:16}}>
        <p className="section-label" style={{marginBottom:dayComments.length?12:8}}>Notes on this day</p>
        {dayComments.map(c=>(
          <div key={c.id} style={{display:'flex',gap:9,alignItems:'flex-start',marginBottom:12}}>
            <Avatar22 initial={(c.author||'?').charAt(0).toUpperCase()} color={c.color||AVATAR_COLORS[0]}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:'.8rem'}}><strong>{c.author}</strong> <span style={{color:'var(--color-ink-muted)'}}>{c.ts?'· '+relativeAgo(c.ts):''}</span></div>
              <div style={{fontSize:'.9rem',color:'var(--color-ink)',lineHeight:1.45}}>{c.text}</div>
            </div>
            <button aria-label="Delete note" onClick={()=>deleteDayComment(c.id)} className="btn btn-ghost btn-sm" style={{color:'var(--color-flag)',padding:'0 6px'}}>✕</button>
          </div>
        ))}
        <div style={{display:'flex',gap:6}}>
          <input className="input" style={{flex:1}} placeholder="Add a note for the crew…" value={dayNoteDraft}
            onChange={e=>setDayNoteDraft(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&dayNoteDraft.trim()){addDayComment(dayNoteDraft.trim());setDayNoteDraft('');}}}/>
          <button className="btn btn-primary btn-sm" disabled={!dayNoteDraft.trim()} onClick={()=>{if(dayNoteDraft.trim()){addDayComment(dayNoteDraft.trim());setDayNoteDraft('');}}}>Post</button>
        </div>
        {/* Freeform scratchpad (kept from earlier versions) */}
        <details style={{marginTop:14}}>
          <summary style={{cursor:'pointer',fontSize:'.78rem',color:'var(--color-ink-muted)',listStyle:'none'}}>📝 Shared scratchpad</summary>
          <textarea className="input-field" placeholder="Meet times, reminders, who's doing what..."
            value={notes} onChange={e=>setNotes(e.target.value)} onBlur={()=>saveNotes(notes)}
            style={{minHeight:70,resize:'vertical',fontFamily:'var(--font-body)',fontSize:'.875rem',marginTop:8}}/>
        </details>
      </div>
    </div>
  );
}

// ── AT A GLANCE ────────────────────────────────────────────────────────────────
function AtAGlance({trip}){
  const allCount=trip.days.reduce((n,d)=>n+(d.activities||[]).length+(d.restaurants||[]).length,0);
  return(
    <div style={{padding:'0 16px 32px'}}>
      {trip.days.length===0||allCount===0?(
        <div className="card" style={{padding:20,marginBottom:16,textAlign:'center',borderStyle:'dashed',borderColor:'var(--color-accent-warm)'}}>
          <div style={{fontSize:'1.6rem',marginBottom:8}}>🗺️</div>
          <p style={{fontWeight:600,fontSize:'.95rem',marginBottom:4,color:'var(--color-accent)'}}>No itinerary yet</p>
          <p style={{fontSize:'.82rem',color:'var(--color-ink-light)',lineHeight:1.5}}>Head to the Days tab and tap <strong>Generate Itinerary</strong> to build your trip with AI. Make sure your API key is saved in Settings first.</p>
        </div>
      ):(
        <div className="card" style={{padding:16,marginBottom:16}}>
          <p style={{fontWeight:600,fontSize:'.9rem',marginBottom:4}}>{trip.days.length} days · {allCount} stops planned</p>
          <p style={{fontSize:'.8rem',color:'var(--color-ink-light)'}}>{trip.destinations.map(d=>d.city).join(' → ')} · {formatDateShort(trip.startDate)} – {formatDateShort(trip.endDate)}</p>
        </div>
      )}
      {trip.days.filter(d=>(d.activities||[]).length+(d.restaurants||[]).length>0).map(day=>{
        const items=[...(day.activities||[]).map(a=>({...a,_t:'activity'})),...(day.restaurants||[]).map(r=>({...r,_t:'restaurant'}))];
        return(
          <div key={day.id} style={{marginBottom:10}}>
            <p style={{fontSize:'.75rem',fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--color-ink-light)',marginBottom:6,paddingLeft:4}}>{day.label} · {formatDateShort(day.date)}</p>
            <div className="card" style={{overflow:'hidden'}}>
              {items.map((item,i)=>(
                <div key={item.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',borderBottom:i<items.length-1?'1px solid var(--color-border)':'none'}}>
                  <span style={{fontSize:'1.1rem',flexShrink:0}}>{item.emoji}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{fontWeight:500,fontSize:'.875rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{item.name}</p>
                    {item.neighborhood&&<p style={{fontSize:'.75rem',color:'var(--color-ink-light)'}}>{item.neighborhood}</p>}
                  </div>
                  {item.bucket==='must-do'&&<span className="badge-must" style={{flexShrink:0}}>★</span>}
                  {(item.bookingRequired||item.reservationRequired)&&<span style={{fontSize:'.7rem',color:'var(--color-flag)',flexShrink:0}}>📌</span>}
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── SHARE SHEET ────────────────────────────────────────────────────────────────
function ShareSheet({trip,onClose}){
  const [copied,setCopied]=useState(false);
  const text=`📍 ${trip.title}\n✈️ ${trip.destinations.map(d=>d.city).join(' → ')}\n📅 ${formatDateShort(trip.startDate)} – ${formatDateShort(trip.endDate)}\n\nPlanned with Locale ✨`;
  function copy(){navigator.clipboard?.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)});}
  function share(){if(navigator.share){navigator.share({title:trip.title,text}).catch(()=>{});}else copy();}
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="sheet">
        <div className="sheet-handle"/>
        <div style={{padding:'16px 24px 8px',borderBottom:'1px solid var(--color-border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <h2 className="font-display" style={{fontSize:'1.25rem',fontWeight:600}}>Share Trip</h2>
          <button className="btn btn-ghost" aria-label="Close" onClick={onClose}>✕</button>
        </div>
        <div style={{padding:'20px 24px 32px'}}>
          <div className={trip.coverGradient||'gradient-generic'} style={{height:120,marginBottom:20,borderRadius:'var(--radius)',overflow:'hidden',position:'relative'}}>
            <div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(28,28,26,.85) 0%,transparent 70%)'}}/>
            <div style={{position:'absolute',bottom:0,left:0,right:0,padding:14}}>
              <p className="font-display" style={{color:'white',fontSize:'1.1rem',fontWeight:600}}>{trip.title}</p>
              <p style={{color:'rgba(255,255,255,.7)',fontSize:'.8rem'}}>{trip.destinations.map(d=>d.city).join(' → ')} · {formatDateShort(trip.startDate)}</p>
            </div>
          </div>
          <p className="section-label">Share with your group</p>
          <div style={{background:'var(--color-cream)',border:'1.5px solid var(--color-border)',borderRadius:10,padding:'10px 14px',fontSize:'.8rem',color:'var(--color-ink-light)',whiteSpace:'pre-line',marginBottom:16}}>{text}</div>
          <div style={{display:'flex',gap:8,marginBottom:20}}>
            <button className="btn btn-primary" style={{flex:2}} onClick={share}>{navigator.share?'📤 Share':'📋 Copy Summary'}</button>
            <button className="btn btn-secondary" style={{flex:1}} onClick={copy}>{copied?'✅ Copied':'Copy'}</button>

function TripCard({trip, onClick, animDelay=0}) {
  const {title, emoji, destinations, startDate, endDate, collaborators, occasion} = trip;

  const gradKey = firstDest?.countryCode === 'GB' ? 'london' : firstDest?.countryCode === 'FR' ? 'paris' : firstDest?.city?.toLowerCase().includes('miami') ? 'miami' : 'generic';

  const checklist = trip.checklist || [];
  const done = checklist.filter(i => i.checked).length;
  const total = checklist.length;
  const pct = total > 0 ? Math.round(done/total*100) : 0;
  const nightCount = startDate && endDate ? Math.round((new Date(endDate)-new Date(startDate))/86400000) : null;
  return (

          <div className="trip-card-dates">

function CityAutocomplete({value, country, onChange, onCountryChange}) {
  const {useState: uS, useRef: uR, useEffect: uE} = React;
  const [suggestions, setSuggestions] = uS([]);
  const [focused, setFocused] = uS(false);
  const wrapRef = uR(null);

  // Close dropdown when clicking outside
  uE(()=>{
    const handler = e => { if(wrapRef.current && !wrapRef.current.contains(e.target)) setFocused(false); };
    document.addEventListener('mousedown', handler);
    return ()=>document.removeEventListener('mousedown', handler);
  },[]);

  const handleInput = v => {
    const matches = searchCities(v);
    setSuggestions(matches);
    setFocused(true);
    // Also try CITY_TO_COUNTRY exact match for auto-fill without selecting from list
    const key = v.toLowerCase().trim();
    const cityMatch = CITY_TO_COUNTRY[key];
    if(cityMatch) {
      onChange(v.length ? v.charAt(0).toUpperCase()+v.slice(1) : v, cityMatch);
    } else {
      onChange(v.length ? v.charAt(0).toUpperCase()+v.slice(1) : v, null);
    }
  };

  const select = c => {
    onChange(c.city, {countryCode: c.countryCode, country: c.country, isInternational: c.isInternational, region: c.region});
    setSuggestions([]);
    setFocused(false);
  };

  const showDrop = focused && suggestions.length > 0;

  return (
    <div ref={wrapRef} style={{position:'relative', marginBottom:8}}>
      <div style={{display:'grid', gridTemplateColumns:'2fr 1fr', gap:8}}>
        <div style={{position:'relative'}}>
          <input className="input" placeholder="City (e.g. Portland, OR)"
            autoComplete="off" autoCorrect="off" autoCapitalize="words" spellCheck="false"
            value={value}
            onFocus={()=>{ if(value.length>=2) setSuggestions(searchCities(value)); setFocused(true); }}
            onChange={e=>handleInput(e.target.value)}
          />
          {showDrop && (
            <div style={{
              position:'absolute', top:'calc(100% + 4px)', left:0, right:0, zIndex:100,
              background:'var(--color-surface)', border:'1px solid var(--color-border)',
              borderRadius:10, boxShadow:'0 4px 16px rgba(0,0,0,.12)', overflow:'hidden'
            }}>
              {suggestions.map((c,idx)=>(
                <button key={idx} onMouseDown={()=>select(c)} style={{
                  width:'100%', textAlign:'left', padding:'10px 14px', background:'none', border:'none',
                  borderBottom: idx<suggestions.length-1 ? '1px solid var(--color-border)' : 'none',
                  cursor:'pointer', display:'flex', alignItems:'center', gap:8
                }}
                onMouseEnter={e=>e.currentTarget.style.background='var(--color-cream)'}
                onMouseLeave={e=>e.currentTarget.style.background='none'}>
                  <span style={{fontSize:'.875rem', fontWeight:500, color:'var(--color-ink)'}}>{c.city}</span>
                  {c.region && <span style={{fontSize:'.78rem', color:'var(--color-ink-muted)'}}>{c.region}</span>}
                  <span style={{fontSize:'.75rem', color:'var(--color-ink-light)', marginLeft:'auto'}}>{c.country}</span>
                </button>
              ))}
            </div>
          )}
        </div>
        <input className="input" placeholder="Country"
          autoComplete="off" autoCorrect="off" autoCapitalize="words" spellCheck="false"
          value={country}
          onChange={e=>{ const v=e.target.value; onCountryChange(v.length?v.charAt(0).toUpperCase()+v.slice(1):v); }}
        />
      </div>
    </div>
  );
}

                <button className="btn btn-ghost" style={{fontSize:'.8rem',padding:'4px 10px'}} onClick={addDest}>+ Add Stop</button>
              </div>
              {errors.destinations&&<p style={{color:'var(--color-flag)',fontSize:'.75rem',marginBottom:8}}>{errors.destinations}</p>}
              {form.destinations.map((d,i)=>(
                <div key={d.id} style={{border:'1px solid var(--color-border)',borderRadius:12,padding:12,marginBottom:8,background:'var(--color-cream)'}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                    <span style={{fontSize:'.8rem',fontWeight:600,color:'var(--color-ink-light)'}}>Stop {i+1}</span>
                    {form.destinations.length>1&&<button className="btn btn-ghost" style={{fontSize:'.75rem',padding:'2px 8px',color:'var(--color-flag)'}} onClick={()=>removeDest(i)}>Remove</button>}
                  </div>
                  <CityAutocomplete
                    value={d.city}
                    country={d.country||''}
                    onChange={(cityVal, meta)=>{
                      setForm(f=>{
                        const ds=[...f.destinations];
                        ds[i]={...ds[i], city:cityVal, ...(meta||{})};
                        return{...f,destinations:ds};
                      });
                    }}
                    onCountryChange={v=>{
                      setForm(f=>{const ds=[...f.destinations];ds[i]={...ds[i],country:v};return{...f,destinations:ds};});
                    }}
                  />
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                    <div>
                      <label className="section-label" style={{fontSize:'.7rem'}}>Arrival</label>
                      <input className="input" type="date" value={d.arrivalDate}
                        min={form.startDate||undefined} max={form.endDate||undefined}
                        onChange={e=>{
                          const v=e.target.value;
                          setDest(i,'arrivalDate',v);
                          // Auto-advance departure to next day if unset or before arrival
                          if(v&&(!d.departureDate||d.departureDate<=v)){
                            const next=new Date(v+'T12:00:00');next.setDate(next.getDate()+1);
                            const nextStr=next.toISOString().slice(0,10);
                            setForm(f=>{const ds=[...f.destinations];ds[i]={...ds[i],arrivalDate:v,departureDate:nextStr<=form.endDate?nextStr:form.endDate||nextStr};return{...f,destinations:ds};});
                          }
                        }}/>
                    </div>
                    <div>
                      <label className="section-label" style={{fontSize:'.7rem'}}>Departure</label>
                      <input className="input" type="date" value={d.departureDate}
                        min={d.arrivalDate||form.startDate||undefined} max={form.endDate||undefined}
                        onChange={e=>setDest(i,'departureDate',e.target.value)}/>
                    </div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setStep(1)}>← Back</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={()=>{if(validate2())setStep(3);}}>Preview →</button>
            </div>
          </div>
        )}

        {step===3 && (
          <div>
            <div style={{border:'1px solid var(--color-border)',borderRadius:16,overflow:'hidden',marginBottom:20}}>
              <div className={`trip-card-header gradient-${form.destinations[0]?.countryCode==='GB'?'london':form.destinations[0]?.countryCode==='FR'?'paris':form.destinations[0]?.city?.toLowerCase().includes('miami')?'miami':'generic'}`} style={{padding:'20px 16px'}}>
                <div style={{fontSize:'2rem'}}>{form.emoji}</div>
                <div style={{flex:1}}>
                  <div style={{fontFamily:'var(--font-display)',fontSize:'1.2rem',fontWeight:700,color:'#fff'}}>{form.title||'Your Trip'}</div>
                  <div style={{fontSize:'.8rem',color:'rgba(255,255,255,.8)'}}>{formatDateShort(form.startDate)} – {formatDateShort(form.endDate)}</div>
                </div>
              </div>
              <div style={{padding:16}}>
                <p style={{fontSize:'.85rem',color:'var(--color-ink-light)',marginBottom:12}}>Destinations: {form.destinations.filter(d=>d.city).map(d=>d.city).join(' → ')}</p>
                <p style={{fontSize:'.85rem',color:'var(--color-ink-light)'}}>Auto-checklist will be generated ({form.destinations.some(d=>d.countryCode!=='US')?'international':'domestic'} trip · {getOccasionLabel(form.occasion)})</p>
                {getIntlFlags(form).length>0&&(
                  <div style={{marginTop:12,display:'flex',gap:8,flexWrap:'wrap'}}>
                    {getIntlFlags(form).map((f,i)=><span key={i} className="pill badge-must" style={{fontSize:'.75rem'}}>{f.emoji} {f.label}</span>)}
                  </div>
                )}
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setStep(2)}>← Back</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={handleCreate}>✨ Create trip</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function generateTripPDF(trip) {
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const gradMap = {
    'gradient-generic':  'linear-gradient(135deg,#1C4A56,#2B5F6E,#3D5A7A)',
    'gradient-london':   'linear-gradient(135deg,#1C4A56,#2B5F6E,#1E3D4A)',
    'gradient-paris':    'linear-gradient(135deg,#2A3F5F,#3D5A7A,#253352)',
    'gradient-miami':    'linear-gradient(135deg,#2E5C4A,#4A7268,#1F4035)',
    'gradient-sunset':   'linear-gradient(135deg,#5C3020,#7A5240,#9A6B50)',
    'gradient-forest':   'linear-gradient(135deg,#243D2E,#3A5C48,#2E4A3A)',
    'gradient-desert':   'linear-gradient(135deg,#5C4A20,#7A6840,#6B5530)',
    'gradient-lavender': 'linear-gradient(135deg,#3D2E5C,#5A4A78,#4A3868)',
    'gradient-rose':     'linear-gradient(135deg,#5C2E3A,#7A4A58,#6B3848)',
    'gradient-slate':    'linear-gradient(135deg,#2E3A4A,#3D4D5C,#2A3848)',
  };
  const firstDest = trip.destinations?.[0];
  const autoGrad = firstDest?.countryCode==='GB'?'gradient-london':firstDest?.countryCode==='FR'?'gradient-paris':'gradient-generic';
  const grad = gradMap[trip.coverGradient||autoGrad] || gradMap['gradient-generic'];

  const checklist = trip.checklist || [];
  const cats = [...new Set(checklist.map(i=>i.category))];

  const checklistHTML = checklist.length === 0 ? '' : `
    <section class="section">
      <h2 class="section-title">Checklist</h2>
      <p class="meta">${checklist.filter(i=>i.completed).length} of ${checklist.length} items complete</p>
      ${cats.map(cat=>`
        <div class="cat-label">${esc(cat)}</div>
        ${checklist.filter(i=>i.category===cat).map(item=>`
          <div class="checklist-row ${item.completed?'done':''}">
            <span class="cb">${item.completed?'✓':''}</span>
            <span>${esc(item.label)}</span>
          </div>
        `).join('')}
      `).join('')}
    </section>`;

  const daysHTML = (trip.days||[]).map(day=>`
    <div class="day-block">
      <div class="day-header">${esc(day.label||formatDate(day.date))}</div>
      ${(day.activities||[]).map(a=>`
        <div class="card">
          <div class="card-title">${a.emoji||'📍'} ${esc(a.name)}</div>
          ${a.address?`<div class="card-meta">${esc(a.address)}</div>`:''}
          ${a.notes?`<div class="card-notes">${esc(a.notes)}</div>`:''}
          ${a.bookingRequired&&a.bookingUrl?`<div class="book-badge">Book in advance</div>`:''}
        </div>
      `).join('')}
      ${(day.restaurants||[]).map(r=>`
        <div class="card">
          <div class="card-title">${r.emoji||'🍽️'} ${esc(r.name)}</div>
          ${r.cuisine?`<div class="card-meta">${esc(r.cuisine)}${r.neighborhood?' · '+esc(r.neighborhood):''}</div>`:''}
          ${r.notes?`<div class="card-notes">${esc(r.notes)}</div>`:''}
          ${r.reservationRequired?`<div class="book-badge">Reservation recommended</div>`:''}
        </div>
      `).join('')}
      ${day.notes?`<div class="day-notes">📝 ${esc(day.notes)}</div>`:''}
    </div>
  `).join('');

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#F5F2EC;color:#1A1714;font-size:13px;line-height:1.5}
    .cover{background:${grad};color:#fff;padding:36px 32px 28px;border-radius:0 0 20px 20px;margin-bottom:24px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .cover-wordmark{font-family:'Cormorant Garamond',serif;font-size:13px;opacity:.7;margin-bottom:12px;letter-spacing:.1em}
    .cover-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;margin-bottom:6px}
    .cover-meta{opacity:.8;font-size:12px;margin-bottom:4px}
    .cover-dest{opacity:.7;font-size:11px}
    .section{padding:0 24px;margin-bottom:20px}
    .section-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:#2B5F6E;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #DDD9D1}
    .meta{font-size:11px;color:#8A8784;margin-bottom:10px}
    .cat-label{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8A8784;margin:10px 0 4px}
    .checklist-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #EDE9E1;font-size:12px}
    .checklist-row.done{color:#8A8784;text-decoration:line-through}
    .cb{width:16px;height:16px;border-radius:4px;border:1.5px solid #C8C5C0;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:#2B5F6E;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .checklist-row.done .cb{background:#2B5F6E;border-color:#2B5F6E;color:#fff}
    .day-block{padding:0 24px;margin-bottom:16px;page-break-inside:avoid}
    .day-header{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:#fff;background:${grad};padding:8px 14px;border-radius:10px;margin-bottom:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .card{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1px solid #EDE9E1;page-break-inside:avoid}
    .card-title{font-weight:500;font-size:13px;margin-bottom:3px}
    .card-meta{font-size:11px;color:#8A8784;margin-bottom:3px}
    .card-notes{font-size:11px;color:#5A5755;line-height:1.5}
    .book-badge{display:inline-block;margin-top:6px;background:#EAF3F5;color:#2B5F6E;font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .day-notes{font-size:11px;font-style:italic;color:#8A8784;padding:8px 12px;background:#FAF8F4;border-radius:8px;margin-top:4px}
    .footer{text-align:center;font-size:10px;color:#B0ADA8;padding:20px;margin-top:8px}
    @media print{
      body{background:#F5F2EC}
      .cover,.day-header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .no-print{display:none}
      @page{margin:12mm}
    }
  </style>
  </head><body>
  <div class="cover">
    <div class="cover-wordmark">Locale</div>
    <div class="cover-title">${esc(trip.title||'My Trip')}</div>
    <div class="cover-meta">${formatDate(trip.startDate)} – ${formatDate(trip.endDate)}</div>
    <div class="cover-dest">${(trip.destinations||[]).map(d=>esc(d.city)).join(' → ')}</div>
  </div>
  ${checklistHTML}
  <section class="section"><h2 class="section-title">Itinerary</h2></section>
  ${daysHTML}
  <div class="footer">Generated by Locale · ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>
  <script>window.onload=()=>{window.print();}<\/script>
  </body></html>`;

  const w = window.open('','_blank');
  w.document.write(html);
  w.document.close();
}

// ── TASTE PROFILE QUIZ — one-time, flavors every AI call ──────────────────────
function ProfileQuiz({initial, onDone}) {
  const [p, setP] = React.useState(initial || {style:'', pace:'', interests:[], notes:''});
  const toggleInterest = (i) => setP(prev=>({...prev, interests: prev.interests.includes(i) ? prev.interests.filter(x=>x!==i) : [...prev.interests, i]}));
  const STYLE_OPTS = ['Live like a local', 'Classic must-sees', 'A mix of both'];
  const PACE_OPTS = ['Packed days', 'Balanced', 'Slow mornings, easy days'];
  const INTERESTS = ['Food & restaurants','Fashion & boutiques','Art & museums','History','Nightlife','Outdoors','Shopping','Live music','Architecture','Coffee & cafés'];
  const Chip = ({label, active, onClick}) => (
    <button type="button" onClick={onClick} className={`pill ${active?'pill-accent':'pill-muted'}`} style={{cursor:'pointer',fontSize:'.8rem',padding:'6px 14px'}}>{label}</button>
  );
  return (
    <div style={{padding:'24px 20px',maxWidth:520,margin:'0 auto'}}>
      <div style={{textAlign:'center',marginBottom:20}}>
        <div style={{fontSize:'1.8rem',marginBottom:8}}>🧭</div>
        <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.4rem',fontWeight:600,marginBottom:6}}>How do you like to travel?</h3>
        <p style={{fontSize:'.83rem',color:'var(--color-ink-light)',lineHeight:1.5}}>30 seconds, once. Every AI suggestion — neighborhoods, itineraries, packing — gets tailored to you.</p>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:18}}>
        <div>
          <label className="section-label">Your style</label>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{STYLE_OPTS.map(s=><Chip key={s} label={s} active={p.style===s} onClick={()=>setP({...p,style:s})}/>)}</div>
        </div>
        <div>
          <label className="section-label">Your pace</label>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{PACE_OPTS.map(s=><Chip key={s} label={s} active={p.pace===s} onClick={()=>setP({...p,pace:s})}/>)}</div>
        </div>
        <div>
          <label className="section-label">What you love (pick any)</label>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{INTERESTS.map(i=><Chip key={i} label={i} active={p.interests.includes(i)} onClick={()=>toggleInterest(i)}/>)}</div>
        </div>
        <div>
          <label className="section-label">Anything else? (optional)</label>
          <textarea className="input" rows={2} value={p.notes} onChange={e=>setP({...p,notes:e.target.value})}
            placeholder={'e.g. "We travel with a stroller", "vegetarian", "I always find the best vintage shops"'} style={{resize:'vertical',lineHeight:1.5}}/>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost" style={{flex:1}} onClick={()=>onDone(null)}>Skip for now</button>
          <button className="btn btn-primary" style={{flex:2}} onClick={()=>onDone(p)}>Save my taste →</button>
        </div>
      </div>
    </div>
  );
}

// ── AI IDEATION MODE — for trips that are still just an idea ──────────────────
function IdeationPlanner({trip, onUpdateTrip, apiKey, refreshUsage, freeLeft}) {
  const [prompt, setPrompt] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const [streamText, setStreamText] = React.useState('');
  const result = trip.ideation || null;

  const buildIdeationPrompt = () => {
    const profile = profilePromptText(getTasteProfile());
    return `You are a sharp, honest travel advisor. The traveler is DREAMING about a trip — nothing is booked. Your job: recommend where to stay, when to go, and how to think about this destination, tailored tightly to who they are.

Trip idea:
- Destination(s): ${trip.destinations.map(d=>`${d.city} (${d.countryCode})`).join(', ')}
- Occasion: ${trip.occasion} · Travelers: ${trip.travelerCount||2}
${trip.startDate?`- Tentative dates: ${trip.startDate} to ${trip.endDate}`:'- No dates yet — recommending the best time is part of your job'}
${profile}
Return ONLY a valid JSON object — no markdown, no commentary — with this exact shape:
{
  "destination_summary": "2-3 sentences on how this destination fits THIS traveler specifically",
  "best_time": {"when": "e.g. late September to mid October", "why": "weather, crowds, prices, events"},
  "neighborhoods": [{"name": "", "why": "why it fits this traveler", "stay_here_if": "one sentence"}],
  "day_trips": [{"name": "", "why": ""}],
  "tips": ["2-4 practical, traveler-specific tips"]
}
Rules: 3-5 neighborhoods ordered best-fit first. 1-3 day trips. Be specific and opinionated — name real neighborhoods and real reasons. If the user's message adds constraints, honor every one of them.`;
  };

  const ideate = async () => {
    setLoading(true); setError(''); setStreamText('');
    try {
      const messages=[{role:'user',content: prompt.trim() ? 'About this trip: '+prompt : 'Recommend based on my profile and the trip idea above.'}];
      let full='';
      if (apiKey) {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method:'POST',
          headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
          body: JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:4096,system:buildIdeationPrompt(),messages})
        });
        if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err?.error?.message||`API error ${res.status}`);}
        const data=await res.json(); full=data?.content?.[0]?.text||'';
      } else {
        full = await callAIProxy({feature:'ideate',system:buildIdeationPrompt(),messages,max_tokens:4096,onDelta:t=>setStreamText(t)});
        refreshUsage&&refreshUsage();
      }
      const obj = safeJSONParse(full);
      if(!obj) throw new Error('No recommendations found in the response. Tap "Get recommendations" to try again.');
      const parsed = validateIdeation(obj);
      if(!parsed) throw new Error("The response wasn't formatted correctly — your trip is unchanged. Try again.");
      onUpdateTrip({...trip, ideation: parsed});
      setStreamText('');
    } catch(e){ setError(e.message); }
    finally{ setLoading(false); }
  };

  const Card = ({children}) => <div style={{background:'var(--color-surface)',border:'1px solid var(--color-border)',borderRadius:14,padding:'16px 18px',marginBottom:10}}>{children}</div>;

  // Pin a suggestion so it flows into the itinerary prompt once booked (PRD 2.3)
  const pinned = trip.pinnedIdeas || [];
  const isPinned = (text) => pinned.some(p=>p.text===text);
  const togglePin = (text) => {
    const next = isPinned(text) ? pinned.filter(p=>p.text!==text) : [...pinned, {id:uuid(), text}];
    onUpdateTrip({...trip, pinnedIdeas: next});
    showToast(isPinned(text)?'Unpinned':'📌 Pinned — we\'ll use this when you plan your days','info',3000);
  };
  const PinBtn = ({text}) => (
    <button onClick={()=>togglePin(text)} aria-label={isPinned(text)?'Unpin':'Pin this idea'}
      style={{background:'none',border:'none',cursor:'pointer',fontSize:'.9rem',padding:'2px 4px',opacity:isPinned(text)?1:.4,flexShrink:0}}
      title={isPinned(text)?'Pinned — tap to remove':'Pin this idea'}>📌</button>
  );

  return (
    <div style={{padding:'0 0 40px'}}>
      <div style={{background:'linear-gradient(135deg,#3D2E5C 0%,#5A4A78 100%)',borderRadius:16,padding:'24px 20px',marginBottom:20,position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:-20,right:-20,fontSize:'6rem',opacity:.08,transform:'rotate(-15deg)'}}>💭</div>
        <p style={{color:'rgba(255,255,255,.7)',fontSize:'.75rem',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:4}}>Trip Ideation</p>
        <h3 style={{fontFamily:'var(--font-display)',color:'#fff',fontSize:'1.4rem',fontWeight:600,marginBottom:4}}>{trip.title}</h3>
        <p style={{color:'rgba(255,255,255,.75)',fontSize:'.83rem'}}>Where to stay · when to go · tailored to your taste</p>
        {!apiKey && freeLeft!=null && (
          <div style={{marginTop:12,display:'inline-flex',background:'rgba(255,255,255,.14)',border:'1px solid rgba(255,255,255,.22)',borderRadius:20,padding:'4px 12px'}}>
            <span style={{fontSize:'.75rem',color:'#fff'}}>✨ {freeLeft} of {FREE_GENERATION_CAP} free AI generations left</span>
          </div>
        )}
      </div>

      {!result && (
        <div style={{marginBottom:16}}>
          <label className="section-label">Tell us about this trip dream (optional)</label>
          <textarea className="input" rows={4} value={prompt} onChange={e=>setPrompt(e.target.value)}
            placeholder={'e.g. "I love fashion and food. When I travel I like to live like a local first, then hit the attractions. Budget-ish on hotels, splurge on dinners."'}
            style={{resize:'vertical',lineHeight:1.6,fontSize:'.875rem',marginBottom:12}}/>
        </div>
      )}

      {error && <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,padding:'10px 14px',fontSize:'.83rem',color:'#b91c1c',marginBottom:14}}>{error}</div>}
      {loading && (
        <div style={{background:'var(--color-surface)',border:'1px solid var(--color-border)',borderRadius:10,padding:'14px 16px',marginBottom:14}}>
          {(()=>{
            const found=[...streamText.matchAll(/"name"\s*:\s*"([^"]{1,60})"/g)].map(m=>m[1]);
            const stage=streamText.includes('"tips"')?'Final tips for you…':streamText.includes('"day_trips"')?'Scouting day trips…':streamText.includes('"neighborhoods"')?'Picking your neighborhoods…':streamText.includes('"best_time"')?'Working out the best time to go…':'Reading your taste profile…';
            return (
              <div>
                <p style={{fontSize:'.72rem',color:'var(--color-ink-muted)',marginBottom:8,fontWeight:600,letterSpacing:'.05em',textTransform:'uppercase'}}>💭 Thinking through your trip</p>
                <p style={{fontSize:'.83rem',color:'var(--color-ink)',marginBottom:found.length?8:0}}>{stage}</p>
                {found.length>0&&(
                  <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                    {found.slice(0,8).map((n,i)=><span key={i} className="pill pill-muted" style={{fontSize:'.72rem'}}>📍 {n}</span>)}
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      )}

      {!result && (
        <button className="btn btn-primary" style={{width:'100%',padding:'14px',fontSize:'1rem',opacity:loading?0.7:1}} onClick={ideate} disabled={loading}>
          {loading ? '💭 Dreaming up your trip…' : '💭 Get recommendations'}
        </button>
      )}

      {result && (

${profilePromptText(getTasteProfile())}
GEOGRAPHY & LOGISTICS RULES (critical — plan each day as an efficient route that MINIMIZES total travel time):
1. Cluster each day's activities and restaurants in ONE neighborhood or area — never criss-cross the city in a single day.
2. Anchor every day to the lodging${(trip.lodging||[]).length?' listed above':''}: breakfast/first stop near it, and the last stop should make for an easy trip back.
3. Sequence stops so the day forms a loop or a one-way path with NO backtracking — each stop near the previous one (hotel → breakfast → boutique → museum → lunch nearby → afternoon stop → happy hour → dinner → hotel).
4. Pair every meal with the geographically nearest activity at that time of day — lunch and dinner must be a short walk from the stops right before/after them, never across town.

CRITICAL RULES about the user's request:

2. DATED EVENTS: when the user ties something to a specific day or weekday ("on Saturday", "Monday checkout", "the 14th"), put it on THAT exact date. Compute the weekday from the trip dates so e.g. "Saturday" maps to the correct calendar day. Never shift a dated event to a different day for convenience.
3. PER-SUBGROUP / SPLIT DAYS: the group may split up on a given day (e.g. "the guys go to the ASU–Kansas State game at Wembley on Saturday while the women and toddler do something kid-friendly"). When this happens, plan BOTH tracks for that day: create separate activities for each subgroup, label each clearly in the activity name or notes (e.g. "(Guys) ASU vs Kansas State — Wembley Stadium", "(With toddler) Hyde Park playground + Natural History Museum"), and keep each track's stops geographically sensible. Do not collapse a split day into one shared plan.
4. INTER-CITY TRANSIT: if the trip spans multiple cities or the user mentions moving between them (e.g. "check out Monday and take the Eurostar/train from London to Paris"), make that travel an explicit event on the correct day: a checkout from the origin lodging, the transit leg itself (with the mode — train/Eurostar/flight), and if tickets aren't booked, add a clear reminder note like "Book Eurostar London→Paris tickets in advance." Resume planning in the new city the same day after arrival.${isMultiCity?' This is a MULTI-CITY trip — assign each day to the correct city and never plan a stop in a city the group has already left or not yet reached.':''}

function venmoPayUrl(handle, amount, note){
  return `https://venmo.com/?txn=pay&audience=private&recipients=${encodeURIComponent(handle)}`+
    `&amount=${encodeURIComponent((Math.round((Number(amount)||0)*100)/100).toFixed(2))}`+
    `&note=${encodeURIComponent(note||'Trip expenses')}`;
}
function computeSettlements(balMap){
  const creditors=[],debtors=[];
  Object.entries(balMap).forEach(([id,v])=>{ const c=Math.round(v*100); if(c>0)creditors.push({id,c}); else if(c<0)debtors.push({id,c:-c}); });
  creditors.sort((a,b)=>b.c-a.c); debtors.sort((a,b)=>b.c-a.c);
  const res=[]; let ci=0,di=0; let guard=0;
  while(ci<creditors.length&&di<debtors.length&&guard++<999){
    const give=Math.min(creditors[ci].c,debtors[di].c);
    if(give>0) res.push({from:debtors[di].id,to:creditors[ci].id,amount:give/100});
    creditors[ci].c-=give; debtors[di].c-=give;
    if(creditors[ci].c===0)ci++; if(debtors[di].c===0)di++;
  }
  return res;
}

  const add = ()=>{
    const a=parseFloat(amount);
    if(!label.trim() || !(a>=0)){ showToast('Add a label and an amount.','warn'); return; }
    saveItems([...items, {id:uuid(), label:label.trim(), amount:a, day:dayId||null, paidBy:paidBy||null, excluded:[...excluded]}]);
    setLabel(''); setAmount(''); setDayId(''); setExcluded([]); setShowSplit(false);
  };
  const remove = (id)=> saveItems(items.filter(i=>i.id!==id));
  const recordPayment=(from,to,amt)=> savePayments([...payments,{id:uuid(),from,to,amount:amt,ts:Date.now()}]);
  const undoPayment=(id)=> savePayments(payments.filter(p=>p.id!==id));

  // Per-person balances (positive = owed to them; negative = they owe)
  const bal={}; members.forEach(m=>bal[m.id]=0);
  items.forEach(it=>{
    const amt=Number(it.amount)||0;
    const included = members.filter(m=>!(it.excluded||[]).includes(m.id));
    const n = included.length || 1;
    const share = amt/n;
    included.forEach(m=>{ bal[m.id]-=share; });
    if(it.paidBy && bal[it.paidBy]!==undefined) bal[it.paidBy]+=amt;
  });
  payments.forEach(p=>{ if(bal[p.from]!==undefined)bal[p.from]+=Number(p.amount)||0; if(bal[p.to]!==undefined)bal[p.to]-=Number(p.amount)||0; });
  const settlements = members.length>=2 ? computeSettlements(bal) : [];
  const splitInfo=(it)=>{
    const inc=members.filter(m=>!(it.excluded||[]).includes(m.id));
    const n=inc.length||1;
    return members.length ? `${nameOf(it.paidBy)} paid · split ${n} way${n>1?'s':''}${(it.excluded||[]).length?` · ${(it.excluded).map(nameOf).join(', ')} excluded`:''}` : null;
  };

  return (
    <div style={{background:'var(--color-surface)',borderRadius:12,padding:'16px 18px',border:'1px solid var(--color-border)',marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:12}}>
        <p style={{fontSize:'.75rem',color:'var(--color-ink-muted)',letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600}}>💰 Budget</p>
        <span style={{fontFamily:'var(--font-mono)',fontSize:'.7rem',color:'var(--color-ink-muted)'}}>{members.length||trip.travelerCount||0} {(members.length||trip.travelerCount)===1?'person':'people'}</span>
      </div>

      {items.length===0 ? (
        <p style={{fontSize:'.85rem',color:'var(--color-ink-light)',marginBottom:14,lineHeight:1.5}}>Track shared costs, choose who paid, and settle up. Add crew on the Crew tab to split unevenly (e.g. skip a child) and get Venmo/Zelle settle-up links.</p>
      ) : (
        <div style={{marginBottom:14}}>
          {items.map(i=>(
            <div key={i.id} style={{display:'flex',alignItems:'flex-start',gap:8,padding:'9px 0',borderBottom:'1px solid var(--color-border)'}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:'.9rem',fontWeight:500,color:'var(--color-ink)'}}>{i.label}</div>
                <div style={{fontSize:'.7rem',color:'var(--color-ink-muted)'}}>
                  {[i.day&&dayLabel(i.day), splitInfo(i)].filter(Boolean).join(' · ')}
                </div>
              </div>
              <div style={{fontFamily:'var(--font-mono)',fontWeight:500,color:'var(--color-ink)',whiteSpace:'nowrap'}}>{fmt(i.amount)}</div>
              <button aria-label="Remove expense" onClick={()=>remove(i.id)} className="btn btn-ghost btn-sm" style={{color:'var(--color-flag)',padding:'2px 8px'}}>✕</button>
            </div>
          ))}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:12}}>
            <span style={{fontWeight:600,color:'var(--color-ink)'}}>Total</span>
            <span style={{fontFamily:'var(--font-mono)',fontWeight:700,color:'var(--color-ink)'}}>{fmt(total)}</span>
          </div>
        </div>
      )}

      {/* Add expense */}
      <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
        <input className="input" style={{flex:'2 1 140px'}} placeholder="Expense (e.g. Airbnb)" value={label} onChange={e=>setLabel(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')add();}}/>
        <input className="input" style={{flex:'1 1 90px'}} type="number" inputMode="decimal" placeholder="Amount" value={amount} onChange={e=>setAmount(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')add();}}/>
        {days.length>0 && (
          <select className="input" style={{flex:'1 1 110px'}} value={dayId} onChange={e=>setDayId(e.target.value)}>
            <option value="">Whole trip</option>
            {days.map((d,idx)=><option key={d.id} value={d.id}>{d.label||('Day '+(idx+1))}</option>)}
          </select>
        )}
        {members.length>0 && (
          <select className="input" aria-label="Paid by" style={{flex:'1 1 110px'}} value={paidBy} onChange={e=>setPaidBy(e.target.value)}>
            <option value="">Paid by…</option>
            {members.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
        )}
        <button className="btn btn-primary" onClick={add}>Add</button>
      </div>
      {members.length>1 && (
        <div style={{marginTop:8}}>
          <button onClick={()=>setShowSplit(s=>!s)} style={{background:'none',border:'none',padding:0,cursor:'pointer',color:'var(--color-accent)',fontSize:'.78rem',fontWeight:500}}>
            {showSplit?'▾':'▸'} Split options {excluded.length?`(${excluded.length} excluded)`:''}
          </button>
          {showSplit && (
            <div style={{marginTop:8,display:'flex',flexWrap:'wrap',gap:6}}>
              {members.map(m=>{
                const isIn=!excluded.includes(m.id);
                return (
                  <button key={m.id} onClick={()=>setExcluded(ex=>ex.includes(m.id)?ex.filter(x=>x!==m.id):[...ex,m.id])}
                    className={`pill ${isIn?'pill-accent':'pill-neutral'}`} style={{cursor:'pointer',border:'none',opacity:isIn?1:.55}}>
                    {isIn?'✓ ':'✕ '}{m.name}
                  </button>
                );
              })}
              <span style={{width:'100%',fontSize:'.7rem',color:'var(--color-ink-muted)'}}>Tap to exclude someone from this expense's split (e.g. a child). Default splits evenly among everyone checked.</span>
            </div>
          )}
        </div>
      )}

      {/* Balances + settle up */}
      {members.length>=2 && items.length>0 && (
        <div style={{marginTop:16,paddingTop:14,borderTop:'1px solid var(--color-border)'}}>
          <p style={{fontSize:'.72rem',color:'var(--color-ink-muted)',letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,marginBottom:10}}>Who owes what</p>
          {members.map(m=>{
            const v=bal[m.id]||0; const owed=v>0.004, owes=v<-0.004;
            return (
              <div key={m.id} style={{display:'flex',alignItems:'center',gap:8,padding:'4px 0'}}>
                <span style={{width:22,height:22,borderRadius:'50%',background:m.avatarColor,color:'#0E1117',display:'inline-flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'.68rem',flexShrink:0}}>{(m.name||'?').charAt(0).toUpperCase()}</span>
                <span style={{flex:1,minWidth:0,fontSize:'.85rem',color:'var(--color-ink)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.name}</span>
                <span style={{fontFamily:'var(--font-mono)',fontSize:'.82rem',fontWeight:600,color: owed?'var(--color-success)':owes?'var(--color-flag)':'var(--color-ink-muted)'}}>
                  {owed?`is owed ${fmt(v)}`:owes?`owes ${fmt(-v)}`:'settled'}
                </span>
              </div>
            );
          })}
          {settlements.length>0 ? (
            <div style={{marginTop:12}}>
              <p style={{fontSize:'.72rem',color:'var(--color-ink-muted)',letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,marginBottom:8}}>Settle up</p>
              {settlements.map((s,idx)=>{
                const to=members.find(m=>m.id===s.to)||{};
                const note=`${trip.title||'Trip'} settle-up`;
                return (
                  <div key={idx} style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',padding:'7px 0',borderTop:idx?'1px solid var(--color-border)':'none'}}>
                    <span style={{flex:'1 1 auto',fontSize:'.85rem',color:'var(--color-ink)'}}>
                      <strong>{nameOf(s.from)}</strong> → <strong>{nameOf(s.to)}</strong> <span style={{fontFamily:'var(--font-mono)',color:'var(--color-flag)'}}>{fmt(s.amount)}</span>
                    </span>
                    {to.venmo && <a className="btn btn-secondary btn-sm" href={venmoPayUrl(to.venmo,s.amount,note)} target="_blank" rel="noopener noreferrer">Venmo</a>}
                    {to.zelle && <button className="btn btn-secondary btn-sm" onClick={()=>{navigator.clipboard?.writeText(to.zelle).then(()=>showToast(`Zelle for ${to.name}: ${to.zelle} copied`,'info',3500)).catch(()=>showToast(`Zelle: ${to.zelle}`,'info',4000));}}>Zelle</button>}
                    <button className="btn btn-ghost btn-sm" onClick={()=>recordPayment(s.from,s.to,s.amount)}>Mark paid</button>
                  </div>
                );
              })}
            </div>
          ) : (
            <p style={{marginTop:10,fontSize:'.82rem',color:'var(--color-success)'}}>✓ All settled up.</p>
          )}
          {payments.length>0 && (
            <details style={{marginTop:12}}>
              <summary style={{cursor:'pointer',fontSize:'.75rem',color:'var(--color-ink-muted)'}}>Recorded payments ({payments.length})</summary>
              <div style={{marginTop:6}}>
                {payments.map(p=>(
                  <div key={p.id} style={{display:'flex',alignItems:'center',gap:8,fontSize:'.8rem',padding:'4px 0'}}>
                    <span style={{flex:1}}>{nameOf(p.from)} paid {nameOf(p.to)} <span style={{fontFamily:'var(--font-mono)'}}>{fmt(p.amount)}</span></span>
                    <button className="btn btn-ghost btn-sm" style={{color:'var(--color-flag)'}} onClick={()=>undoPayment(p.id)}>Undo</button>
                  </div>
                ))}
              </div>
            </details>
          )}
          <p style={{marginTop:12,fontSize:'.68rem',color:'var(--color-ink-muted)',lineHeight:1.5}}>Venmo opens a prefilled payment; Zelle has no web link, so we copy the recipient's handle for you to paste in your bank app. Add each person's handle on the Crew tab.</p>
        </div>
      )}
      {members.length<2 && items.length>0 && (
        <p style={{marginTop:12,fontSize:'.8rem',color:'var(--color-ink-light)'}}>Add 2+ people on the <strong>Crew</strong> tab to split costs unevenly and get settle-up links.</p>
      )}
    </div>
  );
}

function TripDateEditor({trip, onUpdateTrip}) {
  const [editing, setEditing] = React.useState(false);
  const [startDate, setStartDate] = React.useState(trip.startDate || '');
  const [endDate, setEndDate] = React.useState(trip.endDate || '');
  const [error, setError] = React.useState('');

  // Reset local state if trip prop changes
  React.useEffect(() => {
    setStartDate(trip.startDate || '');
    setEndDate(trip.endDate || '');
  }, [trip.startDate, trip.endDate]);

  const nightCount = trip.startDate && trip.endDate
    ? Math.round((new Date(trip.endDate) - new Date(trip.startDate)) / 86400000)
    : null;

  const save = () => {
    setError('');
    if (!startDate) { setError('Start date is required.'); return; }
    if (!endDate)   { setError('End date is required.'); return; }
    if (endDate < startDate) { setError('End date must be after start date.'); return; }

    // Reconcile days array with new date range
    const allDates = [];
    const cur = new Date(startDate + 'T12:00:00');
    const end = new Date(endDate + 'T12:00:00');
    while (cur <= end) {
      allDates.push(cur.toISOString().slice(0, 10));
      cur.setDate(cur.getDate() + 1);
    }

    const existingDays = trip.days || [];
    // Keep existing days that fall within new range (preserving their content)
    const kept = existingDays.filter(d => allDates.includes(d.date));
    const keptDates = kept.map(d => d.date);
    // Add blank day entries for new dates not already covered
    const newDays = allDates.map(date => {
      const existing = kept.find(d => d.date === date);
      if (existing) return existing;
      return { id: uuid(), date, label: `Day ${allDates.indexOf(date) + 1}`, activities: [], restaurants: [], notes: '', destinationId: trip.destinations?.[0]?.id || '' };
    });

    onUpdateTrip({ ...trip, startDate, endDate, days: newDays });
    setEditing(false);
  };

  const cancel = () => {
    setStartDate(trip.startDate || '');
    setEndDate(trip.endDate || '');
    setError('');
    setEditing(false);
  };

  return (
    <div style={{background:'var(--color-surface)',borderRadius:12,padding:16,border:'1px solid var(--color-border)',marginBottom:20}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:editing?14:0}}>
        <div>
          <p style={{fontSize:'.75rem',color:'var(--color-ink-muted)',letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,marginBottom:2}}>Trip Dates</p>
          {!editing && (
            <p style={{fontSize:'.95rem',fontWeight:500,color:'var(--color-ink)'}}>
              {formatDate(trip.startDate)} – {formatDate(trip.endDate)}
              {nightCount !== null && <span style={{color:'var(--color-ink-light)',fontWeight:400,fontSize:'.85rem'}}> · {nightCount} night{nightCount!==1?'s':''}</span>}
            </p>
          )}
        </div>
        {!editing && (
          <button onClick={()=>setEditing(true)} style={{background:'var(--color-cream-dark)',border:'none',borderRadius:20,padding:'5px 14px',fontSize:'.78rem',fontWeight:500,color:'var(--color-ink-light)',cursor:'pointer'}}>
            ✏️ Edit dates
          </button>
        )}
      </div>

      {editing && (
        <>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:10}}>
            <div>
              <label className="section-label" style={{display:'block',marginBottom:4}}>Start Date</label>
              <input className="input" type="date" value={startDate}
                onChange={e => {
                  const v = e.target.value;
                  setStartDate(v);
                  if (v && endDate && endDate < v) setEndDate('');
                }}/>
            </div>
            <div>
              <label className="section-label" style={{display:'block',marginBottom:4}}>End Date</label>
              <input className="input" type="date" value={endDate}
                min={startDate || undefined}
                onChange={e => setEndDate(e.target.value)}/>
            </div>
          </div>

          {startDate && endDate && endDate >= startDate && (
            <div style={{background:'var(--color-cream-dark)',borderRadius:8,padding:'8px 12px',marginBottom:10,fontSize:'.8rem',color:'var(--color-ink-light)'}}>
              {(() => {
                const n = Math.round((new Date(endDate) - new Date(startDate)) / 86400000);
                const existing = (trip.days||[]).length;
                const msg = existing > 0
                  ? n > existing
                    ? `${n - existing} new day${n-existing!==1?'s':''} will be added to your itinerary.`
                    : n < existing
                    ? `${existing - n} day${existing-n!==1?'s':''} will be removed from your itinerary.`
                    : 'Same number of days — no itinerary changes needed.'
                  : `${n + 1} days total.`;
                return `📅 ${n} night${n!==1?'s':''} · ${msg}`;
              })()}
            </div>
          )}

          {error && <p style={{color:'var(--color-flag)',fontSize:'.78rem',marginBottom:8}}>{error}</p>}

          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-secondary" style={{flex:1,padding:'9px'}} onClick={cancel}>Cancel</button>
            <button className="btn btn-primary" style={{flex:2,padding:'9px'}} onClick={save}>Save dates</button>
          </div>
        </>
      )}
    </div>
  );
}

function Dashboard({trips, onSelectTrip, onNewTrip, cloudUser, setCloudUser}) {
  const [sort, setSort] = React.useState('date');
  const [showPast, setShowPast] = React.useState(false);
  const sorted = [...trips].sort((a,b)=>{
    if(sort==='date') return new Date(a.startDate)-new Date(b.startDate);
    if(sort==='name') return a.title.localeCompare(b.title);
    if(sort==='countdown') return getCountdownInfo(a.startDate).days - getCountdownInfo(b.startDate).days;
    return 0;
  });
  const todayISO = new Date().toISOString().slice(0,10);
  const isPast = t => !!t.endDate && t.endDate < todayISO;
  const upcoming = sorted.filter(t=>!isPast(t));
  const past = sorted.filter(isPast).sort((a,b)=>new Date(b.endDate)-new Date(a.endDate)); // most recent first
  return (
    <div style={{minHeight:'100vh',background:'var(--color-cream)'}}>
      <div className="dashboard-header">
        <div style={{maxWidth:1100,margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'12px 16px'}}>
          <div>
            <h1 className="dashboard-wordmark">Loc<span>a</span>le</h1>

          </div>
        </div>
      </div>
      <div style={{maxWidth:720,margin:'0 auto',padding:'24px 20px 80px'}}>
        {/* Welcome banner — only shown when all trips are demo trips */}
        {trips.length > 0 && trips.every(t=>t.isDemo) && (
          <div className="info-note" style={{marginBottom:20}}>
            <span style={{fontSize:'1.4rem',lineHeight:1}}>👋</span>
            <div>
              <div className="t" style={{fontFamily:'var(--font-display)',fontSize:'1.05rem'}}>Welcome to Locale</div>
              <div className="d">These are <strong>demo trips</strong> so you can explore the app. Tap one to see how it works, then hit <strong>+ New trip</strong> to start planning your own.</div>
            </div>
          </div>
        )}
        {trips.length===0 ? (
          <div style={{textAlign:'center',padding:'80px 20px'}}>
            <div style={{fontSize:'4rem',marginBottom:16}}>🌍</div>

          </div>

            <div className="trip-grid">
              {upcoming.map((trip,i)=>(
                <TripCard key={trip.id} trip={trip} onClick={()=>onSelectTrip(trip.id)} animDelay={i*80}/>

                  <span style={{fontFamily:'var(--font-display)',fontSize:'1.1rem',fontWeight:600,color:'var(--color-ink-light)'}}>📸 Past trips</span>
                  <span className="pill pill-neutral" style={{fontSize:'.7rem'}}>{past.length}</span>
                  <span style={{flex:1,height:1,background:'var(--color-border)'}}/>
                  <span style={{fontSize:'.75rem',color:'var(--color-ink-muted)'}}>{showPast?'▲ Hide':'▼ Show'}</span>
                </button>

                  <div className="trip-grid" style={{opacity:.85}}>

        <button
          onClick={()=>{
            const data = JSON.stringify(trips, null, 2);
            const blob = new Blob([data], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `locale-backup-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
            showToast('Backup downloaded.','info',3000);
          }}
          style={{background:'none',border:'1px solid var(--color-border)',borderRadius:20,padding:'6px 14px',color:'var(--color-ink-muted)',fontSize:'.78rem',cursor:'pointer'}}>
          Download backup
        </button>
        <label style={{background:'none',border:'1px solid var(--color-border)',borderRadius:20,padding:'6px 14px',color:'var(--color-ink-muted)',fontSize:'.78rem',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:4}}>

            const file = e.target.files?.[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
              try {
                const imported = JSON.parse(ev.target.result);
                if(!Array.isArray(imported)) throw new Error('Not an array');
                const restored = imported.map(t=>normalizeTrip({...t, isDemo:false}));
                const existing = trips.filter(t=>!t.isDemo);
                const merged = [...existing, ...restored.filter(r=>!existing.find(e=>e.id===r.id))];
                saveTrips(merged);
                window.location.reload();
              } catch(err) {
                showToast('Could not restore — invalid backup file.','error',5000);
              }
            };
            reader.readAsText(file);
            e.target.value = '';
          }}/>
        </label>
      </div>
      {/* FAB removed — use "+ New trip" button in header */}
    </div>
  );
}

// ── Share / Import helpers ────────────────────────────────────────────────
function encodeTrip(trip) {
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(trip)))); } catch(e) { return null; }
}
function decodeTrip(str) {
  try { return JSON.parse(decodeURIComponent(escape(atob(str)))); } catch(e) { return null; }
}
function getSharedTripFromHash() {
  const hash = window.location.hash;
  const m = hash.match(/[#&]trip=([A-Za-z0-9+/=]+)/);
  return m ? decodeTrip(m[1]) : null;
}

function App() {
  const [trips, setTrips] = React.useState(()=>loadTrips());
  const [view, setView] = React.useState('dashboard');
  const [activeTripId, setActiveTripId] = React.useState(null);
  const [showNew, setShowNew] = React.useState(false);
  const [offline, setOffline] = React.useState(!navigator.onLine);
  const [installPrompt, setInstallPrompt] = React.useState(null);
  const [showInstall, setShowInstall] = React.useState(false);
  const [sharedTrip, setSharedTrip] = React.useState(()=>getSharedTripFromHash());

  React.useEffect(()=>{
    const goOffline = ()=>setOffline(true);
    const goOnline = ()=>setOffline(false);
    window.addEventListener('offline',goOffline);
    window.addEventListener('online',goOnline);
    const handler = e=>{e.preventDefault();setInstallPrompt(e);setShowInstall(true);};
    window.addEventListener('beforeinstallprompt',handler);
    return ()=>{
      window.removeEventListener('offline',goOffline);
      window.removeEventListener('online',goOnline);
      window.removeEventListener('beforeinstallprompt',handler);
    };
  },[]);

  const [cloudUser, setCloudUser] = React.useState(null);
  React.useEffect(()=>{
    let active=true;
    const c=sb();
    async function syncIn(){
      const u=await cloudGetUser(); if(!active) return;
      setCloudUser(u);
      if(!u) return;
      const pulled=await cloudPull(); if(!active||!pulled) return;
      setTrips(prev=>{
        const byId={};
        prev.filter(t=>!t.isDemo).forEach(t=>{ byId[t.id]=t; });
        (pulled.trips||[]).map(normalizeTrip).forEach(t=>{ byId[t.id]=t; }); // cloud wins
        const merged=Object.values(byId);
        saveTrips(merged);
        cloudPush(merged); // push any local-only trips up
        return merged;
      });
      showToast('Synced across your devices ✓','info',3000);
    }
    syncIn();
    let sub=null;
    if(c){
      const { data } = c.auth.onAuthStateChange((_evt, session)=>{
        const u=session?.user;
        if(u && !u.is_anonymous && u.email) syncIn();
        else if(active) setCloudUser(null);
      });
      sub=data?.subscription;
    }
    return ()=>{ active=false; if(sub) sub.unsubscribe(); };
  },[]);

  const saveAndSet = (newTrips) => { setTrips(newTrips); saveTrips(newTrips); if(cloudUser) cloudPushDebounced(newTrips); };

  const handleNewTrip = (trip) => {
    try {
      const normalized = normalizeTrip(trip);
      const updated = [...trips, normalized];
      saveAndSet(updated);
      setShowNew(false);
      setActiveTripId(normalized.id);
      setView('detail');
    } catch(err) {
      alert('Save failed: ' + err.message);
      console.error('handleNewTrip error:', err);
    }
  };

  const handleUpdateTrip = (updatedTrip) => {
    const updated = trips.map(t=>t.id===updatedTrip.id?updatedTrip:t);
    saveAndSet(updated);
  };

  const handleDeleteTrip = (id) => {
    saveAndSet(trips.filter(t=>t.id!==id));
    setView('dashboard');
  };

  const handleAcceptSharedTrip = (trip) => {
    const fresh = {...normalizeTrip(trip), id: uuid()};
    const updated = [...trips, fresh];
    saveAndSet(updated);
    setSharedTrip(null);
    window.location.hash = '';
    setActiveTripId(fresh.id);
    setView('detail');
  };

  const handleInstall = async () => {
    if(!installPrompt) return;
    installPrompt.prompt();
    const {outcome} = await installPrompt.userChoice;
    if(outcome==='accepted') setShowInstall(false);
  };

  const activeTrip = trips.find(t=>t.id===activeTripId);

  return (
    <div>
      {sharedTrip && (
        <SharedTripBanner
          trip={sharedTrip}
          onAccept={handleAcceptSharedTrip}
          onDismiss={()=>{ setSharedTrip(null); window.location.hash=''; }}
        />
      )}
      {offline && (
        <div className="offline-banner">📡 Offline — your trips are saved and fully accessible</div>
      )}
      {showInstall && (
        <div className="install-banner">
          <span>📲 Add Locale to your home screen for the best experience</span>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-primary" style={{padding:'6px 14px',fontSize:'.8rem'}} onClick={handleInstall}>Install</button>
            <button className="btn btn-ghost" style={{padding:'6px 14px',fontSize:'.8rem'}} onClick={()=>setShowInstall(false)}>Not now</button>
          </div>
        </div>
      )}
      {view==='dashboard' && (
        <Dashboard trips={trips} cloudUser={cloudUser} setCloudUser={setCloudUser} onSelectTrip={(id)=>{setActiveTripId(id);setView('detail');}} onNewTrip={()=>setShowNew(true)}/>
      )}
      {view==='detail' && activeTrip && (
        <TripDetail trip={activeTrip} onBack={()=>setView('dashboard')} onUpdateTrip={handleUpdateTrip} onDelete={handleDeleteTrip}/>
      )}
      {showNew && <NewTripSheet onClose={()=>setShowNew(false)} onSave={handleNewTrip}/>}

      {/* ── Bug Report Button ── */}
      <BugReportButton currentView={view}/>
    </div>
  );
}
