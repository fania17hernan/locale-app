function App() {
  const [trips, setTrips] = React.useState(()=>loadTrips());
  const [view, setView] = React.useState('dashboard');
  const [activeTripId, setActiveTripId] = React.useState(null);
  const [showNew, setShowNew] = React.useState(false);
  const [offline, setOffline] = React.useState(!navigator.onLine);
  const [installPrompt, setInstallPrompt] = React.useState(null);
  const [showInstall, setShowInstall] = React.useState(false);
  const [sharedTrip, setSharedTrip] = React.useState(()=>getSharedTripFromHash());
  React.useEffect(()=>{ resolveShortShareLink().then(t=>{ if(t) setSharedTrip(t); }); },[]);
  const [showDrawer, setShowDrawer] = React.useState(false); // IA Phase 2a: trips drawer
  // First-run welcome: only for fresh users (demo trips only), never over an invite link
  const [showWelcome, setShowWelcome] = React.useState(()=>{
    try { return !localStorage.getItem('locale_welcome_seen') && !getSharedTripFromHash() && !/[#&]s=/.test(window.location.hash) && loadTrips().every(t=>t.isDemo); } catch(e){ return false; }
  });
  const dismissWelcome = ()=>{ try{ localStorage.setItem('locale_welcome_seen','1'); }catch(e){} setShowWelcome(false); };

  React.useEffect(()=>{
    const goOffline = ()=>setOffline(true);
    const goOnline = ()=>setOffline(false);
    window.addEventListener('offline',goOffline);
    window.addEventListener('online',goOnline);
    const handler = e=>{e.preventDefault();setInstallPrompt(e);setShowInstall(true);};
    window.addEventListener('beforeinstallprompt',handler);
    return ()=>{
      window.removeEventListener('offline',goOffline);
      window.removeEventListener('online',goOnline);
      window.removeEventListener('beforeinstallprompt',handler);
    };
  },[]);

  const [cloudUser, setCloudUser] = React.useState(null);
  React.useEffect(()=>{
    let active=true;
    const c=sb();
    let tripsChannel=null;

    // Cloud-wins merge, shared by the initial pull and every live update.
    const mergeCloudTrips = (pulled) => {
      if(!pulled) return null;
      let merged=null;
      setTrips(prev=>{
        const byId={};
        prev.filter(t=>!t.isDemo).forEach(t=>{ byId[t.id]=t; });
        // Deletion propagation: a local trip tagged _ownerId was synced before · if
        // the cloud no longer returns it, it was deleted on another device (or our
        // membership was revoked). Drop it instead of resurrecting it via the
        // backstop push. Never-synced local trips (no _ownerId tag) are kept.
        const cloudIds=new Set((pulled.trips||[]).map(t=>t.id));
        Object.keys(byId).forEach(id=>{ if(byId[id]._ownerId && !cloudIds.has(id)) delete byId[id]; });
        (pulled.trips||[]).map(normalizeTrip).forEach(t=>{ byId[t.id]=t; }); // cloud wins
        merged=Object.values(byId);
        saveTrips(merged);
        return merged;
      });
      return merged;
    };

    // Live sync: when another device changes this row, pull + merge automatically ·
    // no manual refresh or re-auth needed. Realtime is included in Supabase's tier
    // (no extra cost); RLS (owner-only) still governs who can receive the event.
    // D4: this used to filter on user_id=eq.<me>, which meant a member never
    // received any event at all (they do not own the row) and an organiser only
    // ever heard their own writes. Subscribing without a filter lets Postgres send
    // every trips change; RLS still decides what actually reaches this client, so
    // we only hear about rows we can already read (ours, plus ones we are a member
    // of). That is exactly the set we want to react to.
    const subscribeRealtime = (uid) => {
      if(!c || tripsChannel) return;
      tripsChannel = c.channel('trips-sync-'+uid)
        .on('postgres_changes', { event:'*', schema:'public', table:'trips' }, async ()=>{
          if(!active) return;
          const pulled = await cloudPull();
          if(active) mergeCloudTrips(pulled);
        })
        .subscribe();
    };

    async function syncIn(){
      const u=await cloudGetUser(); if(!active) return;
      setCloudUser(u);
      if(!u) return;
      syncTasteProfile(); // reconcile taste-profile quiz answers too; independent of trip sync below
      // NOTE: supabase-js v2 query/rpc builders are thenable but do NOT implement
      // .catch()/.finally() until awaited · calling .catch() directly throws
      // "not a function" synchronously, which aborted syncIn() before it ever
      // reached cloudPull() below. Wrap in an async IIFE + try/catch instead.
      (async()=>{ try{ await c?.rpc('claim_pending_trip_invites'); }catch(e){} })(); // link any pending Crew invites to this login (Phase 4)
      // P0a · claim device-local trips to THIS account BEFORE pulling, so the
      // cloud-wins merge below can't clobber a locally-built trip with a thinner
      // or older cloud row of the same id. cloudPush tags them to this uid and
      // merges members' server-side fields; the pull then returns the good,
      // re-owned copy. Guarded so a failure here never blocks the normal sync.
      try{
        const toClaim=unsyncedLocalTrips(loadTrips());
        if(toClaim.length){ await cloudPush(toClaim); }
      }catch(e){}
      const pulled=await cloudPull(); if(!active) return;
      const merged=mergeCloudTrips(pulled);
      if(merged) cloudPush(merged); // backstop: push up anything that never made it to the cloud
      showToast('Synced across your devices ✓','info',3000);
      subscribeRealtime(u.id);
      // Resume an invite that was interrupted by the magic-link round trip: the
      // redirect drops the URL hash, so without this the invitee signs in and lands
      // on the dashboard with no idea they still need to join.
      try{
        const pend=JSON.parse(localStorage.getItem('locale_pending_invite')||'null');
        if(pend && pend.tripId && Date.now()-pend.t < 3600000){
          localStorage.removeItem('locale_pending_invite');
          const target=(merged||[]).find(t=>t.id===pend.tripId);
          if(target){ setActiveTripId(target.id); setView('detail'); showToast('You are in · welcome aboard ✓','info',4000); }
          else showToast('Signed in, but no invite was found for this email. Ask the organiser to invite this exact address.','warn',8000);
        } else if(pend){ localStorage.removeItem('locale_pending_invite'); }
      }catch(e){}
    }
    track('app_open', { version: APP_VERSION, standalone: (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||false, width: window.innerWidth });
    // Global error telemetry (capped at 5/session)
    if(window.__errTracked===undefined){
      window.__errTracked=0;
      const errH=(msg,srcKind)=>{ if(window.__errTracked>=5) return; window.__errTracked++; track('client_error',{ message:String(msg||'unknown').slice(0,300), src:srcKind, view:'global' }); };
      window.addEventListener('error', e=>errH(e.message,'window'));
      window.addEventListener('unhandledrejection', e=>errH((e.reason&&e.reason.message)||e.reason,'promise'));
    }
    syncIn();
    let sub=null;
    if(c){
      const { data } = c.auth.onAuthStateChange((_evt, session)=>{
        const u=session?.user;
        if(u && !u.is_anonymous && u.email) syncIn();
        else if(active) setCloudUser(null);
      });
      sub=data?.subscription;
    }
    return ()=>{ active=false; if(sub) sub.unsubscribe(); if(tripsChannel && c) c.removeChannel(tripsChannel); };
  },[]);

  // Not gated on cloudUser state anymore · that gate was the bug: a trip created
  // right after page load, before the async cloudUser check resolved, would
  // silently never push to the cloud. cloudPushDebounced/cloudPush already check
  // the real signed-in state themselves and no-op safely if signed out.
  const saveAndSet = (newTrips) => { setTrips(newTrips); saveTrips(newTrips); cloudPushDebounced(newTrips); };

  const handleNewTrip = (trip) => {
    try {
      const normalized = normalizeTrip(trip);
      const updated = [...trips, normalized];
      saveAndSet(updated);
      track('trip_created', { stage: normalized.planningStage||null, destinations: (normalized.destinations||[]).length });
      setShowNew(false);
      setActiveTripId(normalized.id);
      setView('detail');
    } catch(err) {
      alert('Save failed: ' + err.message);
      console.error('handleNewTrip error:', err);
    }
  };

  const handleUpdateTrip = (updatedTrip) => {
    const updated = trips.map(t=>t.id===updatedTrip.id?updatedTrip:t);
    saveAndSet(updated);
  };

  const handleDeleteTrip = (id) => {
    addTombstone(id); // explicit intent · cloudPush only deletes what is tombstoned
    saveAndSet(trips.filter(t=>t.id!==id));
    setView('dashboard');
  };

  const [inviteBusy,setInviteBusy]=React.useState(false);

  // A read-only copy. Honest fallback for someone with no invite (or who declines
  // to sign in): a detached snapshot with its own id, which is what this has always
  // really been. It is no longer presented as "joining".
  const handleCopySharedTrip = (trip) => {
    const fresh = {...normalizeTrip(trip), id: uuid(), _snapshotOf: trip.id||null};
    saveAndSet([...trips, fresh]);
    setSharedTrip(null);
    window.location.hash = '';
    setActiveTripId(fresh.id);
    setView('detail');
    showToast('Saved as a read-only copy · changes will not reach the organiser.','info',6000);
  };

  // Actually join: claim the invite tied to this signed-in email, then pull so the
  // real shared trip (owned by the organiser) lands in the list.
  const handleJoinSharedTrip = async (trip) => {
    setInviteBusy(true);
    try{
      const c=sb();
      let claimed=0;
      try{ const { data } = await c.rpc('claim_pending_trip_invites'); claimed=Number(data)||0; }catch(e){}
      const pulled = await cloudPull();
      const cloudTrips = (pulled&&pulled.trips)||[];
      const target = cloudTrips.find(x=>x.id===trip.id);
      if(target){
        const byId={}; trips.forEach(t=>{ byId[t.id]=t; });
        cloudTrips.map(normalizeTrip).forEach(t=>{ byId[t.id]=t; });
        const merged=Object.values(byId);
        setTrips(merged); saveTrips(merged);
        setSharedTrip(null); window.location.hash='';
        setActiveTripId(target.id); setView('detail');
        showToast(claimed>0?'You are in · welcome aboard ✓':'Opened the shared trip ✓','info',4000);
      } else {
        // Signed in, but this email has no invite for this trip. Be explicit rather
        // than silently handing back a copy that will never sync.
        showToast('No invite found for this email. Ask the organiser to invite this address, or save a read-only copy.','warn',7000);
      }
    }catch(e){
      showToast('Could not join · try again.','error');
    }
    finally{ setInviteBusy(false); }
  };

  // Stash the invite so the join resumes after sign-in. Still needed with codes:
  // a code entered in a fresh tab (or an old-style link redirect) drops the hash.
  const handleInviteSignIn = async (email, trip) => {
    setInviteBusy(true);
    try{
      try{ localStorage.setItem('locale_pending_invite', JSON.stringify({tripId:trip.id, t:Date.now()})); }catch(e){}
      await cloudSignIn(email);
      showToast('Check your email for the 6-digit code, then sign in with ☁ Sync to land right here.','info',8000);
    }catch(e){
      showToast('Could not send the code · try again.','error');
    }
    finally{ setInviteBusy(false); }
  };

  const handleInstall = async () => {
    if(!installPrompt) return;
    installPrompt.prompt();
    const {outcome} = await installPrompt.userChoice;
    if(outcome==='accepted') setShowInstall(false);
  };

  const activeTrip = trips.find(t=>t.id===activeTripId);

  return (
    <div>
      <a
        href="#main-content"
        onClick={e=>{ e.preventDefault(); const m=document.getElementById('main-content'); if(m){ m.setAttribute('tabindex','-1'); m.focus(); } }}
        onFocus={e=>{ e.target.style.top='8px'; }}
        onBlur={e=>{ e.target.style.top='-56px'; }}
        style={{position:'fixed',left:8,top:-56,zIndex:10000,background:'#161B24',color:'#F2EFEA',padding:'10px 16px',borderRadius:8,textDecoration:'none',border:'1px solid #28303E',transition:'top .15s',fontSize:'.9rem'}}
      >Skip to content</a>
      {sharedTrip && (
        <SharedTripBanner
          trip={sharedTrip}
          signedInEmail={cloudUser&&cloudUser.email}
          busy={inviteBusy}
          onJoin={handleJoinSharedTrip}
          onCopy={handleCopySharedTrip}
          onSignIn={handleInviteSignIn}
          onDismiss={()=>{ setSharedTrip(null); window.location.hash=''; }}
        />
      )}
      {showWelcome && !sharedTrip && (
        <WelcomeScreen
          onCreate={()=>{ dismissWelcome(); setShowNew(true); }}
          onOpenInvite={(t)=>{ dismissWelcome(); setSharedTrip(t); }}
          onDismiss={dismissWelcome}
        />
      )}
      {showDrawer && (
        <TripsDrawer
          trips={trips}
          activeId={view==='detail'?activeTripId:null}
          onClose={()=>setShowDrawer(false)}
          onSelect={(id)=>{ setActiveTripId(id); setView('detail'); setShowDrawer(false); window.scrollTo({top:0}); }}
          onNew={()=>{ setShowDrawer(false); setShowNew(true); }}
          onAll={()=>{ setView('dashboard'); setShowDrawer(false); }}
        />
      )}
      {offline && (
        <div className="offline-banner">📡 Offline · your trips are saved and fully accessible</div>
      )}
      {showInstall && (
        <div className="install-banner">
          <span>📲 Add Locale to your home screen for the best experience</span>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-primary" style={{padding:'6px 14px',fontSize:'.8rem'}} onClick={handleInstall}>Install</button>
            <button className="btn btn-ghost" style={{padding:'6px 14px',fontSize:'.8rem'}} onClick={()=>setShowInstall(false)}>Not now</button>
          </div>
        </div>
      )}
      <main id="main-content">
      {view==='dashboard' && (
        <Dashboard trips={trips} cloudUser={cloudUser} setCloudUser={setCloudUser} onSelectTrip={(id)=>{setActiveTripId(id);setView('detail');}} onNewTrip={()=>setShowNew(true)} onOpenDrawer={()=>setShowDrawer(true)}/>
      )}
      {view==='detail' && activeTrip && (
        <TripDetail trip={activeTrip} onBack={()=>setView('dashboard')} onUpdateTrip={handleUpdateTrip} onDelete={handleDeleteTrip} onOpenDrawer={()=>setShowDrawer(true)}/>
      )}
      </main>
      {showNew && <NewTripSheet onClose={()=>setShowNew(false)} onSave={handleNewTrip}/>}

      {/* ── Bug Report Button ── */}
      <BugReportButton currentView={view}/>
    </div>
  );
}

// ── Bug Report Button ────────────────────────────────────────────────────────
function BugReportButton({ currentView }) {
  const [open, setOpen] = React.useState(false);
  const [desc, setDesc] = React.useState('');
  const [sent, setSent] = React.useState(false);
  const [sentVia, setSentVia] = React.useState('db'); // 'db' = saved to Locale, 'mail' = mailto fallback
  const dlgRef = React.useRef(null);
  useModalA11y(dlgRef, ()=>setOpen(false), open);

  const deviceInfo = (() => {
    try {
      return [
        `App: Locale v${APP_VERSION}`,
        `Screen: ${currentView}`,
        `UA: ${navigator.userAgent}`,
        `Viewport: ${window.innerWidth}×${window.innerHeight}`,
        `Date: ${new Date().toISOString()}`,
      ].join('\n');
    } catch(_) { return 'Device info unavailable'; }
  })();

  const errorLog = (() => {
    try {
      const log = JSON.parse(localStorage.getItem('locale_error_log') || '[]');
      if (!log.length) return 'No errors logged.';
      return log.slice(0, 5).map(e => `[${e.time}] ${e.type}: ${e.message}`).join('\n');
    } catch(_) { return 'Could not read error log.'; }
  })();

  const sendReport = async () => {
    const message = (desc || '').trim() || '(no description provided)';
    // Preferred path: save to the feedback table (insert-only RLS) so it shows
    // up in the ops dashboard. Falls back to the original mailto if that fails.
    try {
      const c = sb();
      if (!c) throw new Error('offline');
      let email = null;
      try { const u = await cloudGetUser(); email = u?.email || null; } catch(_) {}
      const { error } = await c.from('feedback').insert({
        message,
        email,
        context: {
          view: currentView, version: APP_VERSION,
          ua: (navigator.userAgent||'').slice(0,300),
          viewport: window.innerWidth + 'x' + window.innerHeight,
          errors: errorLog.slice(0, 800),
        },
      });
      if (error) throw error;
      setSentVia('db');
      setSent(true);
      setTimeout(() => { setOpen(false); setSent(false); setDesc(''); }, 2500);
      return;
    } catch(_) { /* fall through to mailto */ }
    const body = [
      '## Feedback',
      message,
      '',
      '## Device Info',
      deviceInfo,
      '',
      '## Recent Error Log',
      errorLog,
    ].join('\n');
    const mailto = `mailto:s.borboa9@gmail.com?subject=${encodeURIComponent(`[Locale Feedback] v${APP_VERSION} – ${currentView} screen`)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
    setSentVia('mail');
    setSent(true);
    setTimeout(() => { setOpen(false); setSent(false); setDesc(''); }, 2500);
  };

  return (
    <>
      {/* Floating button */}
      <button
        onClick={() => setOpen(true)}
        title="Feedback & bug report"
        className="feedback-fab"
        style={{
          position: 'fixed', bottom: 24, right: 16, zIndex: 9000,
          width: 40, height: 40, borderRadius: '50%',
          background: 'var(--color-surface)', border: '1px solid var(--color-border)',
          boxShadow: '0 2px 10px rgba(0,0,0,.12)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '1rem', cursor: 'pointer', color: 'var(--color-ink-light)',
          transition: 'transform .15s',
        }}
        onMouseEnter={e => e.currentTarget.style.transform='scale(1.1)'}
        onMouseLeave={e => e.currentTarget.style.transform='scale(1)'}
      >💬</button>

      {/* Modal */}
      {open && (
        <div ref={dlgRef} role="dialog" aria-modal="true" aria-label="Feedback and bug report" style={{
          position: 'fixed', inset: 0, zIndex: 9100,
          background: 'rgba(0,0,0,.6)', backdropFilter: 'blur(2px)', WebkitBackdropFilter: 'blur(2px)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
          padding: '0 0 env(safe-area-inset-bottom,0)',
        }} onClick={e=>{ if(e.target===e.currentTarget) setOpen(false); }}>
          <div style={{
            background: 'var(--color-surface)', borderTop: '1px solid var(--color-border)', borderRadius: '20px 20px 0 0',
            width: '100%', maxWidth: 480, padding: '24px 20px 32px',
            boxShadow: '0 -8px 40px rgba(0,0,0,.4)',
          }}>
            {sent ? (
              <div style={{textAlign:'center',padding:'20px 0'}}>
                <div style={{fontSize:'2rem',marginBottom:8}}>✅</div>
                <p style={{fontWeight:600,color:'var(--color-ink)'}}>Thanks! Feedback sent.</p>
                <p style={{fontSize:'.82rem',color:'var(--color-ink-light)',marginTop:4}}>{sentVia==='mail' ? 'Your email app will open with the details pre-filled.' : 'We got it · thanks for helping make Locale better.'}</p>
              </div>
            ) : (
              <>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                  <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.1rem',fontWeight:600,color:'var(--color-ink)'}}>💬 Feedback & bugs</h3>
                  <button onClick={()=>setOpen(false)} style={{background:'none',border:'none',fontSize:'1.2rem',cursor:'pointer',color:'var(--color-ink-light)',lineHeight:1}}>×</button>
                </div>

                <label className="section-label" style={{display:'block',marginBottom:6}}>What's on your mind?</label>
                <textarea
                  className="input"
                  rows={4}
                  placeholder="An idea, something confusing, or a bug · all welcome…"
                  value={desc}
                  onChange={e=>setDesc(e.target.value)}
                  style={{resize:'vertical',marginBottom:12,fontSize:'.875rem',lineHeight:1.5}}
                />

                <div style={{background:'var(--color-canvas)',border:'1px solid var(--color-border)',borderRadius:8,padding:'10px 12px',marginBottom:16,fontSize:'.72rem',color:'var(--color-ink-muted)',fontFamily:'monospace',lineHeight:1.6,whiteSpace:'pre-wrap',wordBreak:'break-all'}}>
                  <strong style={{fontFamily:'var(--font-body)',fontSize:'.7rem',color:'var(--color-ink-light)',letterSpacing:'.05em',textTransform:'uppercase'}}>Auto-attached info</strong>{'\n'}{deviceInfo}
                </div>

                <button className="btn btn-primary" style={{width:'100%'}} onClick={sendReport}>
                  Send feedback →
                </button>
                <p style={{textAlign:'center',fontSize:'.72rem',color:'var(--color-ink-muted)',marginTop:8}}>Goes straight to the Locale team</p>
              </>
            )}
          </div>
        </div>
      )}
    </>
  );
}

// ── Error Boundary ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error('Locale caught an error:', error, info);
    try{ track('client_error', { message: String(error?.message||error).slice(0,300), src:'boundary', view:'render' }); }catch(_){}
    // Store error in localStorage for debugging
    try {
      const log = JSON.parse(localStorage.getItem('locale_error_log') || '[]');
      log.unshift({ ts: new Date().toISOString(), msg: error?.message, stack: error?.stack?.slice(0,500) });
      localStorage.setItem('locale_error_log', JSON.stringify(log.slice(0, 10)));
    } catch(e) {}
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{minHeight:'100dvh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px',fontFamily:'var(--font-body)',textAlign:'center',background:'var(--color-cream)'}}>
          <div style={{fontSize:'2.5rem',marginBottom:16}}>😔</div>
          <h2 style={{fontFamily:'var(--font-display)',fontSize:'1.5rem',fontWeight:600,marginBottom:8,color:'var(--color-ink)'}}>Something went wrong</h2>
          <p style={{color:'var(--color-ink-light)',fontSize:'.9rem',maxWidth:340,lineHeight:1.6,marginBottom:24}}>
            Don't worry · your trips are safe in local storage. Try refreshing the page. If the problem persists, tap below to reset.
          </p>
          <div style={{display:'flex',flexDirection:'column',gap:10,width:'100%',maxWidth:280}}>
            <button
              style={{background:'var(--color-accent)',color:'#fff',border:'none',borderRadius:10,padding:'12px 20px',fontSize:'.9rem',cursor:'pointer',fontFamily:'var(--font-body)'}}
              onClick={()=>window.location.reload()}>
              🔄 Refresh the app
            </button>
            <button
              style={{background:'transparent',color:'var(--color-ink-muted)',border:'1px solid var(--color-border)',borderRadius:10,padding:'10px 20px',fontSize:'.85rem',cursor:'pointer',fontFamily:'var(--font-body)'}}
              onClick={()=>{
                const log = JSON.parse(localStorage.getItem('locale_error_log')||'[]');
                const body = encodeURIComponent('Error log:\n\n' + JSON.stringify(log, null, 2));
                window.location.href = 'mailto:?subject=Locale%20Error%20Report&body=' + body;
              }}>
              📧 Send error report
            </button>
          </div>
          {this.state.error?.message && (
            <p style={{marginTop:20,fontSize:'.75rem',color:'var(--color-ink-muted)',fontFamily:'monospace',maxWidth:400,wordBreak:'break-all'}}>
              {this.state.error.message}
            </p>
          )}
        </div>
      );
    }
    return this.props.children;
  }
}

// ── Inline Test Suite ───────────────────────────────────────────────────────
(function runTests() {
  let passed = 0, failed = 0;
  function assert(label, condition) {
    if (condition) {
      passed++;
    } else {
      failed++;
      console.error(`❌ TEST FAILED: ${label}`);
      try {
        const log = JSON.parse(localStorage.getItem('locale_error_log') || '[]');
        log.unshift({ time: new Date().toISOString(), type: 'test_failure', message: label });
        localStorage.setItem('locale_error_log', JSON.stringify(log.slice(0, 50)));
      } catch(_) {}
    }
  }

  // uuid
  const id1 = uuid(), id2 = uuid();
  assert('uuid returns string', typeof id1 === 'string');
  assert('uuid has length 36', id1.length === 36);
  assert('uuid is unique', id1 !== id2);
  assert('uuid matches pattern', /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(id1));

  // normalizeTrip
  const bare = { title: 'Test Trip', startDate: '2026-09-01', endDate: '2026-09-05' };
  const normed = normalizeTrip(bare);
  assert('normalizeTrip sets schemaVersion', normed.schemaVersion === SCHEMA_VERSION);
  assert('normalizeTrip preserves title', normed.title === 'Test Trip');
  assert('normalizeTrip adds empty destinations array', Array.isArray(normed.destinations));
  assert('normalizeTrip adds empty days array', Array.isArray(normed.days));
  assert('normalizeTrip adds collaborators array', Array.isArray(normed.collaborators));
  assert('normalizeTrip adds lodging array', Array.isArray(normed.lodging));
  assert('normalizeTrip adds flights array', Array.isArray(normed.flights));

  // normalizeTrip legacy fields
  const legacy = { name: 'Old Trip', travelPeriod: { depart: '2026-10-01', return: '2026-10-07' } };
  const normedLegacy = normalizeTrip(legacy);
  assert('normalizeTrip maps name→title', normedLegacy.title === 'Old Trip');
  assert('normalizeTrip maps travelPeriod.depart→startDate', normedLegacy.startDate === '2026-10-01');
  assert('normalizeTrip maps travelPeriod.return→endDate', normedLegacy.endDate === '2026-10-07');

  // generateChecklist
  const cl = generateChecklist({ title: 'Paris Trip', startDate: '2026-09-15', endDate: '2026-09-20', destinations: [{ city: 'Paris', country: 'France' }] });
  assert('generateChecklist returns array', Array.isArray(cl));
  assert('generateChecklist has items', cl.length > 0);
  assert('generateChecklist items have id', cl.every(c => c.id));
  assert('generateChecklist items have label', cl.every(c => typeof c.label === 'string'));
  assert('generateChecklist items have completed bool', cl.every(c => typeof c.completed === 'boolean'));
  assert('generateChecklist items have category', cl.every(c => c.category));

  // buildPackingDefaults
  const packing = buildPackingDefaults({ startDate: '2026-09-15', endDate: '2026-09-20', destinations: [{ city: 'London', country: 'UK' }] });
  assert('buildPackingDefaults returns array', Array.isArray(packing));
  assert('buildPackingDefaults has items', packing.length > 0);
  assert('buildPackingDefaults items have name', packing.every(p => typeof p.name === 'string'));

  // CITY_TO_COUNTRY lookup
  assert('CITY_TO_COUNTRY has london→GB', CITY_TO_COUNTRY['london']?.countryCode === 'GB');
  assert('CITY_TO_COUNTRY has paris→FR', CITY_TO_COUNTRY['paris']?.countryCode === 'FR');

  // CITY_DATA lookup
  assert('CITY_DATA has GB entry', !!CITY_DATA['GB']);
  assert('CITY_DATA has FR entry', !!CITY_DATA['FR']);
  assert('CITY_DATA.GB has transport', typeof CITY_DATA['GB'].transport === 'string');

  // CITY_LOCAL_TIPS
  assert('CITY_LOCAL_TIPS has london', !!CITY_LOCAL_TIPS['london']);
  assert('CITY_LOCAL_TIPS has paris', !!CITY_LOCAL_TIPS['paris']);
  assert('CITY_LOCAL_TIPS london is object', typeof CITY_LOCAL_TIPS['london'] === 'object' && !Array.isArray(CITY_LOCAL_TIPS['london']));

  // ── NEW: CITY_SEARCH_INDEX ────────────────────────────────────────────────
  assert('CITY_SEARCH_INDEX is array', Array.isArray(CITY_SEARCH_INDEX));
  assert('CITY_SEARCH_INDEX has entries', CITY_SEARCH_INDEX.length > 50);
  assert('CITY_SEARCH_INDEX entries have required fields', CITY_SEARCH_INDEX.every(c =>
    typeof c.display === 'string' && typeof c.city === 'string' &&
    typeof c.countryCode === 'string' && typeof c.country === 'string'
  ));
  // Portland disambiguation · both OR and ME must exist
  const portlands = CITY_SEARCH_INDEX.filter(c => c.city === 'Portland');
  assert('CITY_SEARCH_INDEX has Portland OR', portlands.some(c => c.region === 'OR'));
  assert('CITY_SEARCH_INDEX has Portland ME', portlands.some(c => c.region === 'ME'));
  // No duplicate display strings
  const displays = CITY_SEARCH_INDEX.map(c => c.display);
  assert('CITY_SEARCH_INDEX has no duplicate display strings', displays.length === new Set(displays).size);

  // ── NEW: searchCities ─────────────────────────────────────────────────────
  assert('searchCities returns empty array for short query', searchCities('p').length === 0);
  assert('searchCities returns empty array for empty string', searchCities('').length === 0);
  const porRes = searchCities('portland');
  assert('searchCities finds Portland results', porRes.length >= 2);
  assert('searchCities results cap at 6', searchCities('san').length <= 6);
  assert('searchCities matches on region (OR)', searchCities('portland or').some(c => c.region === 'OR'));
  const lonRes = searchCities('london');

  };

  assert('isWetDay: dry codes are never wet', !isWetDay({code:0,pop:90,precip:5}) && !isWetDay({code:2,pop:80,precip:1}));
  assert('isWetDay: null-safe', !isWetDay(null) && !isWetDay(undefined));
  assert('isOutdoorStop: category wins', isOutdoorStop({name:'X',category:'outdoor'}) && !isOutdoorStop({name:'X',category:'museum'}));
  assert('isOutdoorStop: keywords catch uncategorized stops', isOutdoorStop({name:'Borough Market stroll'}) && isOutdoorStop({name:'Hyde Park picnic'}));
  assert('isOutdoorStop: indoor words override an outdoor category', !isOutdoorStop({name:'Tate Modern gallery',category:'outdoor'}));
  assert('isOutdoorStop: unknown text is not outdoor', !isOutdoorStop({name:'Something vague'}) && !isOutdoorStop(null));
  assert('swapStopIn replaces in place and keeps sortOrder', (()=>{
    const out={id:'a',name:'Park',sortOrder:2}, inc={id:'b',name:'Tate',sortOrder:9};
    const r=swapStopIn([{id:'z',sortOrder:0},out], out, inc);
    return r.length===2 && r[1].id==='b' && r[1].sortOrder===2 && r[0].id==='z';
  })());
  assert('swapStopIn is a no-op when the stop is absent', (()=>{
    const list=[{id:'z'}]; return swapStopIn(list,{id:'a'},{id:'b'})===list && swapStopIn(null,{id:'a'},{id:'b'}).length===0;
  })());
  assert('weatherSwapSuggestion: fires on a wet day with 2+ outdoor stops', (()=>{
    const wet={id:'d1',date:'2026-09-01',activities:[{id:'a1',name:'Hyde Park',category:'outdoor'},{id:'a2',name:'Camden Market',category:'outdoor'}],restaurants:[]};
    const dry={id:'d2',date:'2026-09-02',activities:[{id:'a3',name:'Tate Modern',category:'museum'}],restaurants:[]};
    const wx={'2026-09-01':{code:65,pop:90,precip:0.6},'2026-09-02':{code:0,pop:0,precip:0}};
    const s=weatherSwapSuggestion(wet,[wet,dry],wx);
    return s && s.outdoorCount===2 && s.outdoorStop.id==='a1' && s.swapStop.id==='a3' && s.swapDay.id==='d2';
  })());
  assert('weatherSwapSuggestion: silent on a dry day', (()=>{
    const d={id:'d1',date:'2026-09-01',activities:[{id:'a1',name:'Hyde Park',category:'outdoor'},{id:'a2',name:'Camden Market',category:'outdoor'}]};
    return weatherSwapSuggestion(d,[d],{'2026-09-01':{code:0,pop:0,precip:0}})===null;
  })());
  assert('weatherSwapSuggestion: silent with only one outdoor stop', (()=>{
    const wet={id:'d1',date:'2026-09-01',activities:[{id:'a1',name:'Hyde Park',category:'outdoor'},{id:'a2',name:'Tate',category:'museum'}]};
    const dry={id:'d2',date:'2026-09-02',activities:[{id:'a3',name:'V and A',category:'museum'}]};
    return weatherSwapSuggestion(wet,[wet,dry],{'2026-09-01':{code:65,pop:90,precip:.6},'2026-09-02':{code:0,pop:0,precip:0}})===null;
  })());
  assert('weatherSwapSuggestion: silent when every other day is also wet', (()=>{
    const wet={id:'d1',date:'2026-09-01',activities:[{id:'a1',name:'Hyde Park',category:'outdoor'},{id:'a2',name:'Camden Market',category:'outdoor'}]};
    const wet2={id:'d2',date:'2026-09-02',activities:[{id:'a3',name:'Tate',category:'museum'}]};
    return weatherSwapSuggestion(wet,[wet,wet2],{'2026-09-01':{code:65,pop:90,precip:.6},'2026-09-02':{code:82,pop:95,precip:.9}})===null;
  })());
  assert('weatherSwapSuggestion: never proposes a restaurant as the swap', (()=>{
    const wet={id:'d1',date:'2026-09-01',activities:[{id:'a1',name:'Hyde Park',category:'outdoor'},{id:'a2',name:'Camden Market',category:'outdoor'}],restaurants:[]};
    const dry={id:'d2',date:'2026-09-02',activities:[],restaurants:[{id:'r1',name:'Dishoom',category:'food'}]};
    return weatherSwapSuggestion(wet,[wet,dry],{'2026-09-01':{code:65,pop:90,precip:.6},'2026-09-02':{code:0,pop:0,precip:0}})===null;
  })());
  assert('weatherSwapSuggestion: null-safe on missing data', weatherSwapSuggestion(null,[],{})===null && weatherSwapSuggestion({id:'x'},[],null)===null);
  assert('normalizeTrip defaults dismissedWxSwaps', Array.isArray(normalizeTrip({title:'x'}).dismissedWxSwaps));

  // ── NEW v0.9: ideation validation ─
  const ide = validateIdeation({destination_summary:'Great fit.', best_time:{when:'Sept',why:'fewer crowds'},
    neighborhoods:[{name:'Le Marais',why:'fashion + food',stay_here_if:'you want walkability'},{name:'',why:'x'}],
    day_trips:[{name:'Versailles',why:'day trip classic'}], tips:['Book ahead',42]});
  assert('validateIdeation keeps valid neighborhoods only', ide.neighborhoods.length === 1);
  assert('validateIdeation keeps string tips only', ide.tips.length === 1);
  assert('validateIdeation rejects junk input', validateIdeation('nope') === null && validateIdeation([1,2]) === null);
  // v1.1: tolerate shapes the model returns for long/multi-city prompts
  assert('validateIdeation unwraps array wrapper', (()=>{const r=validateIdeation([{destination_summary:'Fits you.',neighborhoods:[{name:'Soho'}]}]);return r&&r.destination_summary==='Fits you.';})());
  assert('validateIdeation unwraps single-key wrapper', (()=>{const r=validateIdeation({recommendations:{destination_summary:'Hi.',neighborhoods:[{name:'Soho'}]}});return r&&r.neighborhoods.length===1;})());
  assert('validateIdeation merges per-city objects + tags names', (()=>{
    const r=validateIdeation({London:{destination_summary:'London bit.',neighborhoods:[{name:'Notting Hill',why:'leafy'}]},Paris:{destination_summary:'Paris bit.',neighborhoods:[{name:'Le Marais',why:'central'}]}});
    return r && /London bit\./.test(r.destination_summary) && /Paris bit\./.test(r.destination_summary)
      && r.neighborhoods.length===2 && r.neighborhoods.some(n=>n.name==='Notting Hill (London)') && r.neighborhoods.some(n=>n.name==='Le Marais (Paris)');
  })());

  // ── NEW v0.9: day route URL ─
  const routeTrip = {lodging:[{name:'The Standard',address:'848 Washington St, New York, NY'}],destinations:[{id:'d1',city:'New York'}]};
  const routeDay = {destinationId:'d1',activities:[{name:'Cafe Cluny',address:'284 W 12th St, New York, NY',sortOrder:0}],restaurants:[{name:'Dante',address:'',sortOrder:1}]};
  const url = buildDayRouteUrl(routeTrip, routeDay);
  assert('day route URL is a Google Maps dir link', url && url.startsWith('https://www.google.com/maps/dir/'));
  assert('day route starts and ends at lodging', url.indexOf('848%20Washington') !== -1 && url.indexOf('848%20Washington') !== url.lastIndexOf('848%20Washington'));
  assert('day route falls back to name + city for missing address', url.includes('Dante%2C%20New%20York'));
  assert('day route returns null with no stops', buildDayRouteUrl(routeTrip, {destinationId:'d1',activities:[],restaurants:[]}) === null);

  // ── NEW v0.9: taste profile prompt ─
  assert('profilePromptText empty without profile', profilePromptText(null) === '');
  assert('profilePromptText includes interests', profilePromptText({style:'Live like a local',interests:['Food & restaurants']}).includes('Food & restaurants'));

  // ── NEW v1.0 (2.1): budget split + settle-up ─
  // computeSettlements greedy matching
  const s1 = computeSettlements({a:10, b:-10});
  assert('settle: single debtor→creditor', s1.length===1 && s1[0].from==='b' && s1[0].to==='a' && Math.abs(s1[0].amount-10)<1e-6);
  const s2 = computeSettlements({a:0, b:0});
  assert('settle: all-zero yields no transfers', s2.length===0);
  const s3 = computeSettlements({a:20, b:-5, c:-15});
  assert('settle: two debtors cover one creditor', s3.length===2 && Math.abs(s3.reduce((t,x)=>t+x.amount,0)-20)<1e-6 && s3.every(x=>x.to==='a'));
  // Balance math: A pays $30 dinner split 3 ways among A,B,C → A is owed 20, B & C owe 10 each
  (()=>{
    const members=[{id:'A'},{id:'B'},{id:'C'}];
    const items=[{amount:30,paidBy:'A',excluded:[]}];
    const bal={}; members.forEach(m=>bal[m.id]=0);
    items.forEach(it=>{ const inc=members.filter(m=>!it.excluded.includes(m.id)); const sh=it.amount/inc.length; inc.forEach(m=>bal[m.id]-=sh); bal[it.paidBy]+=it.amount; });
    assert('balance: payer is owed their share back', Math.abs(bal.A-20)<1e-6);
    assert('balance: non-payers each owe equal share', Math.abs(bal.B+10)<1e-6 && Math.abs(bal.C+10)<1e-6);
  })();
  // Uneven split: exclude the child C → A pays $30 split between A,B only
  (()=>{
    const members=[{id:'A'},{id:'B'},{id:'C'}];
    const it={amount:30,paidBy:'A',excluded:['C']};
    const bal={}; members.forEach(m=>bal[m.id]=0);
    const inc=members.filter(m=>!it.excluded.includes(m.id)); const sh=it.amount/inc.length;
    inc.forEach(m=>bal[m.id]-=sh); bal[it.paidBy]+=it.amount;
    assert('uneven: excluded member owes nothing', bal.C===0);
    assert('uneven: cost splits among included only', Math.abs(bal.B+15)<1e-6 && Math.abs(bal.A-15)<1e-6);
  })();
  // Recorded payment zeroes out a balance
  (()=>{
    const bal={A:20,B:-20};
    const pay={from:'B',to:'A',amount:20};
    bal[pay.from]+=pay.amount; bal[pay.to]-=pay.amount;
    assert('payment settles both sides to zero', bal.A===0 && bal.B===0);
  })();
  // ── NEW v1.0 (2.6): attribution helpers ─
  assert('relativeAgo empty for null', relativeAgo(null)==='');
  assert('relativeAgo recent → just now', relativeAgo(Date.now()-5000)==='just now');
  assert('relativeAgo hours', relativeAgo(Date.now()-3*3600*1000)==='3h ago');
  assert('fmtStopTime pads & formats', fmtStopTime('9:30')==='9:30 am' && fmtStopTime('13:00')==='1:00 pm');
  assert('fmtStopTime empty passthrough', fmtStopTime('')==='');
  assert('resolveStopAuthor matches collaborator', resolveStopAuthor({collaborators:[{id:'c1',name:'Maya',avatarColor:'#2BB6A3'}]},{addedBy:'c1'})?.name==='Maya');
  assert('resolveStopAuthor null when unknown', resolveStopAuthor({collaborators:[]},{addedBy:null})===null);
  assert('flightTravelers legacy = whole group', flightTravelers({collaborators:[{id:'a'},{id:'b'}]},{}).length===2);
  assert('flightTravelers tagged filters', flightTravelers({collaborators:[{id:'a'},{id:'b'}]},{travelerIds:['b']}).map(m=>m.id).join('')==='b');
  assert('gapLabel formats', gapLabel(105)==='1h 45m');

  // ── NEW v1.0 (2.4): .ics export ─
  assert('icsEsc escapes commas/semis/newlines', icsEsc('a, b; c\nd')==='a\\, b\\; c\\nd');
  assert('icsDateLocal timed', JSON.stringify(icsDateLocal('2026-09-17','09:30'))===JSON.stringify({value:'20260917T093000',allDay:false}));
  assert('icsDateLocal all-day when no time', icsDateLocal('2026-09-17','').allDay===true && icsDateLocal('2026-09-17','').value==='20260917');
  assert('icsDateFromISO converts flight time', icsDateFromISO('2026-09-17T10:30:00')==='20260917T103000');
  assert('addMinutesToICS rolls the clock', addMinutesToICS('20260917T093000',90)==='20260917T110000');
  const icsTrip={title:'Euro 2026',destinations:[{id:'d1',city:'London'}],
    days:[{id:'day1',date:'2026-09-17',destinationId:'d1',activities:[{id:'a1',name:"Musée d'Orsay",time:'09:30',address:'Paris'}],restaurants:[{id:'r1',name:'Dante',time:'13:00'}]}],
    flights:[{id:'f1',airline:'BA',flightNumber:'BA286',departureTime:'2026-09-16T11:00:00',arrivalTime:'2026-09-16T18:00:00',departureAirport:'SFO',arrivalAirport:'LHR'}],
    lodging:[{id:'l1',name:'The Hoxton',checkIn:'2026-09-16',checkInTime:'15:00',address:'London'}]};
  const ics=buildTripICS(icsTrip);
  assert('buildTripICS wraps VCALENDAR', ics.startsWith('BEGIN:VCALENDAR') && ics.trim().endsWith('END:VCALENDAR'));
  assert('buildTripICS has an event per stop+flight+checkin', (ics.match(/BEGIN:VEVENT/g)||[]).length===4);
  assert('buildTripICS includes timed activity', ics.includes('DTSTART:20260917T093000'));
  assert('buildTripICS includes flight summary', ics.includes('BA286'));
  assert('buildTripICS escapes accented/quoted names', ics.includes("Mus") && ics.includes('Orsay'));

  // ── NEW v1.1: safeJSONParse robustness ─
  assert('safeJSONParse parses clean object', safeJSONParse('{"a":1}')?.a===1);
  assert('safeJSONParse strips code fences', safeJSONParse('```json\n{"a":2}\n```')?.a===2);
  assert('safeJSONParse tolerates trailing comma in array', JSON.stringify(safeJSONParse('[1,2,3,]'))==='[1,2,3]');
  assert('safeJSONParse tolerates trailing comma in object', safeJSONParse('{"a":1,"b":2,}')?.b===2);
  assert('safeJSONParse repairs truncated array', (()=>{const r=safeJSONParse('[{"name":"A"},{"name":"B"'); return Array.isArray(r)&&r.length===2&&r[1].name==='B';})());
  assert('safeJSONParse repairs truncated object+string', (()=>{const r=safeJSONParse('{"x":"hello'); return r&&r.x==='hello';})());
  assert('safeJSONParse ignores prose around JSON', safeJSONParse('Here you go: {"a":9} thanks')?.a===9);
  assert('safeJSONParse returns null on hopeless input', safeJSONParse('not json at all')===null);

  // ── NEW v1.1: day stop reorder (unified sortOrder swap) ─
  (()=>{
    const day={activities:[{id:'a1',sortOrder:0},{id:'a2',sortOrder:2}],restaurants:[{id:'r1',sortOrder:1}]};
    // merged display order by sortOrder: a1(0), r1(1), a2(2)
    const merged=[{item:day.activities[0]},{item:day.restaurants[0]},{item:day.activities[1]}];
    const moveStop=(i,dir)=>{
      const j=i+dir; if(j<0||j>=merged.length) return null;
      const arr=merged.map(m=>m.item); [arr[i],arr[j]]=[arr[j],arr[i]];
      const orderMap=new Map(arr.map((s,k)=>[s.id,k]));
      const reindex=(list)=>list.map(s=>orderMap.has(s.id)?{...s,sortOrder:orderMap.get(s.id)}:s);
      return {activities:reindex(day.activities),restaurants:reindex(day.restaurants)};
    };
    const moved=moveStop(2,-1); // move a2 up past r1
    const all=[...moved.activities,...moved.restaurants].sort((a,b)=>a.sortOrder-b.sortOrder).map(s=>s.id);
    assert('reorder: moving a stop up reflows unified order', JSON.stringify(all)===JSON.stringify(['a1','a2','r1']));
    assert('reorder: clamps at top (no move)', moveStop(0,-1)===null);
    assert('reorder: clamps at bottom (no move)', moveStop(2,1)===null);
  })();
  assert('FREE_GENERATION_CAP is 10 (per trip)', FREE_GENERATION_CAP===10);

  // ── NEW v1.1 (2.5): carrierInfo flight/train links ─
  assert('carrierInfo: Delta code → check-in', (()=>{const c=carrierInfo({airline:'Delta',flightNumber:'DL83'});return c.label==='Check in'&&/delta\.com/.test(c.url)&&!c.train;})());
  // Round 7 renamed this label to the universal-link wording · test was left stale until Round 12.
  assert('carrierInfo: Eurostar by name → manage booking (train)', (()=>{const c=carrierInfo({airline:'Eurostar',flightNumber:'ES9108'});return c.train&&/eurostar/.test(c.url)&&c.label==='Open Eurostar'&&c.track===null;})());
  assert('carrierInfo: British Airways code → check-in', /britishairways/.test(carrierInfo({airline:'British Airways',flightNumber:'BA286'}).url));
  assert('carrierInfo: unknown airline → track flight', (()=>{const c=carrierInfo({airline:'Mystery Air',flightNumber:'ZZ100'});return c.label==='Track flight'&&/flightaware/.test(c.url);})());
  assert('carrierInfo: name fallback when code unknown', /united\.com/.test(carrierInfo({airline:'United Airlines',flightNumber:'X1'}).url));
  assert('carrierInfo: flights get a FlightAware track link', !!carrierInfo({airline:'Delta',flightNumber:'DL83'}).track);
  assert('getAirlineCheckinUrl back-compat still returns a url', typeof getAirlineCheckinUrl('DL83')==='string');

  // Summary
  if (failed === 0) {
    console.log(`%c✅ All ${passed} Locale tests passed`, 'color:#2B5F6E;font-weight:bold;font-size:13px');
  } else {
    console.warn(`%c⚠️ ${failed} of ${passed + failed} Locale tests FAILED · check errors above`, 'color:#C05621;font-weight:bold;font-size:13px');
  }
})();

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App/>
  </ErrorBoundary>
);

</script>

<script>
// PWA Manifest via Blob URL
const manifest = {
  name: "Locale · Your trips, beautifully kept.",
  short_name: "Locale",
  description: "Your trips, beautifully kept.",
  start_url: ".",
  display: "standalone",
  background_color: "#F5F2EC",
  theme_color: "#FF5A4D",
  orientation: "portrait-primary",
  icons: [
    { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232B5F6E'/><text y='.9em' font-size='70' x='15'>✈️</text></svg>", sizes: "192x192", type: "image/svg+xml" },
    { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232B5F6E'/><text y='.9em' font-size='70' x='15'>✈️</text></svg>", sizes: "512x512", type: "image/svg+xml" }
  ]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
const manifestUrl = URL.createObjectURL(manifestBlob);
document.getElementById('manifest-link').href = manifestUrl;

// Service Worker via Blob URL · cache-first offline strategy
const swCode = `
const CACHE = 'locale-v22-per-trip-ai';
const STATIC = [
  'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap',
  'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js',
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js',
];

self.addEventListener('install', e => {
  self.skipWaiting();
  e.waitUntil(
    caches.open(CACHE).then(c => {
      // Cache external CDN assets; ignore failures (font subsets load separately)
      return Promise.allSettled(STATIC.map(url => c.add(url)));
    })
  );
});

self.addEventListener('activate', e => {
  // Remove old cache versions
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    ).then(() => clients.claim())
  );
});

self.addEventListener('fetch', e => {
  const { request } = e;
  const url = new URL(request.url);

  // Never intercept API calls (AI proxy, Supabase auth/data, Anthropic) or non-GET
  if (request.method !== 'GET' ||
      url.hostname.endsWith('supabase.co') ||
      url.hostname === 'api.anthropic.com') {
    return; // let the browser handle it (streaming-safe)
  }

  // Navigation requests: NETWORK-FIRST and bypass the HTTP cache (no-store) so new
  // deploys reach users immediately; cache a copy for offline fallback.
  if (request.mode === 'navigate') {
    e.respondWith(
      fetch(request.url, { cache: 'no-store' })
        .then(res => {
          const clone = res.clone();
          caches.open(CACHE).then(c => c.put(request, clone));
          return res;
        })
        .catch(() => caches.match(request).then(c => c || caches.match('/') || new Response('<h1>Locale</h1><p>You are offline. Open the app while connected first to enable full offline support.</p>', { headers: { 'Content-Type': 'text/html' } })))
    );
    return;
  }

  // CDN assets & fonts: cache-first
  if (url.origin !== self.location.origin ||
      url.hostname.includes('cdnjs') ||
      url.hostname.includes('fonts.googleapis') ||
      url.hostname.includes('fonts.gstatic')) {
    e.respondWith(
      caches.match(request).then(cached => {
        if (cached) return cached;
        return fetch(request).then(res => {
          const clone = res.clone();
          caches.open(CACHE).then(c => c.put(request, clone));
          return res;
        }).catch(() => cached || new Response('', { status: 408 }));
      })
    );
    return;
  }

  // Everything else: network with cache fallback
  e.respondWith(
    fetch(request)
      .then(res => {
        const clone = res.clone();
        caches.open(CACHE).then(c => c.put(request, clone));
        return res;
      })
      .catch(() => caches.match(request))
  );
});
`;
if('serviceWorker' in navigator) {
  const swBlob = new Blob([swCode], {type:'text/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
<script>
/* Appearance: Auto (match device) / Light / Dark · remembered across sessions. */
(function(){
  var KEY='locale_theme';
  function current(){ try{ return localStorage.getItem(KEY)||'auto'; }catch(e){ return 'auto'; } }
  function apply(mode){
    var r=document.documentElement;
    if(mode==='light'||mode==='dark'){ r.setAttribute('data-theme',mode); }
    else { r.removeAttribute('data-theme'); mode='auto'; }
    try{ localStorage.setItem(KEY,mode); }catch(e){}
    var tg=document.getElementById('theme-toggle');
    if(tg){ Array.prototype.forEach.call(tg.querySelectorAll('button'),function(b){ b.setAttribute('aria-pressed', String(b.dataset.mode===mode)); }); }
  }
  function init(){
    if(document.getElementById('theme-toggle')) return;
    var tg=document.createElement('div');
    tg.id='theme-toggle'; tg.setAttribute('role','group'); tg.setAttribute('aria-label','Appearance');
    tg.innerHTML='<button data-mode="light" title="Light" aria-label="Light">☀</button>'
               + '<button data-mode="auto" title="Match device" aria-label="Match device">◐</button>'
               + '<button data-mode="dark" title="Dark" aria-label="Dark">☾</button>';
    document.body.appendChild(tg);
    Array.prototype.forEach.call(tg.querySelectorAll('button'),function(b){
      b.addEventListener('click',function(){ apply(b.dataset.mode); });
    });
    apply(current());
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',init); } else { init(); }
})();
</script>
