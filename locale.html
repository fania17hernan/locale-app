<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Locale · Redirecting</title>
<!--
  RETIRED 2026-09-02 (SECURITY-REVIEW-2026-09-02, finding H2).

  This used to be the v1 app. Nothing linked to it any more — index.html points at
  locale-v2.html — but it was still served, still pinned supabase-js@2.49.4 (the version
  flagged in the 2026-07-06 review) and still had zero SRI on all five CDN scripts, all
  against the live Supabase project. The July remediation only ever touched locale-v2.html.

  Redirect rather than delete, so every old bookmark, PWA shortcut and invite email keeps
  working. The original file is archived at
  locale-docs/archive/locale-v1-final-2026-09-02.html and is in git history.

  The forward preserves ?query and #fragment verbatim, which matters: share links are
  #s=<id> and #trip=<base64>, and the auth forwarder uses the fragment too. Both apps read
  the same locale_v4 store on the same origin, so nobody's trips move.

  Known gap, recorded honestly: the v1 service worker served navigations cache-first, so a
  device that still has it active AND an intact cache keeps running the old app from disk
  and never sees this file. Nothing served from here can reach them — a blob-URL service
  worker can't be updated from the server. This page cleans up whenever it is actually
  reached over the network, which covers new visits, evicted caches and hard reloads.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:#FAF5EC; color:#2B231D; text-align:center; padding:24px; }
  @media (prefers-color-scheme: dark) { body { background:#1A1613; color:#F0E9DF; } }
  a { color:#BF5538; }
  .wrap { max-width:32ch; }
  h1 { font-size:19px; margin:0 0 8px; }
  p { margin:0; font-size:15px; opacity:.75; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Taking you to Locale…</h1>
  <p>If nothing happens, <a id="manual" href="locale-v2.html">open the app</a>.</p>
</div>
<noscript>
  <meta http-equiv="refresh" content="0; url=locale-v2.html">
</noscript>
<script>
(function () {
  // Preserve ?query and #fragment exactly — share links live in the fragment.
  var target = 'locale-v2.html' + window.location.search + window.location.hash;
  var link = document.getElementById('manual');
  if (link) link.setAttribute('href', target);

  var done = false;
  function go() {
    if (done) return;
    done = true;
    // replace(), not assign(), so Back doesn't bounce the user in a loop.
    window.location.replace(target);
  }

  // Clear the retired v1 app shell and its service worker so this device stops
  // resurrecting the old build. Only cached copies of the app are touched —
  // localStorage (locale_v4 trips, locale_profile_v1, locale_ai_key) is never read
  // or written here. v2 re-registers its own worker as soon as it loads.
  var cleanup = [];
  try {
    if (window.caches && caches.keys) {
      cleanup.push(caches.keys().then(function (names) {
        return Promise.all(names.filter(function (n) {
          return n === 'locale-v10' || /^locale-v(?:[0-9]|1[0-9]|2[01])\b/.test(n);
        }).map(function (n) { return caches.delete(n); }));
      }));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      cleanup.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }));
    }
  } catch (e) { /* cleanup is best effort — never block the redirect */ }

  // Redirect as soon as cleanup settles, and unconditionally after 1.2s either way.
  if (cleanup.length) {
    Promise.all(cleanup).then(go).catch(go);
  } else {
    go();
  }
  setTimeout(go, 1200);
})();
</script>
</body>
</html>
