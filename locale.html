function ItineraryAIPlanner({trip, onUpdateTrip}) {
  const [apiKey, setApiKeyState] = React.useState(getAIKey);
  const [showKeyInput, setShowKeyInput] = React.useState(!getAIKey());
  const [prompt, setPrompt] = React.useState(trip._regenPrompt || '');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const [streamText, setStreamText] = React.useState('');

  const nightCount = trip.startDate && trip.endDate
    ? Math.round((new Date(trip.endDate) - new Date(trip.startDate)) / 86400000)
    : null;

  const saveKey = (k) => { setAIKey(k.trim()); setApiKeyState(k.trim()); setShowKeyInput(false); };

  const buildSystemPrompt = () => {
    const lodgingLines = (trip.lodging||[]).map(l=>`  • ${l.name}${l.address?' at '+l.address:''}${l.checkIn?' · Check-in: '+l.checkIn:''}${l.checkOut?' · Check-out: '+l.checkOut:''}`).join('\n');
    const flightLines = (trip.flights||[]).map(f=>`  • ${f.direction||''} ${f.flightNumber||''} ${f.departureAirport||''}→${f.arrivalAirport||''} on ${f.departureTime?.slice(0,10)||''} at ${f.departureTime?.slice(11,16)||''}${f.confirmationNumber?' (conf: '+f.confirmationNumber+')':''}`).join('\n');
    return `You are a travel itinerary planner. Given a trip description, generate a detailed day-by-day itinerary as a JSON array.

Trip context:
- Name: ${trip.title}
- Destinations: ${trip.destinations.map(d=>`${d.city} (${d.countryCode})`).join(', ')}
- Dates: ${trip.startDate} to ${trip.endDate} (${nightCount} nights)
- Occasion: ${trip.occasion}
- Travelers: ${trip.travelerCount || 2}
${lodgingLines ? `- Lodging (MUST include check-in/check-out in itinerary):\n${lodgingLines}` : ''}
${flightLines ? `- Flights (MUST include in itinerary with exact times and confirmation numbers):\n${flightLines}` : ''}

CRITICAL RULES about the user's request:
1. The user's message contains their NON-NEGOTIABLE activities, restaurants, and plans. You MUST include every specific place, activity, or event they mention — do not skip or replace them.
2. If they mention a hotel or where they're staying, include hotel check-in on arrival day and check-out on departure day as activities.
3. If lodging is listed above, always start arrival day with "Check-in at [hotel name]" and end last day with "Check-out from [hotel name]".
4. If flights are listed above, include departure flight prep (travel to airport, check-in time) on the appropriate days.
5. After placing all non-negotiables, fill remaining slots with suggestions that complement their stated plans — same neighborhood, logical geography, similar vibe.
6. Never replace a user-specified activity with a generic one.

Return ONLY a valid JSON array of day objects. No markdown, no explanation - just the raw JSON array starting with [ and ending with ].

Each day object must follow this exact shape:
{
  "id": "day-1",
  "date": "YYYY-MM-DD",
  "label": "Day 1 - Arrival",
  "destinationId": "${trip.destinations[0]?.id || 'd1'}",
  "notes": "",
  "activities": [
    {
      "id": "a1",
      "name": "Example Venue",
      "emoji": "🎢",
      "address": "123 Main St, City, ST 00000",
      "neighborhood": "Downtown",
      "bucket": "must-do",
      "category": "entertainment",
      "bookingRequired": true,
      "bookingUrl": "",
      "notes": "Example note.",
      "thingsToConsider": ["Tip 1", "Tip 2"],
      "sortOrder": 0
    }
  ],
  "restaurants": [
    {
      "id": "r1",
      "name": "Example Restaurant",
      "emoji": "🍽️",
      "address": "456 Food St, City, ST 00000",
      "neighborhood": "Downtown",
      "bucket": "must-do",
      "cuisine": "American",
      "mealType": "dinner",
      "reservationRequired": true,
      "priceRange": "$$$",
      "notes": "Great atmosphere, book ahead.",
      "thingsToConsider": [],
      "sortOrder": 0
    }
  ]
}

Rules:
- Generate one day object per day of the trip (from startDate to endDate inclusive)
- For trips up to 7 nights: include 3 activities and 2 restaurants per day
- For trips 8-14 nights: include 2 activities and 1 restaurant per day (keep responses compact)
- For trips 15+ nights: include 2 activities and 1 restaurant per day
- Spread activities logically by geography — cluster nearby things on the same day
- First day: arrival + light activities. Last day: checkout + departure-friendly spots.
- Use real, specific venue names and addresses
- Emojis should match the activity type
- bucket is "must-do", "nice-to-have", or "if-time"
- category is one of: sightseeing, food, outdoor, shopping, entertainment, culture, tour, other
- mealType is one of: breakfast, lunch, dinner, cafe, drinks
- Keep notes and thingsToConsider brief (1 sentence max) to stay within token limits`;
  };

  const [generated, setGenerated] = React.useState(false);
  const [uploading, setUploading] = React.useState(false);
  const [uploadResult, setUploadResult] = React.useState(null); // {type:'lodging'|'flight', parsed, raw}
  const [showContext, setShowContext] = React.useState(false);
  const fileInputRef = React.useRef(null);

  const extractFromConfirmation = async (file) => {
    if (!apiKey) { setShowKeyInput(true); return; }
    setUploading(true); setUploadResult(null); setError('');
    try {
      // Read file as base64
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const isPdf = file.type === 'application/pdf';
      const mediaType = isPdf ? 'application/pdf' : (file.type || 'image/jpeg');

      const extractPrompt = `You are parsing a travel confirmation document. Extract ALL available details and return ONLY a JSON object — no markdown, no explanation.

If this is a HOTEL/LODGING confirmation, return:
{
  "type": "lodging",
  "name": "hotel name",
  "address": "full address",
  "checkIn": "YYYY-MM-DD",
  "checkOut": "YYYY-MM-DD",
  "checkInTime": "HH:MM",
  "checkOutTime": "HH:MM",
  "confirmationNumber": "conf number or null",
  "roomType": "room type or null",
  "notes": "any useful info like parking, amenities, check-in instructions"
}

If this is a FLIGHT confirmation, return an array:
{
  "type": "flights",
  "flights": [
    {
      "direction": "outbound|return|connecting",
      "airline": "airline name",
      "flightNumber": "e.g. DL204",
      "departureAirport": "airport code or name",
      "arrivalAirport": "airport code or name",
      "departureTime": "YYYY-MM-DDTHH:MM:00",
      "arrivalTime": "YYYY-MM-DDTHH:MM:00",
      "confirmationNumber": "conf number or null",
      "seatNumber": "seat or null",
      "notes": "baggage info, terminal, gate if available"
    }
  ]
}

Only include fields you can actually read from the document. Use null for anything missing.`;

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 1024,
          messages: [{
            role: 'user',
            content: [
              { type: isPdf ? 'document' : 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
              { type: 'text', text: extractPrompt }
            ]
          }]
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(()=>({}));
        throw new Error(err?.error?.message || `API error ${res.status}`);
      }
      const data = await res.json();
      const text = data?.content?.[0]?.text || '';
      const jsonMatch = text.match(/\{[\s\S]*\}/);
      if (!jsonMatch) throw new Error('Could not extract details from this document. Try a clearer image or PDF.');
      const parsed = JSON.parse(jsonMatch[0]);
      setUploadResult({ parsed, filename: file.name });
    } catch(e) {
      setError('Upload failed: ' + e.message);
    } finally {
      setUploading(false);
    }
  };

  const saveExtracted = () => {
    if (!uploadResult?.parsed) return;
    const p = uploadResult.parsed;
    if (p.type === 'lodging') {
      const newLodging = [...(trip.lodging||[])];
      const existing = newLodging.findIndex(l=>l.name===p.name);
      const entry = { id: existing>=0 ? newLodging[existing].id : uuid(), name:p.name||'', address:p.address||'', checkIn:p.checkIn||'', checkOut:p.checkOut||'', checkInTime:p.checkInTime||'', checkOutTime:p.checkOutTime||'', confirmationNumber:p.confirmationNumber||'', roomType:p.roomType||'', notes:p.notes||'' };
      if (existing >= 0) newLodging[existing] = entry; else newLodging.push(entry);
      onUpdateTrip({...trip, lodging: newLodging});
    } else if (p.type === 'flights') {
      const newFlights = [...(trip.flights||[])];
      (p.flights||[]).forEach(f => {
        const exists = newFlights.findIndex(x=>x.flightNumber===f.flightNumber&&x.departureTime===f.departureTime);
        const entry = {...f, id: exists>=0 ? newFlights[exists].id : uuid()};
        if (exists >= 0) newFlights[exists] = entry; else newFlights.push(entry);
      });
      onUpdateTrip({...trip, flights: newFlights});
    }
    setUploadResult(null);
    setShowContext(true); // show the context panel so user sees what was saved
  };

  const generate = async () => {
    if (!apiKey) { setShowKeyInput(true); return; }
    if (!prompt.trim()) { setError('Tell me what you want to do on this trip first.'); return; }
    setLoading(true); setError(''); setStreamText('');

    try {
      const res = await fetch(
        'https://api.anthropic.com/v1/messages',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 16000,
            system: buildSystemPrompt(),
            messages: [{ role: 'user', content: 'User request: ' + prompt }],
          }),
        }
      );

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || `API error ${res.status}`);
      }

      const data = await res.json().catch(() => { throw new Error('Could not read the API response. Please try again.'); });
      const full = data?.content?.[0]?.text || '';
      if (!full) throw new Error('Claude returned an empty response. Please try again.');
      // Warn if response was cut off due to token limit
      if (data?.stop_reason === 'max_tokens') {
        console.warn('Response hit max_tokens — JSON may be truncated. Attempting recovery...');
      }
      setStreamText(full);

      // Parse the JSON — strip markdown fences, find the outermost array
      let days;
      try {
        // Strip ```json ... ``` or ``` ... ``` fences if present
        let cleaned = full.replace(/^```(?:json)?\s*/i,'').replace(/\s*```\s*$/,'').trim();
        // Find the first [ and last ] to extract the array robustly
        const start = cleaned.indexOf('[');
        const end = cleaned.lastIndexOf(']');
        if (start === -1 || end === -1 || end <= start) throw new Error('No JSON array found in response.');
        days = JSON.parse(cleaned.slice(start, end + 1));
        if (!Array.isArray(days) || days.length === 0) throw new Error('Response contained an empty or invalid itinerary.');
      } catch(parseErr) {
        console.error('AI response parse failed:', parseErr, '\nRaw response:', full.slice(0, 500));
        try {
          const log = JSON.parse(localStorage.getItem('locale_error_log') || '[]');
          log.unshift({ ts: new Date().toISOString(), msg: 'AI parse: ' + parseErr.message, raw: full.slice(0, 300) });
          localStorage.setItem('locale_error_log', JSON.stringify(log.slice(0, 10)));
        } catch(e) {}
        throw new Error('Claude\'s response wasn\'t formatted correctly. Your trip is safe — please try generating again.');
      }

      // Assign proper IDs and link destinations
      const destId = trip.destinations[0]?.id || 'd1';
      const tripStart = new Date(trip.startDate + 'T12:00:00');
      const normalizedDays = days.map((day, i) => {
        const date = new Date(tripStart);
        date.setDate(date.getDate() + i);
        const dateStr = date.toISOString().slice(0, 10);
        return {
          ...day,
          id: uuid(),
          date: day.date || dateStr,
          destinationId: day.destinationId || destId,
          activities: (day.activities || []).map((a, j) => ({...a, id: uuid(), sortOrder: j})),
          restaurants: (day.restaurants || []).map((r, j) => ({...r, id: uuid(), sortOrder: j})),
        };
      });

      onUpdateTrip({...trip, days: normalizedDays});
      setStreamText('');
      setGenerated(true);
    } catch(e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  if (showKeyInput) return (
    <div style={{padding:'40px 20px',maxWidth:480,margin:'0 auto'}}>
      <div style={{background:'var(--color-surface)',borderRadius:16,padding:24,border:'1px solid var(--color-border)'}}>
        <div style={{fontSize:'1.8rem',marginBottom:12,textAlign:'center'}}>🔑</div>
        <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.2rem',fontWeight:600,marginBottom:8,textAlign:'center'}}>Add your Claude API key</h3>
        <p style={{fontSize:'.83rem',color:'var(--color-ink-light)',marginBottom:12,textAlign:'center',lineHeight:1.5}}>
          Locale uses Claude to generate your itinerary. Your key is stored on this device only and only sent to Anthropic's API.
        </p>
        <div style={{background:'#FEF3C7',border:'1px solid #D97706',borderRadius:8,padding:'8px 12px',marginBottom:12,fontSize:'.78rem',color:'#92400E',lineHeight:1.5,textAlign:'left'}}>
          <strong>⚠️ Security notice:</strong> Your key is saved in this browser's local storage and is visible in DevTools. Do not use a production key with unrestricted spending. Beta testers: use only the test key provided by Stephanie.
        </div>
        <input
          className="input"
          type="password"
          placeholder="sk-ant-..."
          defaultValue={apiKey}
          id="ai-key-input"
          style={{marginBottom:12}}
        />
        <div style={{display:'flex',gap:8}}>
          {apiKey && <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setShowKeyInput(false)}>Cancel</button>}
          <button className="btn btn-primary" style={{flex:2}} onClick={()=>saveKey(document.getElementById('ai-key-input').value)}>
            Save key & continue
          </button>
        </div>
        {apiKey && (
          <button
            onClick={()=>{ setAIKey(''); setApiKeyState(''); showToast('API key cleared.','info',3000); }}
            style={{marginTop:10,width:'100%',background:'none',border:'none',color:'var(--color-ink-muted)',fontSize:'.78rem',cursor:'pointer',textDecoration:'underline',padding:'4px 0'}}>
            Clear saved key
          </button>
        )}
      </div>
    </div>
  );

  return (
    <div style={{padding:'0 0 40px'}}>
      {/* Header */}
      <div style={{background:'linear-gradient(135deg,var(--color-accent) 0%,#1a3d47 100%)',borderRadius:16,padding:'24px 20px',marginBottom:20,position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:-20,right:-20,fontSize:'6rem',opacity:.08,transform:'rotate(-15deg)'}}>✨</div>
        <div style={{position:'relative'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div>
              <p style={{color:'rgba(255,255,255,.7)',fontSize:'.75rem',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:4}}>AI Itinerary Planner</p>
              <h3 style={{fontFamily:'var(--font-display)',color:'#fff',fontSize:'1.4rem',fontWeight:600,marginBottom:4}}>{trip.title}</h3>
              <p style={{color:'rgba(255,255,255,.75)',fontSize:'.83rem'}}>{trip.destinations.map(d=>d.city).join(' → ')} · {nightCount} nights</p>
            </div>
            <button onClick={()=>setShowKeyInput(true)} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:8,padding:'6px 10px',color:'rgba(255,255,255,.8)',fontSize:'.72rem',cursor:'pointer'}}>🔑 API Key</button>
          </div>
        </div>
      </div>

      {/* Upload confirmations */}
      <div style={{marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
          <label className="section-label" style={{marginBottom:0}}>📎 Upload confirmations</label>
          <span style={{fontSize:'.72rem',color:'var(--color-ink-muted)'}}>Hotel · Flight · Optional</span>
        </div>
        <input ref={fileInputRef} type="file" accept="image/*,application/pdf" style={{display:'none'}}
          onChange={e=>{ const f=e.target.files?.[0]; if(f) extractFromConfirmation(f); e.target.value=''; }}
        />
        <button className="btn btn-secondary" style={{width:'100%',gap:8,justifyContent:'center'}} onClick={()=>fileInputRef.current?.click()} disabled={uploading}>
          {uploading ? '🔍 Reading your confirmation…' : '📤 Upload hotel or flight confirmation'}
        </button>
        <p style={{fontSize:'.72rem',color:'var(--color-ink-muted)',marginTop:5,textAlign:'center'}}>
          PDF or screenshot · Claude reads the details and adds them to your trip automatically
        </p>

        {/* Extracted result preview */}
        {uploadResult?.parsed && (
          <div style={{marginTop:12,background:'var(--color-surface)',border:'1px solid var(--color-accent)',borderRadius:12,overflow:'hidden'}}>
            <div style={{background:'var(--color-accent-soft)',padding:'10px 14px',borderBottom:'1px solid var(--color-border)'}}>
              <p style={{fontWeight:600,fontSize:'.875rem',color:'var(--color-accent)'}}>
                {uploadResult.parsed.type==='lodging' ? '🏨 Hotel found' : '✈️ Flights found'} — from {uploadResult.filename}
              </p>
            </div>
            <div style={{padding:'12px 14px',fontSize:'.83rem',color:'var(--color-ink-light)',lineHeight:1.7}}>
              {uploadResult.parsed.type==='lodging' && (
                <>
                  <p><strong>🏨 {uploadResult.parsed.name}</strong></p>
                  {uploadResult.parsed.address&&<p>📍 {uploadResult.parsed.address}</p>}
                  {uploadResult.parsed.checkIn&&<p>📅 Check-in: {uploadResult.parsed.checkIn}{uploadResult.parsed.checkInTime?' at '+uploadResult.parsed.checkInTime:''}</p>}
                  {uploadResult.parsed.checkOut&&<p>📅 Check-out: {uploadResult.parsed.checkOut}{uploadResult.parsed.checkOutTime?' at '+uploadResult.parsed.checkOutTime:''}</p>}
                  {uploadResult.parsed.confirmationNumber&&<p>🔖 Conf: {uploadResult.parsed.confirmationNumber}</p>}
                  {uploadResult.parsed.roomType&&<p>🛏 {uploadResult.parsed.roomType}</p>}
                  {uploadResult.parsed.notes&&<p style={{marginTop:4,fontStyle:'italic'}}>{uploadResult.parsed.notes}</p>}

              {uploadResult.parsed.type==='flights' && (uploadResult.parsed.flights||[]).map((f,i)=>(
                <div key={i} style={{marginBottom:i<uploadResult.parsed.flights.length-1?10:0,paddingBottom:i<uploadResult.parsed.flights.length-1?10:0,borderBottom:i<uploadResult.parsed.flights.length-1?'1px solid var(--color-border)':'none'}}>
                  <p><strong>✈️ {f.flightNumber} — {f.airline}</strong> <span style={{fontWeight:400,textTransform:'capitalize'}}>({f.direction})</span></p>
                  <p>{f.departureAirport} → {f.arrivalAirport}</p>
                  {f.departureTime&&<p>🕐 Departs: {f.departureTime.replace('T',' at ').slice(0,16)}</p>}
                  {f.arrivalTime&&<p>🕐 Arrives: {f.arrivalTime.replace('T',' at ').slice(0,16)}</p>}
                  {f.confirmationNumber&&<p>🔖 Conf: {f.confirmationNumber}</p>}
                  {f.seatNumber&&<p>💺 Seat: {f.seatNumber}</p>}
                </div>
              ))}
            </div>
            <div style={{padding:'10px 14px',display:'flex',gap:8,borderTop:'1px solid var(--color-border)'}}>
              <button className="btn btn-primary" style={{flex:2}} onClick={saveExtracted}>
                ✅ Add to my trip
              </button>
              <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setUploadResult(null)}>
                Discard
              </button>
            </div>
          </div>
        )}
      </div>

      {/* What Claude knows */}
      {(trip.lodging?.length>0 || trip.flights?.length>0) && (
        <div style={{marginBottom:16,background:'var(--color-accent-soft)',borderRadius:12,overflow:'hidden',border:'1px solid #C8DFE4'}}>
          <button onClick={()=>setShowContext(c=>!c)} style={{width:'100%',background:'none',border:'none',padding:'11px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}}>
            <span style={{fontWeight:600,fontSize:'.83rem',color:'var(--color-accent)'}}>🧠 What Claude knows about your trip</span>
            <span style={{fontSize:'.72rem',color:'var(--color-accent)'}}>{showContext?'▲ Hide':'▼ Show'}</span>
          </button>
          {showContext&&(
            <div style={{padding:'0 14px 14px',borderTop:'1px solid #C8DFE4'}}>
              {trip.lodging?.length>0&&(
                <div style={{marginTop:10}}>
                  <p style={{fontSize:'.72rem',fontWeight:600,color:'var(--color-accent)',letterSpacing:'.06em',textTransform:'uppercase',marginBottom:6}}>🏨 Lodging</p>
                  {trip.lodging.map(l=>(
                    <div key={l.id} style={{fontSize:'.83rem',color:'var(--color-ink-light)',lineHeight:1.6,marginBottom:6}}>
                      <strong>{l.name}</strong>
                      {l.address&&<span> · {l.address}</span>}
                      {l.checkIn&&<span> · Check-in {l.checkIn}{l.checkInTime?' at '+l.checkInTime:''}</span>}
                      {l.checkOut&&<span> · Check-out {l.checkOut}{l.checkOutTime?' at '+l.checkOutTime:''}</span>}
                      {l.confirmationNumber&&<span> · Conf: {l.confirmationNumber}</span>}
                    </div>
                  ))}
                </div>
              )}
              {trip.flights?.length>0&&(
                <div style={{marginTop:10}}>
                  <p style={{fontSize:'.72rem',fontWeight:600,color:'var(--color-accent)',letterSpacing:'.06em',textTransform:'uppercase',marginBottom:6}}>✈️ Flights</p>
                  {trip.flights.map(f=>(
                    <div key={f.id} style={{fontSize:'.83rem',color:'var(--color-ink-light)',lineHeight:1.6,marginBottom:4}}>
                      <strong>{f.flightNumber}</strong> {f.departureAirport}→{f.arrivalAirport}
                      {f.departureTime&&<span> · {f.departureTime.slice(0,10)} {f.departureTime.slice(11,16)}</span>}
                      {f.confirmationNumber&&<span> · Conf: {f.confirmationNumber}</span>}
                    </div>
                  ))}
                </div>
              )}
              <p style={{fontSize:'.72rem',color:'var(--color-accent)',marginTop:10,opacity:.8}}>
                ✓ Claude will automatically include all of the above in your itinerary.
              </p>
            </div>
          )}
        </div>
      )}

      {/* Prompt area */}
      <div style={{marginBottom:16}}>
        <label className="section-label">What do you want to do?</label>
        <textarea
          className="input"
          rows={5}
          placeholder={`Describe your trip plans in plain English. For example:\n\n"We're staying at the Disneyland Hotel. Day 1 we want to do Disneyland park — hit all the classic rides. Day 2 we want to explore Downtown LA: walk around Grand Central Market, visit LACMA, dinner in Little Tokyo. Day 3 we'll head to Santa Monica pier, Venice Beach, then fly home."`}
          value={prompt}
          onChange={e=>setPrompt(e.target.value)}
          style={{minHeight:140,resize:'vertical',lineHeight:1.6,fontSize:'.875rem'}}
        />
      </div>

      {error && <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,padding:'10px 14px',fontSize:'.83rem',color:'#b91c1c',marginBottom:14}}>{error}</div>}

      {loading && streamText && (

        disabled={loading}
      >

      </button>

      {generated && !loading && (
        <div style={{marginTop:16,background:'#F0FAF4',border:'1px solid #6EBB8A',borderRadius:12,padding:'14px 16px'}}>
          <p style={{fontWeight:600,fontSize:'.9rem',color:'#1A6B3A',marginBottom:6}}>✅ Itinerary generated! Check the Days tab to see it.</p>

            className="input"

          />
          <button className="btn btn-primary" style={{width:'100%'}} onClick={()=>{setGenerated(false);generate();}}>

      )}

      <p style={{textAlign:'center',fontSize:'.75rem',color:'var(--color-ink-muted)',marginTop:10,lineHeight:1.5}}>
        Powered by Claude · Takes about 10–20 seconds · You can edit everything after
      </p>
    </div>
  );
}

// ── Trip Date Editor ─────────────────────────────────────────────────────────
function TripDateEditor({trip, onUpdateTrip}) {
  const [editing, setEditing] = React.useState(false);
  const [startDate, setStartDate] = React.useState(trip.startDate || '');
  const [endDate, setEndDate] = React.useState(trip.endDate || '');
  const [error, setError] = React.useState('');

  // Reset local state if trip prop changes
  React.useEffect(() => {
    setStartDate(trip.startDate || '');
    setEndDate(trip.endDate || '');
  }, [trip.startDate, trip.endDate]);

  const nightCount = trip.startDate && trip.endDate
    ? Math.round((new Date(trip.endDate) - new Date(trip.startDate)) / 86400000)
    : null;

  const save = () => {
    setError('');
    if (!startDate) { setError('Start date is required.'); return; }
    if (!endDate)   { setError('End date is required.'); return; }
    if (endDate < startDate) { setError('End date must be after start date.'); return; }

    // Reconcile days array with new date range
    const allDates = [];
    const cur = new Date(startDate + 'T12:00:00');
    const end = new Date(endDate + 'T12:00:00');
    while (cur <= end) {
      allDates.push(cur.toISOString().slice(0, 10));
      cur.setDate(cur.getDate() + 1);
    }

    const existingDays = trip.days || [];
    // Keep existing days that fall within new range (preserving their content)
    const kept = existingDays.filter(d => allDates.includes(d.date));
    const keptDates = kept.map(d => d.date);
    // Add blank day entries for new dates not already covered
    const newDays = allDates.map(date => {
      const existing = kept.find(d => d.date === date);
      if (existing) return existing;
      return { id: uuid(), date, label: `Day ${allDates.indexOf(date) + 1}`, activities: [], restaurants: [], notes: '', destinationId: trip.destinations?.[0]?.id || '' };
    });

    onUpdateTrip({ ...trip, startDate, endDate, days: newDays });
    setEditing(false);
  };

  const cancel = () => {
    setStartDate(trip.startDate || '');
    setEndDate(trip.endDate || '');
    setError('');
    setEditing(false);
  };

  return (
    <div style={{background:'var(--color-surface)',borderRadius:12,padding:16,border:'1px solid var(--color-border)',marginBottom:20}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:editing?14:0}}>
        <div>
          <p style={{fontSize:'.75rem',color:'var(--color-ink-muted)',letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,marginBottom:2}}>Trip Dates</p>
          {!editing && (
            <p style={{fontSize:'.95rem',fontWeight:500,color:'var(--color-ink)'}}>
              {formatDate(trip.startDate)} – {formatDate(trip.endDate)}
              {nightCount !== null && <span style={{color:'var(--color-ink-light)',fontWeight:400,fontSize:'.85rem'}}> · {nightCount} night{nightCount!==1?'s':''}</span>}
            </p>
          )}
        </div>
        {!editing && (
          <button onClick={()=>setEditing(true)} style={{background:'var(--color-cream-dark)',border:'none',borderRadius:20,padding:'5px 14px',fontSize:'.78rem',fontWeight:500,color:'var(--color-ink-light)',cursor:'pointer'}}>
            ✏️ Edit dates
          </button>
        )}
      </div>

      {editing && (
        <>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:10}}>
            <div>
              <label className="section-label" style={{display:'block',marginBottom:4}}>Start Date</label>
              <input className="input" type="date" value={startDate}
                onChange={e => {
                  const v = e.target.value;
                  setStartDate(v);
                  if (v && endDate && endDate < v) setEndDate('');
                }}/>
            </div>
            <div>
              <label className="section-label" style={{display:'block',marginBottom:4}}>End Date</label>
              <input className="input" type="date" value={endDate}
                min={startDate || undefined}
                onChange={e => setEndDate(e.target.value)}/>
            </div>
          </div>

          {startDate && endDate && endDate >= startDate && (
            <div style={{background:'var(--color-cream-dark)',borderRadius:8,padding:'8px 12px',marginBottom:10,fontSize:'.8rem',color:'var(--color-ink-light)'}}>
              {(() => {
                const n = Math.round((new Date(endDate) - new Date(startDate)) / 86400000);
                const existing = (trip.days||[]).length;
                const msg = existing > 0
                  ? n > existing
                    ? `${n - existing} new day${n-existing!==1?'s':''} will be added to your itinerary.`
                    : n < existing
                    ? `${existing - n} day${existing-n!==1?'s':''} will be removed from your itinerary.`
                    : 'Same number of days — no itinerary changes needed.'
                  : `${n + 1} days total.`;
                return `📅 ${n} night${n!==1?'s':''} · ${msg}`;
              })()}
            </div>
          )}

          {error && <p style={{color:'var(--color-flag)',fontSize:'.78rem',marginBottom:8}}>{error}</p>}

          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-secondary" style={{flex:1,padding:'9px'}} onClick={cancel}>Cancel</button>
            <button className="btn btn-primary" style={{flex:2,padding:'9px'}} onClick={save}>Save dates</button>
          </div>
        </>
      )}
    </div>
  );
}

        )}

      {/* Backup / Restore footer */}
      <div style={{maxWidth:720,margin:'0 auto',padding:'0 20px 48px',display:'flex',justifyContent:'center',gap:16}}>
        <button
          onClick={()=>{
            const data = JSON.stringify(trips, null, 2);
            const blob = new Blob([data], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `locale-backup-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
            showToast('Backup downloaded.','info',3000);
          }}
          style={{background:'none',border:'1px solid var(--color-border)',borderRadius:20,padding:'6px 14px',color:'var(--color-ink-muted)',fontSize:'.78rem',cursor:'pointer'}}>

            const file = e.target.files?.[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
              try {
                const imported = JSON.parse(ev.target.result);
                if(!Array.isArray(imported)) throw new Error('Not an array');
                const restored = imported.map(t=>normalizeTrip({...t, isDemo:false}));
                const existing = trips.filter(t=>!t.isDemo);
                const merged = [...existing, ...restored.filter(r=>!existing.find(e=>e.id===r.id))];
                saveTrips(merged);
                window.location.reload();
              } catch(err) {
                showToast('Could not restore — invalid backup file.','error',5000);
              }
            };
            reader.readAsText(file);
            e.target.value = '';
          }}/>
        </label>
      </div>
      {/* FAB removed — use "+ New trip" button in header */}
    </div>
  );
}

// ── Share / Import helpers ────────────────────────────────────────────────
function encodeTrip(trip) {
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(trip)))); } catch(e) { return null; }
}
function decodeTrip(str) {
  try { return JSON.parse(decodeURIComponent(escape(atob(str)))); } catch(e) { return null; }
}
function getSharedTripFromHash() {
  const hash = window.location.hash;
  const m = hash.match(/[#&]trip=([A-Za-z0-9+/=]+)/);
  return m ? decodeTrip(m[1]) : null;
}

function SharedTripBanner({ trip, onAccept, onDismiss }) {
  const t = normalizeTrip(trip);
  const dest = (t.destinations||[]).map(d=>d.city).join(' → ') || 'Unknown destination';

function App() {
  const [trips, setTrips] = React.useState(()=>loadTrips());
  const [view, setView] = React.useState('dashboard');
  const [activeTripId, setActiveTripId] = React.useState(null);
  const [showNew, setShowNew] = React.useState(false);
  const [offline, setOffline] = React.useState(!navigator.onLine);
  const [installPrompt, setInstallPrompt] = React.useState(null);
  const [showInstall, setShowInstall] = React.useState(false);
  const [sharedTrip, setSharedTrip] = React.useState(()=>getSharedTripFromHash());

  React.useEffect(()=>{
    const goOffline = ()=>setOffline(true);
    const goOnline = ()=>setOffline(false);
    window.addEventListener('offline',goOffline);
    window.addEventListener('online',goOnline);
    const handler = e=>{e.preventDefault();setInstallPrompt(e);setShowInstall(true);};
    window.addEventListener('beforeinstallprompt',handler);
    return ()=>{
      window.removeEventListener('offline',goOffline);
      window.removeEventListener('online',goOnline);
      window.removeEventListener('beforeinstallprompt',handler);
    };
  },[]);

  const saveAndSet = (newTrips) => { setTrips(newTrips); saveTrips(newTrips); };

  const handleNewTrip = (trip) => {
    try {
      const normalized = normalizeTrip(trip);
      const updated = [...trips, normalized];
      saveAndSet(updated);
      setShowNew(false);
      setActiveTripId(normalized.id);
      setView('detail');
    } catch(err) {
      alert('Save failed: ' + err.message);
      console.error('handleNewTrip error:', err);
    }
  };

  const handleUpdateTrip = (updatedTrip) => {
    const updated = trips.map(t=>t.id===updatedTrip.id?updatedTrip:t);
    saveAndSet(updated);
  };

  const handleDeleteTrip = (id) => {
    saveAndSet(trips.filter(t=>t.id!==id));
    setView('dashboard');
  };

  const handleAcceptSharedTrip = (trip) => {
    const fresh = {...normalizeTrip(trip), id: uuid()};
    const updated = [...trips, fresh];
    saveAndSet(updated);
    setSharedTrip(null);
    window.location.hash = '';
    setActiveTripId(fresh.id);
    setView('detail');
  };

  const handleInstall = async () => {
    if(!installPrompt) return;
    installPrompt.prompt();
    const {outcome} = await installPrompt.userChoice;
    if(outcome==='accepted') setShowInstall(false);
  };

  const activeTrip = trips.find(t=>t.id===activeTripId);

  return (
    <div>
      {sharedTrip && (
        <SharedTripBanner
          trip={sharedTrip}
          onAccept={handleAcceptSharedTrip}
          onDismiss={()=>{ setSharedTrip(null); window.location.hash=''; }}
        />
      )}
      {offline && (
        <div className="offline-banner">📡 Offline — your trips are saved and fully accessible</div>
      )}
      {showInstall && (
        <div className="install-banner">
          <span>📲 Add Locale to your home screen for the best experience</span>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-primary" style={{padding:'6px 14px',fontSize:'.8rem'}} onClick={handleInstall}>Install</button>
            <button className="btn btn-ghost" style={{padding:'6px 14px',fontSize:'.8rem'}} onClick={()=>setShowInstall(false)}>Not now</button>
          </div>
        </div>
      )}
      {view==='dashboard' && (
        <Dashboard trips={trips} onSelectTrip={(id)=>{setActiveTripId(id);setView('detail');}} onNewTrip={()=>setShowNew(true)}/>
      )}
      {view==='detail' && activeTrip && (
        <TripDetail trip={activeTrip} onBack={()=>setView('dashboard')} onUpdateTrip={handleUpdateTrip} onDelete={handleDeleteTrip}/>
      )}
      {showNew && <NewTripSheet onClose={()=>setShowNew(false)} onSave={handleNewTrip}/>}

      {/* ── Bug Report Button ── */}
      <BugReportButton currentView={view}/>
    </div>
  );
}

// ── Error Boundary ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error('Locale caught an error:', error, info);
    // Store error in localStorage for debugging
    try {
      const log = JSON.parse(localStorage.getItem('locale_error_log') || '[]');
      log.unshift({ ts: new Date().toISOString(), msg: error?.message, stack: error?.stack?.slice(0,500) });
      localStorage.setItem('locale_error_log', JSON.stringify(log.slice(0, 10)));
    } catch(e) {}
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{minHeight:'100dvh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px',fontFamily:'var(--font-body)',textAlign:'center',background:'var(--color-cream)'}}>
          <div style={{fontSize:'2.5rem',marginBottom:16}}>😔</div>
          <h2 style={{fontFamily:'var(--font-display)',fontSize:'1.5rem',fontWeight:600,marginBottom:8,color:'var(--color-ink)'}}>Something went wrong</h2>
          <p style={{color:'var(--color-ink-light)',fontSize:'.9rem',maxWidth:340,lineHeight:1.6,marginBottom:24}}>
            Don't worry — your trips are safe in local storage. Try refreshing the page. If the problem persists, tap below to reset.
          </p>
          <div style={{display:'flex',flexDirection:'column',gap:10,width:'100%',maxWidth:280}}>
            <button
              style={{background:'var(--color-accent)',color:'#fff',border:'none',borderRadius:10,padding:'12px 20px',fontSize:'.9rem',cursor:'pointer',fontFamily:'var(--font-body)'}}
              onClick={()=>window.location.reload()}>
              🔄 Refresh the app
            </button>
            <button
              style={{background:'transparent',color:'var(--color-ink-muted)',border:'1px solid var(--color-border)',borderRadius:10,padding:'10px 20px',fontSize:'.85rem',cursor:'pointer',fontFamily:'var(--font-body)'}}
              onClick={()=>{
                const log = JSON.parse(localStorage.getItem('locale_error_log')||'[]');
                const body = encodeURIComponent('Error log:\n\n' + JSON.stringify(log, null, 2));
                window.location.href = 'mailto:?subject=Locale%20Error%20Report&body=' + body;
              }}>
              📧 Send error report
            </button>
          </div>
          {this.state.error?.message && (
            <p style={{marginTop:20,fontSize:'.75rem',color:'var(--color-ink-muted)',fontFamily:'monospace',maxWidth:400,wordBreak:'break-all'}}>
              {this.state.error.message}
            </p>
          )}
        </div>
      );
    }
    return this.props.children;
  }
}

// ── Inline Test Suite ───────────────────────────────────────────────────────
(function runTests() {
  let passed = 0, failed = 0;
  function assert(label, condition) {
    if (condition) {
      passed++;
    } else {
      failed++;
      console.error(`❌ TEST FAILED: ${label}`);
      try {
        const log = JSON.parse(localStorage.getItem('locale_error_log') || '[]');
        log.unshift({ time: new Date().toISOString(), type: 'test_failure', message: label });
        localStorage.setItem('locale_error_log', JSON.stringify(log.slice(0, 50)));
      } catch(_) {}
    }
  }

  // uuid
  const id1 = uuid(), id2 = uuid();
  assert('uuid returns string', typeof id1 === 'string');
  assert('uuid has length 36', id1.length === 36);
  assert('uuid is unique', id1 !== id2);
  assert('uuid matches pattern', /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(id1));

  // normalizeTrip
  const bare = { title: 'Test Trip', startDate: '2026-09-01', endDate: '2026-09-05' };
  const normed = normalizeTrip(bare);
  assert('normalizeTrip sets schemaVersion', normed.schemaVersion === SCHEMA_VERSION);
  assert('normalizeTrip preserves title', normed.title === 'Test Trip');
  assert('normalizeTrip adds empty destinations array', Array.isArray(normed.destinations));
  assert('normalizeTrip adds empty days array', Array.isArray(normed.days));
  assert('normalizeTrip adds collaborators array', Array.isArray(normed.collaborators));
  assert('normalizeTrip adds lodging array', Array.isArray(normed.lodging));
  assert('normalizeTrip adds flights array', Array.isArray(normed.flights));

  // normalizeTrip legacy fields
  const legacy = { name: 'Old Trip', travelPeriod: { depart: '2026-10-01', return: '2026-10-07' } };
  const normedLegacy = normalizeTrip(legacy);
  assert('normalizeTrip maps name→title', normedLegacy.title === 'Old Trip');
  assert('normalizeTrip maps travelPeriod.depart→startDate', normedLegacy.startDate === '2026-10-01');
  assert('normalizeTrip maps travelPeriod.return→endDate', normedLegacy.endDate === '2026-10-07');

  // generateChecklist
  const cl = generateChecklist({ title: 'Paris Trip', startDate: '2026-09-15', endDate: '2026-09-20', destinations: [{ city: 'Paris', country: 'France' }] });
  assert('generateChecklist returns array', Array.isArray(cl));
  assert('generateChecklist has items', cl.length > 0);
  assert('generateChecklist items have id', cl.every(c => c.id));
  assert('generateChecklist items have label', cl.every(c => typeof c.label === 'string'));
  assert('generateChecklist items have completed bool', cl.every(c => typeof c.completed === 'boolean'));
  assert('generateChecklist items have category', cl.every(c => c.category));

  // buildPackingDefaults
  const packing = buildPackingDefaults({ startDate: '2026-09-15', endDate: '2026-09-20', destinations: [{ city: 'London', country: 'UK' }] });
  assert('buildPackingDefaults returns array', Array.isArray(packing));
  assert('buildPackingDefaults has items', packing.length > 0);
  assert('buildPackingDefaults items have name', packing.every(p => typeof p.name === 'string'));

  // CITY_TO_COUNTRY lookup
  assert('CITY_TO_COUNTRY has london→GB', CITY_TO_COUNTRY['london']?.countryCode === 'GB');
  assert('CITY_TO_COUNTRY has paris→FR', CITY_TO_COUNTRY['paris']?.countryCode === 'FR');

  // CITY_DATA lookup
  assert('CITY_DATA has GB entry', !!CITY_DATA['GB']);
  assert('CITY_DATA has FR entry', !!CITY_DATA['FR']);
  assert('CITY_DATA.GB has transport', typeof CITY_DATA['GB'].transport === 'string');

  // CITY_LOCAL_TIPS
  assert('CITY_LOCAL_TIPS has london', !!CITY_LOCAL_TIPS['london']);
  assert('CITY_LOCAL_TIPS has paris', !!CITY_LOCAL_TIPS['paris']);
  assert('CITY_LOCAL_TIPS london is object', typeof CITY_LOCAL_TIPS['london'] === 'object' && !Array.isArray(CITY_LOCAL_TIPS['london']));

  // Summary
  if (failed === 0) {
    console.log(`%c✅ All ${passed} Locale tests passed`, 'color:#2B5F6E;font-weight:bold;font-size:13px');
  } else {
    console.warn(`%c⚠️ ${failed} of ${passed + failed} Locale tests FAILED — check errors above`, 'color:#C05621;font-weight:bold;font-size:13px');
  }
})();

// PWA Manifest via Blob URL
const manifest = {
  name: "Locale — Your trips, beautifully kept.",
  short_name: "Locale",
  description: "Your trips, beautifully kept.",
  start_url: ".",
  display: "standalone",
  background_color: "#F5F2EC",

  orientation: "portrait-primary",
  icons: [

    { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232B5F6E'/><text y='.9em' font-size='70' x='15'>✈️</text></svg>", sizes: "512x512", type: "image/svg+xml" }
  ]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
const manifestUrl = URL.createObjectURL(manifestBlob);
document.getElementById('manifest-link').href = manifestUrl;

// Service Worker via Blob URL — cache-first offline strategy
const swCode = `
const CACHE = 'locale-v6';
const STATIC = [
  'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap',
  'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js',
];

self.addEventListener('install', e => {
  self.skipWaiting();
  e.waitUntil(
    caches.open(CACHE).then(c => {
      // Cache external CDN assets; ignore failures (font subsets load separately)
      return Promise.allSettled(STATIC.map(url => c.add(url)));
    })
  );
});

self.addEventListener('activate', e => {
  // Remove old cache versions
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    ).then(() => clients.claim())
  );
});

self.addEventListener('fetch', e => {
  const { request } = e;
  const url = new URL(request.url);

  // Navigation requests: serve the cached app shell (the single HTML file)
  if (request.mode === 'navigate') {
    e.respondWith(
      caches.match(request)
        .then(cached => cached || fetch(request).then(res => {
          const clone = res.clone();
          caches.open(CACHE).then(c => c.put(request, clone));
          return res;
        }))
